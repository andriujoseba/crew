name: ci-floor
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['fleet-floor/**', '.github/workflows/ci-floor.yml']
  # Main keeps the pre-split invariant: both halves run after every merge.
  push:
    branches: [main]

concurrency:
  group: ci-floor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ci-floor
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Floor-only PRs must not escape the shell gates that covered these files
      # before the split.
      - name: bash -n (floor syntax)
        run: |
          set -e
          for f in fleet-floor/build.sh fleet-floor/server/probe.sh fleet-floor/test/run.sh fleet-floor/test/*.sh fleet-floor/test/stub-box; do
            bash -n "$f"
          done
      - name: shellcheck (floor)
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -x fleet-floor/build.sh fleet-floor/server/probe.sh fleet-floor/test/*.sh fleet-floor/test/stub-box
      - name: python syntax (collector)
        run: python3 -m py_compile fleet-floor/server/floor.py
      - name: fleet-floor tests (collector + page)
        run: |
          npm install --no-save playwright-core >/dev/null
          for c in "$CHROME_PATH" /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            [ -n "$c" ] && [ -x "$c" ] && { export PW_CHROME="$c"; break; }
          done
          echo "browser: ${PW_CHROME:-<none found>}"
          FLOOR_TEST_REQUIRE_BROWSER=1 fleet-floor/test/run.sh
      - name: index.html is up to date
        run: |
          fleet-floor/build.sh
          git diff --exit-code -- fleet-floor/index.html \
            || { echo "::error::fleet-floor/index.html is stale — run fleet-floor/build.sh"; exit 1; }

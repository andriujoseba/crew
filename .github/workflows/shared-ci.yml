name: shared-ci
on:
  pull_request:
    # `ready_for_review` is what makes the draft gate below safe rather than a
    # trap: without it the builder marks the PR ready, no event fires, and the
    # head carries no check for the round to be requested against. The other
    # three are GitHub's default set, written out because naming `types:` at
    # all replaces that default — dropping `reopened` would leave a reopened
    # non-draft PR in exactly the checkless state this trigger exists to
    # prevent.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['shared/**', 'cli/**', 'drill/**', 'fleet-floor/**', 'examples/**', 'install.sh', 'dist/**', '.github/workflows/shared-ci.yml']
  push:
    branches: [main]
    paths: ['shared/**', 'cli/**', 'drill/**', 'fleet-floor/**', 'examples/**', 'install.sh', 'dist/**', '.github/workflows/shared-ci.yml']

# Unlike the labels reconciler (ceremony#199), shared-ci only reads a tree and
# reports: a superseded run has no partial writes to preserve. Keying on ref
# means only a newer run for the same PR or branch can cancel it; PR merge refs
# and refs/heads/main cannot cancel one another. The current head's run survives,
# so cancelled superseded heads never weaken the panel's green-head rule (#137).
concurrency:
  group: shared-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A draft is the builder's own statement that the tree is not a proposal
    # yet — CONTRIBUTING opens PRs as drafts while building, and the round
    # protocol requires a push every 15 minutes with WIP commits explicitly
    # fine, so those pushes are saves, not proposals. Half of this suite's runs
    # were on trees nobody had asked anyone to read (#136).
    #
    # Gate on the EVENT PAYLOAD, never on a label. `state:building` is derived
    # from this same draft bit by ceremony's reconciler, so a label gate reads
    # a shadow of a fact already in the payload and inherits the reconciler's
    # timing. Worse, a label write can fail — and a failed write here means no
    # check at a ready head, which is indistinguishable from an unfinished one
    # and sits in the merge path. The payload cannot be missing. Do not "fix"
    # this into a label.
    #
    # The `event_name` disjunct keeps push-to-main exactly as it was: a push
    # carries no pull_request object, and saying so out loud beats leaning on
    # GitHub's null-to-false coercion on the branch that gates main.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax)
        run: |
          set -e
          for f in install.sh dist/*.sh shared/bin/*.sh shared/lib/*.sh shared/install.sh shared/test/run.sh shared/test/claim.test.sh shared/test/install-lifecycle.sh shared/test/artifact.sh shared/test/install-drill.sh cli/crew drill/*.sh fleet-floor/build.sh fleet-floor/server/probe.sh \
                   fleet-floor/test/run.sh fleet-floor/test/stub-box; do
            bash -n "$f"
          done
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -x install.sh dist/*.sh shared/bin/*.sh shared/lib/*.sh shared/install.sh shared/test/run.sh shared/test/claim.test.sh shared/test/install-lifecycle.sh shared/test/artifact.sh shared/test/install-drill.sh cli/crew drill/*.sh fleet-floor/server/probe.sh fleet-floor/test/*.sh fleet-floor/test/stub-box shared/conf/fleet.defaults.conf examples/fleet.conf shared/conf/agents/*.conf shared/conf/roles/*.conf
      - name: fixture tests
        run: shared/test/run.sh
      # The installer, driven OFFLINE against the tree under review (box's
      # ci.yml installs this same way). Asserts the versioned layout,
      # root-resolution through the current symlink, coexistence/flip, the
      # converging re-run, and — the must-fail case in #95's test plan — that an
      # interrupted CREW_REINSTALL never leaves `current` resolving to nothing.
      - name: install lifecycle (offline — layout, root-resolution, interrupt-safe reinstall)
        run: shared/test/install-lifecycle.sh
      # The self-contained scp-able artifact (crew#98), built and installed
      # OFFLINE: checksum-verified before unpack, a truncated copy refuses
      # without touching $DEST, artifact and CREW_INSTALL_SOURCE install
      # identical trees, and the builder is generic (a non-crew tree builds too).
      - name: installer artifact (offline — checksum-before-unpack, byte-identical, generic)
        run: shared/test/artifact.sh
      - name: installer drill contract (offline — dry-run, interlock, no duplicated assertions)
        run: shared/test/install-drill.sh
      # The collector is the only Python in the repo, and the only thing that
      # can power-cycle a box — it does not get to skip the syntax gate.
      - name: python syntax (collector)
        run: python3 -m py_compile fleet-floor/server/floor.py
      # The collector and the page, against a stub `box` CLI — no Incus, no
      # fleet. playwright-core drives the runner's preinstalled Chrome, so this
      # costs one small npm package and no browser download.
      #
      # FLOOR_TEST_REQUIRE_BROWSER turns the page half's "skip" into a failure.
      # Locally a skip is right — not every machine has a browser. In CI it is
      # not: a skipped UI test reads exactly like a passing one, and the
      # previous version of this step said so in a comment while `|| true` on
      # the install made it possible. Here, missing driver or missing browser
      # is a red build, not a quiet one.
      - name: fleet-floor tests (collector + page)
        run: |
          npm install --no-save playwright-core >/dev/null
          for c in "$CHROME_PATH" /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            [ -n "$c" ] && [ -x "$c" ] && { export PW_CHROME="$c"; break; }
          done
          echo "browser: ${PW_CHROME:-<none found>}"
          FLOOR_TEST_REQUIRE_BROWSER=1 fleet-floor/test/run.sh
      # index.html is committed pre-built; a PR that edits src/ and forgets to
      # run build.sh would ship a page that does not match its source.
      - name: index.html is up to date
        run: |
          fleet-floor/build.sh
          git diff --exit-code -- fleet-floor/index.html \
            || { echo "::error::fleet-floor/index.html is stale — run fleet-floor/build.sh"; exit 1; }

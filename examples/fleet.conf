# fleet.conf — example operator configuration, transported by the host.
#
# This file is the operator-owned layer for values that vary by fleet. Shipped
# runtime defaults live in shared/conf/fleet.defaults.conf; change this layer
# and redeploy to transport fleet policy everywhere.
#
# shellcheck shell=bash disable=SC2034
#
# EVERY IDENTITY BELOW IS AN ILLUSTRATION — REPLACE IT. They are the
# heavy-duty fleet's own GitHub logins, kept here because a worked example
# beats a placeholder nobody can match against a real board. They are inert
# on their own: with repos.txt shipping empty (#216), nothing addresses them
# until an operator names a repository. Running someone else's bench against
# your boards is not a mistake crew can catch for you.

# The review bench: the default panel when a repo's .github/labels.conf has
# no panel= line. A repo may override one builder with
# panel[builder-login]=reviewer-a reviewer-b; panel_for_repo() prefers that
# author line, then the repo's panel= line, so this list is only the fallback.
# REPLACE ME with your fleet's reviewer identities.
FLEET_BENCH="claude-bot-andresmgsl codex-bot-andresmgsl grok-bot-andresmgsl kimi-bot-andresmgsl"

# Triage never votes on PRs; a review request to it sits outstanding forever.
# REPLACE ME with your fleet's triage identity.
FLEET_TRIAGE="dan-claude-bot"

# The only identity that merges. REPLACE ME with your maintainer's login.
FLEET_HUMAN="danmt"

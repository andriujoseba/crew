# fleet.conf — example operator configuration, transported by the host.
#
# This file is the operator-owned layer for values that vary by fleet. Shipped
# runtime defaults live in shared/conf/fleet.defaults.conf; change this layer
# and redeploy to transport fleet policy everywhere.
#
# shellcheck shell=bash disable=SC2034

# The review bench: the default panel when a repo's .github/labels.conf has
# no panel= line. panel_for_repo() prefers the repo's own line — per
# BUILDER.md the repo config governs, this list is only the fallback.
FLEET_BENCH="claude-bot-andresmgsl codex-bot-andresmgsl grok-bot-andresmgsl kimi-bot-andresmgsl"

# Triage never votes on PRs; a review request to it sits outstanding forever.
FLEET_TRIAGE="dan-claude-bot"

# The only identity that merges.
FLEET_HUMAN="danmt"

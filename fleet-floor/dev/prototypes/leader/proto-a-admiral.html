<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ADMIRAL — leader prototype A</title>
<style>
  html,body{margin:0;background:#04060a;height:100%;font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0}
  canvas{display:block;background:#000;border-radius:6px;max-width:94vw;height:auto}
  #bar{margin-top:12px;display:flex;gap:8px}
  #bar button{font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:7px 14px;background:#0a0f16;border:1px solid #1c2733;border-radius:7px;color:#7d8ba0;cursor:pointer}
  #bar button.on{color:#ffd98c;border-color:#5c4a22;background:#1c160a}
  #cap{margin-top:10px;font-size:11px;color:#55657a;letter-spacing:.06em}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="bar">
    <button data-st="working">working</button>
    <button data-st="idle">idle</button>
    <button data-st="offline">offline</button>
  </div>
  <div id="cap">ADMIRAL (LD-01) — role droid, not a vendor · parade rest · the cap is armour, not a hat</div>
</div>
<script>
/* ============================================================================
   LEADER PROTO A — "ADMIRAL" (LD-01)                              crew#225

   The first ROLE droid: tied to the leader's chair, not to a vendor. The
   brief evolved from captain to ADMIRAL — the crimson sash read dictator
   and is gone; rank lives in the cap, the boards and the bill filigree
   now. The leader never writes code, so it carries no tools: it stands
   at PARADE REST — legs planted shoulder-width, arms clasped behind the
   back so the silhouette is all chest, boards and cap. Fleet grammar
   throughout: plate()/rim/emissive buffers, no assets, no deps.

     · peaked cap assembly — armoured crown overhanging a brass-banded
       headband, laurel-and-star crest, gold oak-leaf filigree on the
       glossy bill (the admiral's scrambled eggs), a notch shot out of
       the bill's edge. The one shape that reads LEADER at grid size.
     · greatcoat torso — double row of brass closure studs, eight
       service ribbons, a welded patch plate where armour was replaced
     · squared pauldrons with stepped shoulder boards, four rank bars,
       the left board's brass edge broken by an old hit
     · war-veteran everywhere: hard slit optics under the bill, a crack
       running bill-to-cheek through the visor glass, grime weeping from
       bolts, scorched hem, patched thigh, chipped boots
     · offline it stays at attention — an admiral does not slump — but
       the crest dies, the optics go dark, the beacon rakes the cap
   ========================================================================== */
var cv=document.getElementById("cv"), S=cv.getContext("2d");
/* LANDSCAPE STAGE. The fleet's rooms are 16:9 and the unit is one figure
   standing in them, not the whole picture. So the robot keeps its own
   520x640 buffer — every coordinate in drawUnit is unchanged — and that
   buffer is composited onto a 1280x720 stage at UOX/UOY. The room is then
   authored in stage coordinates with room to actually be a room. */
var SW=1280, SH=720;                 // the stage
var W=520,H=640;                     // the unit's own buffer
var UOX=250, UOY=80;                 // where the buffer lands on the stage
var GYS=640;                         // the stage's deck line
var UX=UOX+260;                      // the unit's centre, in stage coords
var body=document.createElement("canvas"),emis=document.createElement("canvas"),rim=document.createElement("canvas");
[body,emis,rim].forEach(function(c){c.width=W;c.height=H;});
var RB=body.getContext("2d"),RE=emis.getContext("2d"),RR=rim.getContext("2d");

function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}}
function poly(c,pts){c.beginPath();for(var i=0;i<pts.length;i++){if(i)c.lineTo(pts[i][0],pts[i][1]);else c.moveTo(pts[i][0],pts[i][1]);}c.closePath();}
function plate(c,pts,top,bot,ed){var y0=1e9,y1=-1e9;for(var i=0;i<pts.length;i++){if(pts[i][1]<y0)y0=pts[i][1];if(pts[i][1]>y1)y1=pts[i][1];}var gg=c.createLinearGradient(0,y0,0,y1);gg.addColorStop(0,top);gg.addColorStop(1,bot);poly(c,pts);c.fillStyle=gg;c.fill();if(ed){c.strokeStyle=ed;c.lineWidth=1.2;c.lineJoin="round";c.stroke();}}
function pl(c,x0,y0,x1,y1,col,w){c.strokeStyle=col;c.lineWidth=w||1;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}
function cavity(c,x,y,w,h,a){var gg=c.createLinearGradient(0,y,0,y+h);gg.addColorStop(0,"rgba(2,5,9,"+a+")");gg.addColorStop(1,"rgba(2,5,9,0)");c.fillStyle=gg;c.fillRect(x,y,w,h);}
function bolt(c,x,y,r,lit){c.fillStyle="#05080e";c.beginPath();c.arc(x,y,r,0,7);c.fill();
  var gg=c.createRadialGradient(x-r*0.3,y-r*0.4,0.4,x,y,r);gg.addColorStop(0,"rgba(200,214,238,"+(lit||0.35)+")");gg.addColorStop(1,"rgba(4,8,14,0.8)");
  c.fillStyle=gg;c.beginPath();c.arc(x,y,r*0.66,0,7);c.fill();
  pl(c,x-r*0.34,y,x+r*0.34,y,"rgba(3,6,11,0.85)",1);}
function seg(c,x0,y0,x1,y1,w0,w1,top,bot,ed){var dx=x1-x0,dy=y1-y0,ln=Math.hypot(dx,dy)||1,nx=-dy/ln,ny=dx/ln;
  plate(c,[[x0+nx*w0,y0+ny*w0],[x1+nx*w1,y1+ny*w1],[x1-nx*w1,y1-ny*w1],[x0-nx*w0,y0-ny*w0]],top,bot,ed);}

var qs=new URLSearchParams(location.search);
var STATE=qs.get("state")||"working";
var reduced=qs.get("t")!==null;
var T0=qs.get("t")===null?0:Number(qs.get("t"));

document.querySelectorAll("#bar button").forEach(function(b){
  if(b.dataset.st===STATE)b.classList.add("on");
  b.onclick=function(){location.search="?state="+b.dataset.st;};
});

function drawUnit(t,st){
  var offl=st==="offline", work=st==="working";
  [RB,RE,RR].forEach(function(c){c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);c.globalAlpha=1;c.globalCompositeOperation="source-over";});
  var g=RB, cx=260, GY=560;
  // steel: cool officer grey-blue, a shade cleaner than a builder's plate
  var sT="#2b3546",sM="#151c29",sB="#090d14",ed="#333f54",eH="#48566e",rc="#05080e";
  if(offl){sT="#1c222d";sM="#0e121a";sB="#06090f";ed="#232a36";eH="#2b3342";}
  // antique command brass — the role's colour, no vendor anywhere
  var BR=offl?[76,80,90]:[194,150,72], BRH=offl?[118,122,132]:[236,200,128];
  function br(a){return "rgba("+BR[0]+","+BR[1]+","+BR[2]+","+a+")";}
  function brh(a){return "rgba("+BRH[0]+","+BRH[1]+","+BRH[2]+","+a+")";}
  // grime weeping from a bolt: albedo, so it does not dim with power state
  function weep(x,y,len){g.fillStyle="rgba(66,46,26,0.32)";
    poly(g,[[x-1.2,y+2],[x+1.2,y+2],[x+0.6,y+len],[x-0.6,y+len]]);g.fill();}
  /* the machine under the uniform: coil springs, hydraulic pistons, hoses.
     An admiral's coat is armour over a war chassis, and the chassis shows
     at every joint. */
  function spring(x0,y0,x1,y1,n,r){
    var dx=x1-x0,dy=y1-y0,ln=Math.hypot(dx,dy)||1,nx=-dy/ln,ny=dx/ln,pts=[[x0,y0]];
    for(var i2=1;i2<n*2;i2++){var u=i2/(n*2),s2=(i2%2?1:-1);
      pts.push([x0+dx*u+nx*r*s2,y0+dy*u+ny*r*s2]);}
    pts.push([x1,y1]);
    g.strokeStyle="rgba(5,8,14,0.9)";g.lineWidth=3;g.lineJoin="round";g.beginPath();
    pts.forEach(function(p,i3){i3?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);});g.stroke();
    g.strokeStyle="rgba(152,166,192,"+(offl?0.16:0.4)+")";g.lineWidth=1.2;g.beginPath();
    pts.forEach(function(p,i3){i3?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);});g.stroke();}
  function piston(x0,y0,x1,y1,w){
    var mx3=x0+(x1-x0)*0.55,my3=y0+(y1-y0)*0.55;
    pl(g,x0,y0,mx3,my3,"#0a0f18",w);
    pl(g,x0,y0,mx3,my3,"rgba(140,154,182,"+(offl?0.08:0.22)+")",1.1);
    pl(g,mx3,my3,x1,y1,"rgba(190,204,228,"+(offl?0.14:0.5)+")",w*0.42);}
  function hose(x0,y0,x1,y1,sag,w){
    var mx3=(x0+x1)/2,my3=Math.max(y0,y1)+sag;
    g.strokeStyle="rgba(10,15,23,0.96)";g.lineWidth=w;
    g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(mx3,my3,x1,y1);g.stroke();
    g.strokeStyle="rgba(120,132,156,"+(offl?0.1:0.3)+")";g.lineWidth=w*0.3;
    g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(mx3,my3,x1,y1);g.stroke();}
  var pulse=offl?0:(work?(0.6+0.24*Math.sin(t*5)):(0.36+0.12*Math.sin(t*1.8)));
  var breath=(offl)?0:Math.sin(t*1.3)*1.8;

  /* ---- 0 · BACK CABLES, then ARMS: parade rest. The power trunks loop
     out of the collar and dive into the lower back — drawn first so the
     coat and arms overlap them; what survives is the slack bowing out
     through the elbow gap. Doom units trail cables. ---- */
  [-1,1].forEach(function(sg){
    [[40,132,44,76,152],[30,116,80,64,168]].forEach(function(cb,ci){
      var x0=cx+sg*cb[0],y0=TY-14+breath,mx2=cx+sg*cb[1],my2=TY+cb[2]+breath,x1=cx+sg*cb[3],y1=TY+cb[4]+breath*0.5;
      g.strokeStyle="#05080e";g.lineWidth=ci?4.4:5.4;g.beginPath();
      g.moveTo(x0,y0);g.quadraticCurveTo(mx2,my2,x1,y1);g.stroke();
      g.strokeStyle=offl?"#2b323e":"#5d6a82";g.lineWidth=1.5;g.beginPath();
      g.moveTo(x0,y0);g.quadraticCurveTo(mx2,my2,x1,y1);g.stroke();});
  });
  [-1,1].forEach(function(sg){
    var shx=cx+sg*100, shy=254+breath, elx=cx+sg*124, ely=336+breath;
    seg(g,shx,shy,elx,ely,15,11,sM,sB,ed);                       // upper arm, swept back
    piston(shx+sg*11,shy+4,elx+sg*4,ely-10,4.6);                 // the arm's own hydraulic
    /* FOREARM FIRST, then the joint on top of it. Drawn the other way round
       the forearm was a flat grey slab pasted over the elbow — the joint has
       to cap the limb for the limb to read as bolted INTO it. It is also
       plated like the rest of the arm now, not a dark blank: a tapered
       segment, a bolted armour strip along its upper edge, and a cuff
       collar where it disappears behind the back. */
    var fwx=cx+sg*38, fwy=372+breath;
    seg(g,elx,ely,fwx,fwy,11,8.5,sM,sB,ed);
    seg(g,elx+sg*1,ely+3,fwx,fwy-2,6,4.5,sT,sM,ed);              // armour strip on top
    pl(g,elx-sg*4,ely+7,fwx-sg*3,fwy+2,"rgba(6,9,15,0.8)",2.6);  // underside channel
    pl(g,elx-sg*4,ely+7,fwx-sg*3,fwy+2,"rgba(140,154,182,"+(offl?0.06:0.18)+")",1);
    bolt(g,elx+sg*10,ely+9,1.9,offl?0.05:0.16);
    bolt(g,fwx-sg*6,fwy-6,1.9,offl?0.05:0.16);
    // cuff collar where the forearm passes behind the coat
    plate(g,[[fwx-sg*3,fwy-11],[fwx+sg*9,fwy-8],[fwx+sg*8,fwy+5],[fwx-sg*4,fwy+3]],sT,sB,ed);
    pl(g,fwx-sg*2,fwy-10,fwx+sg*8,fwy-7,"rgba(198,216,246,"+(offl?0.06:0.2)+")",1.1);
    // elbow: a REAL joint, capping both segments — ring, hub bolt, horn, grease
    g.fillStyle="#04070c";g.beginPath();g.arc(elx,ely,11.5,0,7);g.fill();
    g.strokeStyle=eH;g.lineWidth=1.3;g.beginPath();g.arc(elx,ely,11.5,0,7);g.stroke();
    var ejg=g.createRadialGradient(elx-sg*3,ely-4,1,elx,ely,10);
    ejg.addColorStop(0,"rgba(158,176,206,"+(offl?0.16:0.4)+")");
    ejg.addColorStop(0.6,"rgba(48,60,78,0.5)");ejg.addColorStop(1,"rgba(3,7,12,0.8)");
    g.fillStyle=ejg;g.beginPath();g.arc(elx,ely,9,0,7);g.fill();
    g.strokeStyle="rgba(4,8,14,0.9)";g.lineWidth=1;
    g.beginPath();g.arc(elx,ely,4.6,0,7);g.stroke();
    bolt(g,elx,ely,2.4,offl?0.08:0.26);
    weep(elx,ely+10,7);
    plate(g,[[elx-sg*2,ely-15],[elx+sg*10,ely-10],[elx+sg*8,ely-2]],sM,sB,ed); // guard horn
    // hose from the chest side into the upper arm, swinging under the pit
    hose(cx+sg*66,296+breath,shx-sg*2,shy+34,10,4.2);
    hose(elx+sg*8,ely+8,fwx+sg*4,fwy-4,7,3.2);   // feed across the elbow
  });

  /* ---- 1 · LEGS: planted shoulder-width, dead vertical. ---- */
  [-1,1].forEach(function(sg){
    var lx=cx+sg*34;
    // boot: heavy, squared toe, polished catch along the welt
    plate(g,[[lx-29,GY-50],[lx+29,GY-50],[lx+34,GY],[lx-34,GY]],sT,sB,ed);
    plate(g,[[lx-34,GY-11],[lx+34,GY-11],[lx+34,GY],[lx-34,GY]],"#0c1119","#03050a",null);
    // toe cap: its own plate over the boot, scuffed at the leading edge
    plate(g,[[lx-29,GY-24],[lx+29,GY-24],[lx+34,GY-10],[lx-34,GY-10]],sM,sB,ed);
    pl(g,lx-27,GY-23,lx+27,GY-23,"rgba(186,208,242,"+(offl?0.05:0.14)+")",1.1);
    bolt(g,lx-20,GY-16,1.8,offl?0.04:0.14);bolt(g,lx+20,GY-16,1.8,offl?0.04:0.14);
    pl(g,lx-32,GY-12,lx+32,GY-12,"rgba(198,214,242,"+(offl?0.07:0.2)+")",1.3); // shine line
    // shin plate + knee guard
    plate(g,[[lx-23,442],[lx+23,442],[lx+26,GY-42],[lx-26,GY-42]],sM,sB,ed);
    pl(g,lx,446,lx,GY-42,"rgba(4,8,14,0.5)",1.3);                 // trouser crease, pressed
    // knee cop: a domed plate over the joint with a spur, not a flat tile
    plate(g,[[lx-23,420],[lx+23,420],[lx+27,442],[lx+22,456],[lx-22,456],[lx-27,442]],sT,sB,ed);
    pl(g,lx-21,422,lx+21,422,"rgba(206,222,248,"+(offl?0.07:0.22)+")",1.3);
    plate(g,[[lx+sg*18,432],[lx+sg*31,438],[lx+sg*20,446]],sM,sB,ed);       // knee spur
    // shin centre ridge + side ribs
    pl(g,lx,460,lx,GY-46,"rgba(206,222,248,"+(offl?0.05:0.14)+")",1.2);
    for(var sr=0;sr<3;sr++){pl(g,lx-19,470+sr*16,lx-13,470+sr*16,"rgba(4,8,14,0.6)",2);
      pl(g,lx+13,470+sr*16,lx+19,470+sr*16,"rgba(4,8,14,0.6)",2);}
    cavity(g,lx-25,448,50,7,0.5);
    bolt(g,lx,436,2.6,offl?0.06:0.22);
    bolt(g,lx-14,442,1.7,offl?0.04:0.13);bolt(g,lx+14,442,1.7,offl?0.04:0.13);
    weep(lx,438,8);
    // thigh
    plate(g,[[lx-26,380],[lx+26,380],[lx+23,430],[lx-23,430]],sM,sB,ed);
    plate(g,[[lx-20,384],[lx+20,384],[lx+18,412],[lx-18,412]],sT,sB,ed);   // thigh plate
    pl(g,lx-19,386,lx+19,386,"rgba(198,216,246,"+(offl?0.05:0.16)+")",1.2);
    bolt(g,lx-14,406,1.8,offl?0.04:0.14);bolt(g,lx+14,406,1.8,offl?0.04:0.14);
    // gold trouser stripe down the outer seam — flag-rank braid, worn dull
    pl(g,lx+sg*21,386,lx+sg*24,GY-44,br(0.7),2.6);
    pl(g,lx+sg*21,386,lx+sg*24,GY-44,brh(0.28),1);
    // the braid is scuffed through mid-shin on the left leg
    if(sg<0){g.fillStyle=sM;g.fillRect(lx+sg*23-1.6,468,3.2,10);}
    // the chassis at the knee: coil shock outboard, return hose down the calf
    spring(lx+sg*25,422,lx+sg*27,452,6,2.8);
    hose(lx+sg*19,GY-68,lx+sg*25,GY-16,5,3.8);
    // ankle gaiter: ribbed flex joint between shin armour and boot
    for(var gr=0;gr<3;gr++){
      pl(g,lx-18,GY-58+gr*4.6,lx+18,GY-58+gr*4.6,"rgba(4,8,14,0.75)",2);
      pl(g,lx-18,GY-56.8+gr*4.6,lx+18,GY-56.8+gr*4.6,"rgba(130,144,170,"+(offl?0.05:0.13)+")",0.9);}
  });
  // boot chips + old deck-scrape across the left toe
  g.fillStyle="rgba(206,220,242,"+(offl?0.08:0.2)+")";
  g.fillRect(cx-52,GY-30,4,1.6);g.fillRect(cx+18,GY-38,3,1.4);
  pl(g,cx-44,GY-16,cx-30,GY-18.5,"rgba(198,216,246,"+(offl?0.04:0.1)+")",1.1);
  // pelvis block between the thighs — hip shocks and actuator rods exposed
  plate(g,[[cx-30,372],[cx+30,372],[cx+24,404],[cx-24,404]],sM,sB,ed);
  cavity(g,cx-24,372,48,8,0.5);
  [-1,1].forEach(function(sg){
    spring(cx+sg*31,376,cx+sg*25,402,6,3);
    piston(cx+sg*12,376,cx+sg*19,400,3.6);});
  bolt(g,cx,388,2.6,offl?0.06:0.22);

  /* ---- 2 · BELT: broad, dark, brass buckle with the command star ---- */
  plate(g,[[cx-60,356+breath*0.4],[cx+60,356+breath*0.4],[cx+57,380],[cx-57,380]],"#10151f","#05080d",ed);
  var bk={x:cx-15,y:358+breath*0.4,w:30,h:17};
  rr(g,bk.x,bk.y,bk.w,bk.h,2.5);
  var bg2=g.createLinearGradient(0,bk.y,0,bk.y+bk.h);bg2.addColorStop(0,brh(0.9));bg2.addColorStop(1,br(0.75));
  g.fillStyle=bg2;g.fill();g.strokeStyle="rgba(4,8,14,0.8)";g.lineWidth=1;g.stroke();
  star(g,cx,bk.y+bk.h/2,5.6,"rgba(20,16,8,0.85)");
  if(!offl){RE.save();star(RE,cx,bk.y+bk.h/2,5.6,brh(0.16*pulse));RE.restore();}

  /* ---- 3 · TORSO: the greatcoat. One tall trunk, waisted; two coat
     panels meeting on a centre closure; the sash rides on top. ---- */
  /* The torso was one flat trapezoid — claude's unit reads as armour because
     its chest is FACETED: a raised centre slab with the side panels angled
     away from it, so the light breaks across three planes instead of one. */
  var TY=232+breath;
  plate(g,[[cx-92,TY],[cx+92,TY],[cx+58,358+breath*0.4],[cx-58,358+breath*0.4]],sM,sB,ed);
  // raised centre slab, standing proud of the side panels
  plate(g,[[cx-50,TY+4],[cx+50,TY+4],[cx+36,352+breath*0.4],[cx-36,352+breath*0.4]],"#1e2634",sB,ed);
  pl(g,cx-49,TY+5,cx+49,TY+5,"rgba(198,216,246,"+(offl?0.06:0.16)+")",1.3);
  cavity(g,cx-70,TY+2,140,10,0.45);
  // the side panels' own bevel edges, catching from the far side
  pl(g,cx-50,TY+6,cx-36,350+breath*0.4,"rgba(4,8,14,0.5)",1.4);
  pl(g,cx+50,TY+6,cx+36,350+breath*0.4,"rgba(4,8,14,0.5)",1.4);
  pl(g,cx,TY+34,cx,354+breath*0.4,"rgba(4,8,14,0.6)",1.6);            // closure seam
  pl(g,cx-79,TY+2,cx-61,356+breath*0.4,"rgba(4,8,14,0.35)",1.2);      // panel seams
  pl(g,cx+79,TY+2,cx+61,356+breath*0.4,"rgba(4,8,14,0.35)",1.2);
  pl(g,cx-78,TY+1,cx+78,TY+1,"rgba(186,208,242,"+(offl?0.06:0.16)+")",1.3); // clavicle catch
  // double row of brass closure studs — the greatcoat tell
  for(var rw2=0;rw2<4;rw2++){var byy=TY+44+rw2*26;
    [ -16,16 ].forEach(function(bxx){
      g.fillStyle="#05080e";g.beginPath();g.arc(cx+bxx,byy,4.6,0,7);g.fill();
      var sg3=g.createRadialGradient(cx+bxx-1.4,byy-1.6,0.4,cx+bxx,byy,4.4);
      sg3.addColorStop(0,brh(offl?0.25:0.95));sg3.addColorStop(1,br(offl?0.1:0.5));
      g.fillStyle=sg3;g.beginPath();g.arc(cx+bxx,byy,3.6,0,7);g.fill();});}
  /* data conduits: gorget down to the belt, one each side, clipped at three

    S.beginPath();S.arc(hx5,hy5,8,0,7);S.stroke();
  })();
  // binnacle: a hooded compass throwing a small warm pool of its own
  (function(){
    var bx3=636, by3=GYS-118;
    S.fillStyle="#0a0e15";S.fillRect(bx3-15,by3+26,30,92);
    S.fillStyle="#0c1119";S.beginPath();S.ellipse(bx3,by3+118,32,9,0,0,7);S.fill();
    S.fillStyle="#101724";S.beginPath();
    S.moveTo(bx3-26,by3+28);S.lineTo(bx3-20,by3-4);S.lineTo(bx3+20,by3-4);S.lineTo(bx3+26,by3+28);S.closePath();S.fill();
    S.strokeStyle="rgba(150,166,194,"+(0.16*lit)+")";S.lineWidth=1.2;S.stroke();
    if(!offl){
      S.fillStyle=kk(0.5*lit);S.beginPath();S.ellipse(bx3,by3+2,17,6,0,0,7);S.fill();
      S.save();S.globalCompositeOperation="lighter";
      var bg4=S.createRadialGradient(bx3,by3,3,bx3,by3,58);
      bg4.addColorStop(0,kk(0.16*lit));bg4.addColorStop(1,kk(0));
      S.fillStyle=bg4;S.beginPath();S.arc(bx3,by3,58,0,7);S.fill();S.restore();}
  })();
  // voicepipe cluster on the port bulkhead
  (function(){
    var vx=268, vy=402;
    [0,26,52].forEach(function(dv2,vi){
      S.strokeStyle="rgba(6,10,16,0.95)";S.lineWidth=9;
      S.beginPath();S.moveTo(vx+dv2,vy);S.lineTo(vx+dv2,vy+70);
      S.quadraticCurveTo(vx+dv2,vy+94,vx+dv2+(vi-1)*16,vy+96);S.stroke();
      S.strokeStyle="rgba(150,166,194,"+(0.07*lit)+")";S.lineWidth=1.4;
      S.beginPath();S.moveTo(vx+dv2+2,vy);S.lineTo(vx+dv2+2,vy+70);S.stroke();
      var vm=vx+dv2+(vi-1)*16;
      S.fillStyle="rgba(6,10,16,0.9)";S.beginPath();S.ellipse(vm,vy+99,11,5,0,0,7);S.fill();
      S.strokeStyle=kk(0.5*lit);S.lineWidth=1.8;
      S.beginPath();S.ellipse(vm,vy+98,11,5,0,Math.PI*0.04,Math.PI*0.96);S.stroke();
      S.fillStyle=kk(0.2*lit);S.fillRect(vm-8,vy+90,16,4);});
    S.fillStyle="#0a0e15";S.fillRect(vx-16,vy-10,86,16);
    S.fillStyle="rgba(150,166,194,"+(0.07*lit)+")";S.fillRect(vx-16,vy-10,86,1.4);
  })();
  // chart rack: rolled charts standing in a tube rack, starboard
  (function(){
    var rx6=1108, ry6=GYS-72;
    S.fillStyle="#0a0e15";S.fillRect(rx6,ry6,58,72);
    S.strokeStyle="rgba(140,156,184,"+(0.11*lit)+")";S.lineWidth=1;S.strokeRect(rx6,ry6,58,72);
    [0,1,2,3].forEach(function(ci5){
      S.fillStyle=ci5%2?"rgba(126,116,88,"+(0.3*lit+0.1)+")":"rgba(104,96,74,"+(0.26*lit+0.1)+")";
      S.save();S.translate(rx6+10+ci5*13,ry6-4);S.rotate((ci5-1.5)*0.06);
      S.fillRect(-4,-34,8,40);S.restore();});
  })();
  // the ship's bell, hung by the door
  (function(){
    var lx6=86, ly6=430;
    S.strokeStyle="rgba(6,10,16,0.9)";S.lineWidth=3;
    S.beginPath();S.moveTo(lx6,ly6-20);S.lineTo(lx6,ly6-4);S.stroke();
    var bgd=S.createLinearGradient(lx6-16,0,lx6+16,0);
    bgd.addColorStop(0,kk(0.26*lit));bgd.addColorStop(0.34,kk(0.62*lit));bgd.addColorStop(1,kk(0.2*lit));
    S.fillStyle=bgd;S.beginPath();
    S.moveTo(lx6-17,ly6+28);S.quadraticCurveTo(lx6-15,ly6-6,lx6,ly6-6);
    S.quadraticCurveTo(lx6+15,ly6-6,lx6+17,ly6+28);S.closePath();S.fill();
    S.fillStyle="rgba(6,10,16,0.9)";S.beginPath();S.ellipse(lx6,ly6+28,17,5,0,0,7);S.fill();   // mouth
    S.strokeStyle=kk(0.75*lit);S.lineWidth=2;                                                  // lip
    S.beginPath();S.ellipse(lx6,ly6+27,17,5,0,Math.PI*0.05,Math.PI*0.95);S.stroke();
    S.fillStyle=kk(0.34*lit);S.beginPath();S.arc(lx6,ly6+31,3,0,7);S.fill();                   // clapper
    S.fillStyle=kk(0.5*lit);S.fillRect(lx6-6,ly6-9,12,4);                                      // crown
  })();

  /* ---- COLOUR. The room graded itself so thoroughly to brass that the red
     and green were exiled to the far edges and the picture read monochrome.
     Three accents placed INSIDE the composition, each justified: an alarm
     lamp that is the only saturated red near the subject, a green-lit
     gyro repeater, and a cold blue signal lamp on the starboard console. */
  // alarm lamp on a bracket, port of the unit
  (function(){
    var ax2=418, ay2=246;
    S.fillStyle="#0a0e15";S.fillRect(ax2-5,ay2-16,10,16);
    S.fillStyle="#101724";S.beginPath();S.arc(ax2,ay2+9,12,0,7);S.fill();
    S.strokeStyle="rgba(150,166,194,"+(0.16*lit)+")";S.lineWidth=1.2;
    S.beginPath();S.arc(ax2,ay2+9,12,0,7);S.stroke();
    if(!offl){var ap=0.45+0.55*Math.abs(Math.sin(t*1.6));
      S.fillStyle="rgba(228,74,52,"+(0.85*ap)+")";S.beginPath();S.arc(ax2,ay2+9,8,0,7);S.fill();
      S.save();S.globalCompositeOperation="lighter";
      var ag2=S.createRadialGradient(ax2,ay2+9,2,ax2,ay2+9,54);
      ag2.addColorStop(0,"rgba(228,74,52,"+(0.3*ap)+")");ag2.addColorStop(1,"rgba(228,74,52,0)");
      S.fillStyle=ag2;S.beginPath();S.arc(ax2,ay2+9,54,0,7);S.fill();S.restore();}
    else{S.fillStyle="rgba(80,44,40,0.5)";S.beginPath();S.arc(ax2,ay2+9,8,0,7);S.fill();}
  })();
  // gyro repeater, green, standing beside the helm
  (function(){
    var gx2=228, gy2=GYS-118;
    S.fillStyle="#0a0e15";S.fillRect(gx2-9,gy2+22,18,96);
    S.fillStyle="#0c1119";S.beginPath();S.ellipse(gx2,gy2+118,24,7,0,0,7);S.fill();
    S.fillStyle="#101724";S.beginPath();S.arc(gx2,gy2,21,0,7);S.fill();
    S.strokeStyle="rgba(150,166,194,"+(0.16*lit)+")";S.lineWidth=1.2;
    S.beginPath();S.arc(gx2,gy2,21,0,7);S.stroke();
    if(!offl){
      S.fillStyle="rgba(96,206,138,"+(0.3*lit)+")";S.beginPath();S.arc(gx2,gy2,15,0,7);S.fill();
      S.strokeStyle="rgba(150,240,180,"+(0.7*lit)+")";S.lineWidth=1.5;
      var ga=Math.sin(t*0.22)*0.7;
      S.beginPath();S.moveTo(gx2-Math.cos(ga)*13,gy2-Math.sin(ga)*13);
      S.lineTo(gx2+Math.cos(ga)*13,gy2+Math.sin(ga)*13);S.stroke();
      S.save();S.globalCompositeOperation="lighter";
      var gg2=S.createRadialGradient(gx2,gy2,2,gx2,gy2,52);
      gg2.addColorStop(0,"rgba(96,206,138,0.16)");gg2.addColorStop(1,"rgba(96,206,138,0)");
      S.fillStyle=gg2;S.beginPath();S.arc(gx2,gy2,52,0,7);S.fill();S.restore();}
  })();
  // blue signal lamp on the starboard console
  (function(){
    var bx4=1150, by4=GYS-112;
    S.fillStyle="#0a0e15";S.fillRect(bx4-7,by4,14,22);
    if(!offl){var bp2=0.4+0.6*Math.abs(Math.sin(t*0.8+1.4));
      S.fillStyle="rgba(96,168,236,"+(0.8*bp2)+")";S.fillRect(bx4-5,by4+3,10,9);
      S.save();S.globalCompositeOperation="lighter";
      var bg5=S.createRadialGradient(bx4,by4+8,2,bx4,by4+8,40);
      bg5.addColorStop(0,"rgba(96,168,236,"+(0.2*bp2)+")");bg5.addColorStop(1,"rgba(96,168,236,0)");
      S.fillStyle=bg5;S.beginPath();S.arc(bx4,by4+8,40,0,7);S.fill();S.restore();}
  })();

  /* ============ deck ============ */
  /* The room was one flat floor plane, so everything sat at the same
     distance. There is a raised command platform now: the unit stands on
     it, the furniture stands off it, and the step's own riser and nosing
     give the eye something to measure depth against. */
  S.fillStyle=offl?"#07090c":"#0c1017";S.fillRect(0,GYS,SW,SH-GYS);
  (function(){
    var px5=300, pw2=560, ptop=GYS-16;
    S.fillStyle=offl?"#080b0f":"#0e131b";
    S.beginPath();S.moveTo(px5,ptop);S.lineTo(px5+pw2,ptop);
    S.lineTo(px5+pw2+34,GYS+30);S.lineTo(px5-34,GYS+30);S.closePath();S.fill();
    S.fillStyle="rgba(150,166,194,"+(0.07*lit)+")";S.fillRect(px5,ptop,pw2,2);   // nosing
    S.fillStyle="rgba(3,6,11,0.55)";S.fillRect(px5-34,GYS+26,pw2+68,5);
    for(var tr=0;tr<9;tr++){                                     // tread strips
      pl(S,px5+18+tr*62,ptop+5,px5+12+tr*62,GYS+26,"rgba(4,8,14,0.45)",1.2);}
  })();
  pl(S,0,GYS,SW,GYS,"rgba(120,140,170,0.14)",1);
  for(var dp2=0;dp2<5;dp2++)pl(S,0,GYS+14+dp2*16,SW,GYS+14+dp2*16,"rgba(4,8,14,0.5)",1);
  for(var dv=0;dv<SW;dv+=160)pl(S,dv,GYS,dv-14,SH,"rgba(4,8,14,0.4)",1);
  if(!offl){var pool=S.createRadialGradient(UX,GYS+8,10,UX,GYS+8,260);
    pool.addColorStop(0,kk(0.09*lit));pool.addColorStop(1,kk(0));
    S.fillStyle=pool;S.beginPath();S.ellipse(UX,GYS+8,260,32,0,0,7);S.fill();}
  S.save();S.globalAlpha=0.5;
  S.strokeStyle="rgba(150,166,194,"+(0.05*lit)+")";S.lineWidth=1.5;
  S.beginPath();S.arc(UX,GYS+36,92,Math.PI*1.08,Math.PI*1.92);S.stroke();
  S.beginPath();S.arc(UX,GYS+40,128,Math.PI*1.14,Math.PI*1.86);S.stroke();
  S.restore();
  /* ---- the deck itself. It was a flat tone with a couple of seam lines, so
     everything below the platform read as empty page. Painted safety
     margin, a drain, bolt heads along the platform footing. */
  (function(){
    // yellow safety margin painted along the platform's foot, worn through
    S.save();S.globalAlpha=0.5;
    S.fillStyle="rgba(196,158,66,"+(0.22*lit)+")";
    S.beginPath();S.moveTo(258,GYS+34);S.lineTo(902,GYS+34);
    S.lineTo(920,GYS+46);S.lineTo(240,GYS+46);S.closePath();S.fill();
    S.globalAlpha=1;
    for(var wr=0;wr<9;wr++){                       // wear breaking the paint
      S.fillStyle="rgba(12,17,23,"+(0.5+0.4*((wr*37)%5)/5)+")";
      S.fillRect(268+wr*72,GYS+34,20+((wr*13)%22),13);}
    S.restore();
    // deck bolts along the platform footing
    for(var db=0;db<16;db++){
      var dbx=252+db*44, dby=GYS+30;
      S.fillStyle="rgba(4,8,14,0.8)";S.beginPath();S.arc(dbx,dby,2.6,0,7);S.fill();
      S.fillStyle="rgba(150,166,194,"+(0.06*lit)+")";S.beginPath();S.arc(dbx-0.8,dby-0.8,1.1,0,7);S.fill();}
    // a scupper drain, and the wet it never quite loses
    S.fillStyle="rgba(3,6,11,0.9)";S.beginPath();S.ellipse(1006,GYS+52,26,9,0,0,7);S.fill();
    S.strokeStyle="rgba(140,156,184,"+(0.12*lit)+")";S.lineWidth=1.2;
    S.beginPath();S.ellipse(1006,GYS+52,26,9,0,0,7);S.stroke();
    for(var gr2=0;gr2<4;gr2++)pl(S,986+gr2*13,GYS+45,986+gr2*13,GYS+59,"rgba(140,156,184,"+(0.09*lit)+")",1.4);
    if(!offl){var wet=S.createRadialGradient(1006,GYS+52,4,1006,GYS+52,72);
      wet.addColorStop(0,kk(0.05*lit));wet.addColorStop(1,kk(0));
      S.fillStyle=wet;S.beginPath();S.ellipse(1006,GYS+52,72,18,0,0,7);S.fill();}
  })();
  // a coil of spare cable on the deck
  (function(){
    var qx2=1128, qy2=GYS+34;
    S.strokeStyle="rgba(6,10,16,0.95)";S.lineWidth=4.4;
    [19,13,7].forEach(function(rr4){S.beginPath();S.ellipse(qx2,qy2,rr4,rr4*0.42,0,0,7);S.stroke();});
    S.strokeStyle="rgba(120,136,164,"+(0.07*lit)+")";S.lineWidth=1;
    S.beginPath();S.ellipse(qx2,qy2,19,8,0,Math.PI,Math.PI*2);S.stroke();
  })();
  /* atmosphere. Two passes: a depth grade that puts a thin veil over
     everything far from the camera, and volumetric shafts under each lamp
     so the air itself is visible. Together they are what stop a room of
     flat plates from reading as a sticker sheet. */
  if(!offl){
    var haze=S.createLinearGradient(0,150,0,GYS);
    haze.addColorStop(0,kk(0.02*lit));haze.addColorStop(1,kk(0.055*lit));
    S.fillStyle=haze;S.fillRect(0,150,SW,GYS-150);
    S.save();S.globalCompositeOperation="lighter";
    [UX,UX+430].forEach(function(lx7,li2){
      var ly7=(li2?96:118)+11;
      var shaft=S.createLinearGradient(0,ly7,0,GYS);
      shaft.addColorStop(0,kk((li2?0.02:0.06)*lit));shaft.addColorStop(0.6,kk((li2?0.007:0.02)*lit));shaft.addColorStop(1,kk(0));
      S.fillStyle=shaft;S.beginPath();
      S.moveTo(lx7-30,ly7);S.lineTo(lx7+30,ly7);
      S.lineTo(lx7+150,GYS);S.lineTo(lx7-150,GYS);S.closePath();S.fill();});
    // motes riding the port lamp's shaft
    for(var mo2=0;mo2<30;mo2++){
      var mfx=UX-120+((mo2*83)%240), mfy=150+((mo2*167)%460);
      var mff=0.25+0.75*Math.abs(Math.sin(t*0.4+mo2*0.7));
      S.fillStyle=kk(0.14*mff*lit);
      S.beginPath();S.arc(mfx,mfy,0.9,0,7);S.fill();}
    S.restore();}
}
function roomFrame(lit){
  S.fillStyle="#080b11";S.fillRect(0,0,SW,26);
  S.fillStyle="rgba(150,166,194,"+(0.05*lit)+")";S.fillRect(0,25,SW,1.4);
}
function vignette(){
  var vg2=S.createRadialGradient(UX,340,240,UX,340,780);
  vg2.addColorStop(0,"rgba(0,0,0,0)");vg2.addColorStop(0.6,"rgba(0,0,0,0.16)");vg2.addColorStop(1,"rgba(0,0,0,0.72)");
  S.fillStyle=vg2;S.fillRect(0,0,SW,SH);
  var tb=S.createLinearGradient(0,0,0,120);
  tb.addColorStop(0,"rgba(0,0,0,0.6)");tb.addColorStop(1,"rgba(0,0,0,0)");
  S.fillStyle=tb;S.fillRect(0,0,SW,120);
}

/* ---- scene ---- */
function drawScene(t,st){
  var offl=st==="offline";
  drawRoom(t,st);
  // contact shadows, in stage coordinates
  [-34,34].forEach(function(dx){var sh=S.createRadialGradient(UX+dx,GYS+4,1,UX+dx,GYS+4,38);
    sh.addColorStop(0,"rgba(0,0,0,0.6)");sh.addColorStop(0.6,"rgba(0,0,0,0.28)");sh.addColorStop(1,"rgba(0,0,0,0)");
    S.fillStyle=sh;S.beginPath();S.ellipse(UX+dx,GYS+4,38,10,0,0,7);S.fill();});
  var sh2=S.createRadialGradient(UX,GYS+2,6,UX,GYS+2,100);
  sh2.addColorStop(0,"rgba(0,0,0,0.35)");sh2.addColorStop(1,"rgba(0,0,0,0)");
  S.fillStyle=sh2;S.beginPath();S.ellipse(UX,GYS+2,100,15,0,0,7);S.fill();
  S.drawImage(body,UOX,UOY);
  S.drawImage(rim,UOX,UOY);
  S.save();S.globalCompositeOperation="lighter";S.drawImage(emis,UOX,UOY);S.restore();
  roomFrame(offl?0.22:1);
  vignette();
  /* ============ PLANE 4 · foreground the camera stands behind ============ */
  S.save();S.filter="blur(4px)";
  // a bridge rail crossing the bottom of frame
  S.fillStyle="rgba(7,10,16,0.94)";
  S.fillRect(0,SH-52,SW,9);
  [70,300,530,760,990,1220].forEach(function(sx3){
    S.fillRect(sx3-6,SH-52,12,52);});
  S.fillStyle="rgba(150,166,194,0.05)";S.fillRect(0,SH-52,SW,1.6);
  // a stanchion hard left, and a cable dropping through frame right
  S.fillStyle="rgba(7,10,16,0.96)";S.fillRect(0,0,34,SH);
  S.fillStyle="rgba(150,166,194,0.05)";S.fillRect(32,0,2,SH);
  S.strokeStyle="rgba(7,10,16,0.92)";S.lineWidth=11;
  S.beginPath();S.moveTo(1214,0);S.quadraticCurveTo(1244,220,1226,SH);S.stroke();
  S.restore();
}

function frame(){
  var t=reduced?T0:(performance.now()/1000);
  drawUnit(t,STATE);drawScene(t,STATE);
  if(!reduced)requestAnimationFrame(frame);
}
frame();
</script>

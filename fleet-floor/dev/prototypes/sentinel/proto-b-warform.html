<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARGUS war-form — sentinel prototype B</title>
<style>
  html,body{margin:0;background:#04060a;height:100%;font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0}
  canvas{display:block;background:#000;border-radius:6px;max-width:94vw;height:auto}
  #bar{margin-top:12px;display:flex;gap:8px}
  #bar button{font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:7px 14px;background:#0a0f16;border:1px solid #1c2733;border-radius:7px;color:#7d8ba0;cursor:pointer}
  #bar button.on{color:#ff8a7a;border-color:#5c2a24;background:#1c0f0d}
  #cap{margin-top:10px;font-size:11px;color:#55657a;letter-spacing:.06em}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="520" height="640"></canvas>
  <div id="bar">
    <button data-st="working">working</button>
    <button data-st="idle">idle</button>
    <button data-st="offline">offline</button>
  </div>
  <div id="cap">ARGUS war-form (SN-100) — the cluster stare · four arms stand, four arms are ready</div>
</div>
<script>
/* ============================================================================
   SENTINEL PROTO B — "ARGUS war-form" (SN-100)                     crew#128

   Proto A read soft: a smooth bell, eyes scattered politely, arms that
   only stood. The operator's verdict — not scary, not dangerous. This is
   the Matrix-sentinel read of the same role:

     · an ANGULAR carapace, not a bell — a hunched faceted shield with
       blade flanges off both shoulders, chevron armour bands layered
       over the crown, everything in hard straight edges
     · the eyes are a CLUSTER — one master lens and ~20 more packed lens-
       to-lens in a recessed face bowl, the machine-mother stare; one
       lens is dead and cracked and stays that way
     · eight jointed arms with hard elbows, not smooth curves. FOUR are
       support: splayed wide, pincers closed, dug into the deck — it
       STANDS on them. FOUR are weapons: two raised past the hull with
       pincers open, two cocked low and forward mid-strike. The thing is
       always one frame away from violence.
     · offline the weapon arms drop and drag, the pincers close, the
       hull settles onto its haunches — and twenty dead lenses still
       catch the room light, which is worse
   ========================================================================== */
var cv=document.getElementById("cv"), S=cv.getContext("2d");
var W=520,H=640;
var body=document.createElement("canvas"),emis=document.createElement("canvas"),rim=document.createElement("canvas");
[body,emis,rim].forEach(function(c){c.width=W;c.height=H;});
var RB=body.getContext("2d"),RE=emis.getContext("2d"),RR=rim.getContext("2d");

function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}}
function poly(c,pts){c.beginPath();for(var i=0;i<pts.length;i++){if(i)c.lineTo(pts[i][0],pts[i][1]);else c.moveTo(pts[i][0],pts[i][1]);}c.closePath();}
function plate(c,pts,top,bot,ed){var y0=1e9,y1=-1e9;for(var i=0;i<pts.length;i++){if(pts[i][1]<y0)y0=pts[i][1];if(pts[i][1]>y1)y1=pts[i][1];}var gg=c.createLinearGradient(0,y0,0,y1);gg.addColorStop(0,top);gg.addColorStop(1,bot);poly(c,pts);c.fillStyle=gg;c.fill();if(ed){c.strokeStyle=ed;c.lineWidth=1.2;c.lineJoin="round";c.stroke();}}
function pl(c,x0,y0,x1,y1,col,w){c.strokeStyle=col;c.lineWidth=w||1;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}
function cavity(c,x,y,w,h,a){var gg=c.createLinearGradient(0,y,0,y+h);gg.addColorStop(0,"rgba(2,5,9,"+a+")");gg.addColorStop(1,"rgba(2,5,9,0)");c.fillStyle=gg;c.fillRect(x,y,w,h);}
function bolt(c,x,y,r,lit){c.fillStyle="#05080e";c.beginPath();c.arc(x,y,r,0,7);c.fill();
  var gg=c.createRadialGradient(x-r*0.3,y-r*0.4,0.4,x,y,r);gg.addColorStop(0,"rgba(200,214,238,"+(lit||0.35)+")");gg.addColorStop(1,"rgba(4,8,14,0.8)");
  c.fillStyle=gg;c.beginPath();c.arc(x,y,r*0.66,0,7);c.fill();
  pl(c,x-r*0.34,y,x+r*0.34,y,"rgba(3,6,11,0.85)",1);}
function Rnd(i){var x=Math.sin(i*127.1+13.7)*43758.5453;return x-Math.floor(x);}

var qs=new URLSearchParams(location.search);
var STATE=qs.get("state")||"working";
var reduced=qs.get("t")!==null;
var T0=qs.get("t")===null?0:Number(qs.get("t"));

document.querySelectorAll("#bar button").forEach(function(b){
  if(b.dataset.st===STATE)b.classList.add("on");
  b.onclick=function(){location.search="?state="+b.dataset.st;};
});

function drawUnit(t,st){
  var offl=st==="offline", work=st==="working";
  [RB,RE,RR].forEach(function(c){c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);c.globalAlpha=1;c.globalCompositeOperation="source-over";});
  var g=RB, cx=260, GY=560;
  var sT="#28303f",sM="#141a26",sB="#080c13",ed="#303a4e",eH="#455368",rc="#05080e";
  if(offl){sT="#1a1f29";sM="#0d1119";sB="#05080e";ed="#212836";eH="#293140";}
  var RD=offl?[70,66,72]:[255,59,48], RDH=offl?[110,104,108]:[255,150,132];
  function rd(a){return "rgba("+RD[0]+","+RD[1]+","+RD[2]+","+a+")";}
  function rdh(a){return "rgba("+RDH[0]+","+RDH[1]+","+RDH[2]+","+a+")";}
  var pulse=offl?0:(work?(0.62+0.24*Math.sin(t*5.5)):(0.36+0.12*Math.sin(t*1.7)));
  var settle=offl?22:0;
  var bob=offl?0:Math.sin(t*1.1)*2;
  var DY=settle+bob;
  var sway=offl?0:Math.sin(t*0.8)*3;

  /* ---- helpers: jointed arm chain + pincer ---- */
  // hard-elbowed chain: straight tapered segments between joints, a dark
  // ball with a lit crescent at every bend. This is what "multiple angles"
  // means against proto A's smooth curves.
  function armChain(pts,w0,w1,frontal){
    var n=pts.length-1;
    for(var i2=0;i2<n;i2++){
      var a=pts[i2],b=pts[i2+1];
      var wa=w0+(w1-w0)*(i2/n), wb=w0+(w1-w0)*((i2+1)/n);
      var dx=b[0]-a[0],dy=b[1]-a[1],ln=Math.hypot(dx,dy)||1,nx=-dy/ln,ny=dx/ln;
      plate(g,[[a[0]+nx*wa,a[1]+ny*wa],[b[0]+nx*wb,b[1]+ny*wb],[b[0]-nx*wb,b[1]-ny*wb],[a[0]-nx*wa,a[1]-ny*wa]],frontal?sT:sM,sB,frontal?ed:null);
      // piston channel along the segment
      if(frontal){pl(g,a[0]+nx*wa*0.3,a[1]+ny*wa*0.3,b[0]+nx*wb*0.3,b[1]+ny*wb*0.3,"rgba(6,9,15,0.8)",2.2);
        pl(g,a[0]+nx*wa*0.3,a[1]+ny*wa*0.3,b[0]+nx*wb*0.3,b[1]+ny*wb*0.3,"rgba(150,164,190,"+(offl?0.06:0.18)+")",0.9);}
      // the joint at every bend after the first segment
      if(i2>0){var jr=wa+2;
        g.fillStyle="#04070c";g.beginPath();g.arc(a[0],a[1],jr,0,7);g.fill();
        if(frontal){g.strokeStyle="rgba(150,164,190,"+(offl?0.08:0.24)+")";g.lineWidth=1.4;
          g.beginPath();g.arc(a[0],a[1],jr*0.62,-2.4,0.5);g.stroke();}}
    }
  }
  /* pincer: two curved fangs off a wrist hub. ang = direction it points
     (radians), gape = how open. Closed + planted = a foot; open = a threat. */
  function pincer(x,y,ang,gape,sz,frontal){
    g.save();g.translate(x,y);g.rotate(ang);
    [1,-1].forEach(function(m){
      g.save();g.rotate(m*gape/2);
      var fg=g.createLinearGradient(0,-sz*0.4,0,sz*0.3);
      fg.addColorStop(0,frontal?sT:sM);fg.addColorStop(1,sB);
      g.beginPath();
      g.moveTo(0,-sz*0.18*m);
      g.quadraticCurveTo(sz*0.6,-sz*0.55*m,sz*0.95,-sz*0.1*m);   // outer blade edge
      g.quadraticCurveTo(sz*1.04,-sz*0.02*m,sz*0.84,sz*0.18*m);  // the tip hooks INWARD — a claw, not a beak
      g.quadraticCurveTo(sz*0.46,-sz*0.05*m,0,sz*0.1*m);         // inner edge back to hub
      g.closePath();g.fillStyle=fg;g.fill();
      g.strokeStyle=frontal?ed:"rgba(48,58,78,0.5)";g.lineWidth=1.1;g.stroke();
      // the edge catch: pincers are kept sharp
      g.strokeStyle="rgba(198,216,246,"+(offl?0.1:0.3)+")";g.lineWidth=1;
      g.beginPath();g.moveTo(sz*0.3,-sz*0.33*m);g.quadraticCurveTo(sz*0.72,-sz*0.42*m,sz*0.9,-sz*0.1*m);g.stroke();
      g.restore();});
    // wrist hub + its red sensor
    g.fillStyle="#04070c";g.beginPath();g.arc(0,0,sz*0.3,0,7);g.fill();
    g.strokeStyle=eH;g.lineWidth=1.1;g.beginPath();g.arc(0,0,sz*0.3,0,7);g.stroke();
    if(!offl){g.fillStyle=rdh(0.85);g.beginPath();g.arc(0,0,2,0,7);g.fill();
      RE.save();RE.translate(x,y);RE.fillStyle=rd(0.55);RE.beginPath();RE.arc(0,0,3.4,0,7);RE.fill();RE.restore();}
    g.restore();
  }

  var jawY=428+DY;                     // bottom of the hull
  var rootY=jawY+14;                   // arms grow from the under-jaw mass

  /* ---- 0 · WEAPON ARMS, raised pair — behind the hull ---- */
  if(!offl){
    armChain([[cx+38,rootY-6],[cx+146,378+DY],[cx+192,268+DY+sway],[cx+152,196+DY+sway]],13,7,true);
    pincer(cx+152,196+DY+sway,Math.PI*1.32,1.25,34,true);
    armChain([[cx-38,rootY-4],[cx-156,392+DY],[cx-202,300+DY-sway],[cx-174,218+DY-sway]],13,7,true);
    pincer(cx-174,218+DY-sway,Math.PI*1.68,1.25,34,true);
  }else{
    // dropped: they hang off the shoulders and drag, pincers shut
    armChain([[cx+38,rootY-6],[cx+150,470],[cx+196,530],[cx+206,554]],13,7,true);
    pincer(cx+206,554,Math.PI*0.5,0.12,26,true);
    armChain([[cx-38,rootY-4],[cx-158,478],[cx-202,536],[cx-210,554]],13,7,true);
    pincer(cx-210,554,Math.PI*0.5,0.12,26,true);
  }

  /* ---- 1 · SUPPORT ARMS, outer pair — behind the hull, planted wide ---- */
  armChain([[cx-30,rootY],[cx-124,470+settle*0.4],[cx-183,505+settle*0.3],[cx-200,552]],13,7,false);
  pincer(cx-200,552,Math.PI*0.5,0.16,24,false);
  armChain([[cx+30,rootY],[cx+124,470+settle*0.4],[cx+183,505+settle*0.3],[cx+200,552]],13,7,false);
  pincer(cx+200,552,Math.PI*0.5,0.16,24,false);

  /* ---- 2 · THE HULL: hunched faceted shield, all hard edges ---- */
  var HUL=[[cx-128,296+DY],[cx-96,216+DY],[cx-34,178+DY],[cx+34,178+DY],[cx+96,216+DY],[cx+128,296+DY],
           [cx+74,386+DY],[cx+34,jawY],[cx-34,jawY],[cx-74,386+DY]];
  plate(g,HUL,sT,sB,ed);
  // facet seams: crown arris + the four long diagonals
  pl(g,cx,178+DY,cx,240+DY,"rgba(4,8,14,0.55)",1.5);
  pl(g,cx-96,216+DY,cx-44,300+DY,"rgba(4,8,14,0.4)",1.3);
  pl(g,cx+96,216+DY,cx+44,300+DY,"rgba(4,8,14,0.4)",1.3);
  pl(g,cx-128,296+DY,cx-64,352+DY,"rgba(4,8,14,0.4)",1.3);
  pl(g,cx+128,296+DY,cx+64,352+DY,"rgba(4,8,14,0.4)",1.3);
  pl(g,cx-33,179+DY,cx+33,179+DY,"rgba(186,208,242,"+(offl?0.07:0.2)+")",1.5); // crown catch
  /* blade flanges off both shoulders — the silhouette's teeth */
  [-1,1].forEach(function(sg){
    plate(g,[[cx+sg*120,262+DY],[cx+sg*158,286+DY],[cx+sg*122,306+DY]],sM,sB,ed);           // main blade
    plate(g,[[cx+sg*100,224+DY],[cx+sg*130,232+DY],[cx+sg*102,248+DY]],sM,sB,ed);           // upper spur
    plate(g,[[cx+sg*96,344+DY],[cx+sg*126,368+DY],[cx+sg*88,372+DY]],sM,sB,ed);             // lower spur
    pl(g,cx+sg*120,262+DY,cx+sg*158,286+DY,"rgba(198,216,246,"+(offl?0.08:0.24)+")",1.2);   // kept sharp
    // chipped tip on the left main blade
    if(sg<0){g.fillStyle="rgba(206,220,242,"+(offl?0.1:0.28)+")";g.fillRect(cx-156,284+DY,3,2);}
  });
  /* chevron armour bands layered over the crown — segmented carapace */
  plate(g,[[cx-72,206+DY],[cx,188+DY],[cx+72,206+DY],[cx+64,228+DY],[cx,212+DY],[cx-64,228+DY]],sM,sB,ed);
  plate(g,[[cx-88,238+DY],[cx,216+DY],[cx+88,238+DY],[cx+80,262+DY],[cx,242+DY],[cx-80,262+DY]],sT,sB,ed);
  cavity(g,cx-80,252+DY,160,9,0.5);
  bolt(g,cx-70,232+DY,2.2,offl?0.05:0.2);bolt(g,cx+70,232+DY,2.2,offl?0.05:0.2);
  // aux lenses on the upper facets — it watches sideways too
  [-1,1].forEach(function(sg){
    g.fillStyle="#04070c";g.beginPath();g.arc(cx+sg*74,282+DY,4.6,0,7);g.fill();
    g.strokeStyle="rgba(70,84,104,0.7)";g.lineWidth=1;g.beginPath();g.arc(cx+sg*74,282+DY,4.6,0,7);g.stroke();
    if(!offl){var au=0.5+0.3*Math.sin(t*2.4+sg*2);
      [RB,RE].forEach(function(c){var ag=c.createRadialGradient(cx+sg*74,282+DY,0.3,cx+sg*74,282+DY,4.4);
        ag.addColorStop(0,rdh(0.9*au));ag.addColorStop(1,rd(0));
        c.fillStyle=ag;c.beginPath();c.arc(cx+sg*74,282+DY,4.4,0,7);c.fill();});}
    else{g.fillStyle="rgba(120,134,156,0.16)";g.beginPath();g.arc(cx+sg*74-1,281+DY,1.6,0,7);g.fill();}
  });
  /* battle record on the hull: gouge, weld bead, patched facet, scorch */
  poly(g,[[cx+62,248+DY],[cx+100,266+DY],[cx+96,274+DY],[cx+58,256+DY]]);
  g.fillStyle="rgba(2,4,8,0.95)";g.fill();
  pl(g,cx+62,248+DY,cx+100,266+DY,"rgba(198,216,246,"+(offl?0.09:0.26)+")",1.4);
  g.setLineDash([2.4,2.1]);g.strokeStyle="rgba(150,164,190,"+(offl?0.08:0.22)+")";g.lineWidth=2;
  g.beginPath();g.moveTo(cx-108,262+DY);g.quadraticCurveTo(cx-88,308+DY,cx-102,342+DY);g.stroke();g.setLineDash([]);
  plate(g,[[cx-66,368+DY],[cx-30,374+DY],[cx-32,398+DY],[cx-64,392+DY]],"#182130","#0a0e16","#222937");
  bolt(g,cx-60,374+DY,1.6,offl?0.04:0.12);bolt(g,cx-36,380+DY,1.6,offl?0.04:0.12);
  var sco=g.createLinearGradient(0,jawY-40,0,jawY);
  sco.addColorStop(0,"rgba(8,5,3,0)");sco.addColorStop(1,"rgba(8,5,3,0.45)");
  g.fillStyle=sco;poly(g,[[cx+18,jawY-40],[cx+70,jawY-52],[cx+60,jawY-4],[cx+14,jawY]]);g.fill();
  // stencil, worn
  g.save();g.globalAlpha=offl?0.14:0.3;g.fillStyle="#c6d2e4";
  g.font="700 10px ui-monospace,monospace";g.textAlign="center";
  g.fillText("SN-100",cx+86,330+DY);g.restore();

  /* ---- 3 · THE FACE BOWL + CLUSTER ---- */
  var FB={x:cx,y:326+DY};
  poly(g,[[FB.x-60,FB.y-16],[FB.x-42,FB.y-46],[FB.x+42,FB.y-46],[FB.x+60,FB.y-16],[FB.x+48,FB.y+42],[FB.x-48,FB.y+42]]);
  g.fillStyle="#030509";g.fill();g.strokeStyle=rc;g.lineWidth=1.4;g.stroke();
  cavity(g,FB.x-56,FB.y-44,112,15,0.7);                       // the bowl is DEEP
  pl(g,FB.x-58,FB.y+40,FB.x+58,FB.y+40,"rgba(120,134,160,0.12)",1);
  /* the cluster: lenses packed lens-to-lens. [dx,dy,r] — one master, a
     tight ring, an outer shell filling the bowl. */
  var LENS=[[0,-2,16],
    [-24,-14,10],[24,-14,10],[-27,12,9],[27,12,9],[0,-28,9],[0,24,9],
    [-45,-4,7],[45,-4,7],[-14,-38,6.5],[14,-38,6.5],[-44,22,6],[44,22,6],
    [-16,34,5.5],[16,34,5.5],[-38,-28,5],[38,-28,5],[-52,14,4],[52,14,4],[0,40,4],[-30,-40,3],[30,-40,3]];
  var DEAD=9; // this lens is cracked and stays dark
  LENS.forEach(function(L,li){
    var ex=FB.x+L[0], eyy=FB.y+L[1], er=L[2];
    g.fillStyle="#05080e";g.beginPath();g.arc(ex,eyy,er+1.6,0,7);g.fill();
    g.strokeStyle="rgba(70,84,104,"+(offl?0.35:0.6)+")";g.lineWidth=1;
    g.beginPath();g.arc(ex,eyy,er+1.6,0,7);g.stroke();
    if(offl||li===DEAD){
      g.fillStyle="rgba(120,134,156,0.16)";g.beginPath();g.arc(ex-er*0.3,eyy-er*0.35,er*0.38,0,7);g.fill();
      if(li===DEAD){pl(g,ex-er*0.7,eyy-er*0.3,ex+er*0.5,eyy+er*0.6,"rgba(160,175,198,0.4)",0.9);
        pl(g,ex-er*0.1,eyy-er*0.8,ex+er*0.2,eyy+er*0.2,"rgba(160,175,198,0.3)",0.8);}
      return;}
    var ph=Rnd(li*7)*6.28, spd=0.9+Rnd(li*11)*1.5;
    var blink=0.72+0.28*Math.sin(t*spd+ph);
    if(Math.sin(t*0.6+ph*3)<-0.93)blink*=0.4;
    var wave=work?Math.max(0,Math.sin((L[0])*0.05-t*2.6))*0.3:0;   // scan sweeps across the cluster
    var lum=Math.min(1,(work?0.66:0.36)*blink+wave+(work?0.2:0.1));
    var gz=li===0?(work?{x:0,y:0}:{x:Math.sin(t*0.4)*5,y:Math.cos(t*0.3)*2.5}):{x:0,y:0};
    [RB,RE].forEach(function(c,ci){
      var eg=c.createRadialGradient(ex+gz.x,eyy+gz.y,0.3,ex,eyy,er+(ci?5:1));
      eg.addColorStop(0,"rgba(255,236,228,"+(0.72*lum)+")");
      eg.addColorStop(0.3,rdh(0.9*lum));eg.addColorStop(0.62,rd(0.55*lum));eg.addColorStop(1,rd(0));
      c.fillStyle=eg;c.beginPath();c.arc(ex,eyy,er+(ci?5:1),0,7);c.fill();});
    if(li===0){g.strokeStyle=rd(0.85);g.lineWidth=1.1;      // master iris ring
      g.beginPath();g.arc(ex+gz.x,eyy+gz.y,er*0.55,0,7);g.stroke();
      g.fillStyle="rgba(24,2,2,0.9)";g.beginPath();g.arc(ex+gz.x,eyy+gz.y,er*0.22,0,7);g.fill();}
  });
  if(!offl){ // the cluster lights the bowl walls and the jaw beneath it
    g.save();g.globalCompositeOperation="lighter";
    var cl=g.createRadialGradient(FB.x,FB.y,10,FB.x,FB.y,110);
    cl.addColorStop(0,rd(0.2*pulse+0.1));cl.addColorStop(0.55,rd(0.07));cl.addColorStop(1,rd(0));
    g.fillStyle=cl;g.beginPath();g.arc(FB.x,FB.y,110,0,7);g.fill();g.restore();
    RE.save();var cle=RE.createRadialGradient(FB.x,FB.y,8,FB.x,FB.y,90);
    cle.addColorStop(0,rd(0.4*pulse+0.12));cle.addColorStop(1,rd(0));
    RE.fillStyle=cle;RE.beginPath();RE.arc(FB.x,FB.y,90,0,7);RE.fill();RE.restore();
  }

  /* ---- 4 · UNDER-JAW: ribbed root mass the arms grow out of ---- */
  plate(g,[[cx-44,jawY-2],[cx+44,jawY-2],[cx+34,jawY+26],[cx-34,jawY+26]],sM,sB,ed);
  for(var rj=0;rj<3;rj++){pl(g,cx-30+rj*4,jawY+4+rj*7,cx+30-rj*4,jawY+4+rj*7,"rgba(4,8,14,0.6)",2);}
  cavity(g,cx-40,jawY-2,80,10,0.6);

  /* ---- 5 · SUPPORT ARMS, inner pair + COCKED weapon pair — in front ---- */
  armChain([[cx-16,rootY+6],[cx-54,505+settle*0.4],[cx-70,552]],11,6,true);
  pincer(cx-70,552,Math.PI*0.5,0.16,20,true);
  armChain([[cx+16,rootY+6],[cx+54,505+settle*0.4],[cx+70,552]],11,6,true);
  pincer(cx+70,552,Math.PI*0.5,0.16,20,true);
  if(!offl){
    // cocked mid-height: elbows out, pincers open toward whatever is in front —
    // held OFF the deck so they read as weapons, never as feet
    armChain([[cx+26,rootY],[cx+108,424+DY+sway*0.5],[cx+142,468+DY]],10,5.5,true);
    pincer(cx+142,468+DY,Math.PI*0.58,1.2,28,true);
    armChain([[cx-26,rootY],[cx-100,432+DY-sway*0.5],[cx-130,472+DY]],10,5.5,true);
    pincer(cx-130,472+DY,Math.PI*0.46,1.2,28,true);
  }else{
    armChain([[cx+26,rootY],[cx+96,486],[cx+112,548]],10,5.5,true);
    pincer(cx+112,548,Math.PI*0.5,0.14,22,true);
    armChain([[cx-26,rootY],[cx-90,490],[cx-104,548]],10,5.5,true);
    pincer(cx-104,548,Math.PI*0.5,0.14,22,true);
  }

  /* ---- 6 · offline: the beacon rakes the crown and a blade flange ---- */
  if(offl){var bp=0.55;
    pl(g,cx-96,216+DY,cx-34,178+DY,"rgba(255,64,52,"+(0.24*bp)+")",2);
    pl(g,cx-120,262+DY,cx-158,286+DY,"rgba(255,64,52,"+(0.18*bp)+")",1.6);
    RE.strokeStyle="rgba(255,64,52,"+(0.12*bp)+")";RE.lineWidth=2.4;
    RE.beginPath();RE.moveTo(cx-96,216+DY);RE.lineTo(cx-34,178+DY);RE.stroke();}

  /* ---- room light lands on the unit ---- */
  RB.save();RB.globalCompositeOperation="source-atop";
  var key=RB.createLinearGradient(0,150,0,GY);
  key.addColorStop(0,"rgba(206,226,255,"+(offl?0.05:0.12)+")");
  key.addColorStop(0.3,"rgba(186,206,238,"+(offl?0.02:0.045)+")");
  key.addColorStop(0.68,"rgba(2,6,14,0.10)");
  key.addColorStop(1,"rgba(2,6,14,0.22)");
  RB.fillStyle=key;RB.fillRect(0,0,W,H);
  var bnc=RB.createLinearGradient(0,GY-130,0,GY-8);
  bnc.addColorStop(0,"rgba(104,146,196,0)");bnc.addColorStop(1,"rgba(104,146,196,"+(offl?0.04:0.1)+")");
  RB.fillStyle=bnc;RB.fillRect(0,0,W,H);RB.restore();

  /* ---- rim light: red key, cyan fill ---- */
  RR.globalCompositeOperation="source-over";RR.drawImage(body,0,0);
  RR.globalCompositeOperation="destination-out";RR.drawImage(body,-2.2,1.7);RR.drawImage(body,-1.5,-2.4);
  RR.globalCompositeOperation="source-in";
  var rl=RR.createLinearGradient(60,0,460,0);
  rl.addColorStop(0,"rgba(255,59,48,0.95)");rl.addColorStop(0.42,"rgba(198,140,150,0.42)");rl.addColorStop(1,"rgba(95,214,255,1)");
  RR.fillStyle=rl;RR.fillRect(0,0,W,H);RR.globalCompositeOperation="source-over";
}

/* ---- scene ---- */
function drawScene(t,st){
  var offl=st==="offline";
  var wall=S.createLinearGradient(0,0,0,H);
  wall.addColorStop(0,offl?"#07090d":"#0b0e14");wall.addColorStop(0.75,offl?"#05070a":"#090c12");wall.addColorStop(1,"#05070b");
  S.fillStyle=wall;S.fillRect(0,0,W,H);
  if(!offl){var cone=S.createLinearGradient(0,40,0,560);
    cone.addColorStop(0,"rgba(255,214,150,0.07)");cone.addColorStop(1,"rgba(255,214,150,0)");
    S.fillStyle=cone;S.beginPath();S.moveTo(225,40);S.lineTo(295,40);S.lineTo(410,560);S.lineTo(110,560);S.closePath();S.fill();
    var rg=S.createRadialGradient(260,330,20,260,330,230);
    rg.addColorStop(0,"rgba(255,59,48,0.06)");rg.addColorStop(1,"rgba(255,59,48,0)");
    S.fillStyle=rg;S.fillRect(0,0,W,H);}
  else{var bc=S.createRadialGradient(90,120,4,90,120,150);
    bc.addColorStop(0,"rgba(255,60,50,0.12)");bc.addColorStop(1,"rgba(255,60,50,0)");
    S.fillStyle=bc;S.fillRect(0,0,W,H);}
  S.fillStyle=offl?"#07090c":"#0d1118";S.fillRect(0,560,W,H-560);
  pl(S,0,560,W,560,"rgba(120,140,170,0.14)",1);
  // contact shadows where the pincers grip (plus dropped arms when offline)
  var feet=offl?[-210,-200,-104,-70,70,112,200,206]:[-200,-70,70,200];
  feet.forEach(function(dx){var sh=S.createRadialGradient(260+dx,562,1,260+dx,562,28);
    sh.addColorStop(0,"rgba(0,0,0,0.55)");sh.addColorStop(0.6,"rgba(0,0,0,0.25)");sh.addColorStop(1,"rgba(0,0,0,0)");
    S.fillStyle=sh;S.beginPath();S.ellipse(260+dx,562,28,8,0,0,7);S.fill();});
  var sh2=S.createRadialGradient(260,560,8,260,560,160);
  sh2.addColorStop(0,"rgba(0,0,0,0.38)");sh2.addColorStop(1,"rgba(0,0,0,0)");
  S.fillStyle=sh2;S.beginPath();S.ellipse(260,560,160,16,0,0,7);S.fill();
  if(!offl){ // the cluster's red pool on the deck
    S.save();S.globalCompositeOperation="lighter";
    var tp=S.createRadialGradient(260,560,4,260,560,120);
    tp.addColorStop(0,"rgba(255,59,48,0.10)");tp.addColorStop(1,"rgba(255,59,48,0)");
    S.fillStyle=tp;S.beginPath();S.ellipse(260,560,120,14,0,0,7);S.fill();S.restore();}
  S.drawImage(body,0,0);
  S.drawImage(rim,0,0);
  S.save();S.globalCompositeOperation="lighter";S.drawImage(emis,0,0);S.restore();
}

function frame(){
  var t=reduced?T0:(performance.now()/1000);
  drawUnit(t,STATE);drawScene(t,STATE);
  if(!reduced)requestAnimationFrame(frame);
}
frame();
</script>

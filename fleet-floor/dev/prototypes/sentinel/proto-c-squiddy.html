<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SQUIDDY — sentinel prototype C</title>
<style>
  html,body{margin:0;background:#04060a;height:100%;font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0}

    padding:7px 14px;background:#0a0f16;border:1px solid #1c2733;border-radius:7px;color:#7d8ba0;cursor:pointer}
  #bar button.on{color:#ff8a7a;border-color:#5c2a24;background:#1c0f0d}

</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="520" height="640"></canvas>
  <div id="bar">
    <button data-st="working">working</button>
    <button data-st="idle">idle</button>
    <button data-st="offline">offline</button>
  </div>
  <div id="cap">SQUIDDY (SN-100) — bilobed skull, the machine-mother stare · it never touches the deck</div>
</div>
<script>
/* ============================================================================
   SENTINEL PROTO C — "SQUIDDY" (SN-100)                            crew#128

   Drawn against the actual Matrix sentinel reference, then taken through
   ten render loops. What the reference actually is:

     · the SILHOUETTE IS NOT DRAWN BY HAND. danmt's blue overlay on
       PR #230 was traced out of the screenshot pixel by pixel and mapped
       back into canvas space through the eye cluster, whose coordinates
       in the annotated revision are known exactly. That polygon is
       TARGET, and skullPath() interpolates it directly — every previous
       round failed because the shape was my reading of his sketch
       instead of his sketch. Render with ?outline=1 to draw the target
       over the unit.
     · what the trace says: WIDE AND SQUAT, about 172 x 148 — two low
       humps with a shallow saddle, flanks falling away fast, a rounded
       chin lowest on the centre line. The tall crown of every earlier
       revision sits entirely outside the line and is gone.
     · the eyes are glossy red BERRIES in chrome sockets, fifteen of
       them, different sizes, packed across a deep recessed face bowl,
       each with its own specular glint, shimmer clock and socket
       polish. One is dead and cracked. Not a neat ring: a stare.
     · a fringe of tapered MANDIBLE FANGS under the jaw, curling inward,
       each twitching on its own clock
     · a dozen long thin ribbed WHIPS — segmented conduit with a lit
       crown and a shadowed belly, S-curving in every direction, tipped
       with three-prong grapple claws
   It FLIES: alive it hovers with nothing touching the deck, drifting a
   slow figure-of-eight, one whip thrown high and one reaching forward.
   Dead it is on the floor — the hull drops, every whip crumples at its
   own height, and fifteen dead lenses keep their glints.
   ========================================================================== */
var cv=document.getElementById("cv"), S=cv.getContext("2d");
var W=520,H=640;
var body=document.createElement("canvas"),emis=document.createElement("canvas"),rim=document.createElement("canvas");
[body,emis,rim].forEach(function(c){c.width=W;c.height=H;});
var RB=body.getContext("2d"),RE=emis.getContext("2d"),RR=rim.getContext("2d");

function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}}
function poly(c,pts){c.beginPath();for(var i=0;i<pts.length;i++){if(i)c.lineTo(pts[i][0],pts[i][1]);else c.moveTo(pts[i][0],pts[i][1]);}c.closePath();}
function plate(c,pts,top,bot,ed){var y0=1e9,y1=-1e9;for(var i=0;i<pts.length;i++){if(pts[i][1]<y0)y0=pts[i][1];if(pts[i][1]>y1)y1=pts[i][1];}var gg=c.createLinearGradient(0,y0,0,y1);gg.addColorStop(0,top);gg.addColorStop(1,bot);poly(c,pts);c.fillStyle=gg;c.fill();if(ed){c.strokeStyle=ed;c.lineWidth=1.2;c.lineJoin="round";c.stroke();}}
function pl(c,x0,y0,x1,y1,col,w){c.strokeStyle=col;c.lineWidth=w||1;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}

function Rnd(i){var x=Math.sin(i*127.1+13.7)*43758.5453;return x-Math.floor(x);}
function cub(P,u){var v=1-u;
  return [v*v*v*P[0][0]+3*v*v*u*P[1][0]+3*v*u*u*P[2][0]+u*u*u*P[3][0],
          v*v*v*P[0][1]+3*v*v*u*P[1][1]+3*v*u*u*P[2][1]+u*u*u*P[3][1]];}

var qs=new URLSearchParams(location.search);
var STATE=qs.get("state")||"working";
var reduced=qs.get("t")!==null;
var T0=qs.get("t")===null?0:Number(qs.get("t"));

document.querySelectorAll("#bar button").forEach(function(b){
  if(b.dataset.st===STATE)b.classList.add("on");
  b.onclick=function(){location.search="?state="+b.dataset.st;};
});

function drawUnit(t,st){

  function rd(a){return "rgba("+RD[0]+","+RD[1]+","+RD[2]+","+a+")";}
  function rdh(a){return "rgba("+RDH[0]+","+RDH[1]+","+RDH[2]+","+a+")";}

  /* It FLIES. Alive it hovers, nothing touching the deck — the drift is a
     slow figure-of-eight, not a bob, because a hovering thing holds station
     against something. Dead it is on the floor: the hull drops the whole
     way down and the whips crumple under it. That is the state language. */

  var hovX=offl?0:Math.sin(t*0.53)*4;

      g.strokeStyle="rgba(2,5,10,0.5)";g.lineWidth=Math.max(r*0.5,1);

  }

    [[cx-46,RT+8],[cx-168,530],[cx-104,560],[cx-172,552]],
    [[cx+46,RT+8],[cx+186,522],[cx+142,559],[cx+182,545]],

    [[cx+26,RT+12],[cx+80,536],[cx+38,559],[cx+96,553]]
  ]:[
    // the two thrown high swing WIDE of the head before they climb, so the
    // face is never crossed by its own limbs
    [[cx-44+HX,RT-4],[cx-186,RT+40+sw*6],[cx-214,170],[cx-198,104+sw*5]],
    [[cx+44+HX,RT-2],[cx+192,RT+44-sw*6],[cx+220,180],[cx+208,118-sw*5]],
    [[cx-50+HX,RT+6],[cx-206,RT+90+sw2*5],[cx-238,404],[cx-242,336+sw2*7]],
    [[cx+50+HX,RT+6],[cx+214,RT+94-sw2*5],[cx+244,412],[cx+248,348-sw2*7]],
    [[cx-30+HX,RT+12],[cx-138,RT+80],[cx-104,472],[cx-166,512+sw*6]],
    [[cx+30+HX,RT+12],[cx+112,RT+104],[cx+172,476],[cx+126,520-sw*6]]
  ];
  BACK.forEach(function(P,bi){
    var pts=whip(P,5.2,2.1,42);
    var e=pts[pts.length-1],pe=pts[pts.length-2];
    grapple(e[0],e[1],Math.atan2(e[1]-pe[1],e[0]-pe[0]),offl?0:0.5+0.3*Math.sin(t*2+bi),true);
  });

  /* ---- 1 · THE UNDERSIDE: the ribbed throat collar the whips root into.
     No feet, no stand — this thing never touches the deck while it lives. */
  var TWO=offl?[
    [[cx-20,RT-6],[cx-52,542],[cx-104,556],[cx-134,548]],
    [[cx+20,RT-4],[cx+58,546],[cx+112,558],[cx+136,550]]
  ]:[
    [[cx-18+HX,RT-6],[cx-76,RT+60],[cx-16,RT+134],[cx-64,RT+182+sw*5]],
    [[cx+18+HX,RT-4],[cx+54,RT+92],[cx+96,RT+136],[cx+40,RT+214-sw*5]]
  ];
  TWO.forEach(function(P,ti){var pts=whip(P,5.6,2.7,30);
    var e=pts[pts.length-1],pe=pts[pts.length-2];
    grapple(e[0],e[1],Math.atan2(e[1]-pe[1],e[0]-pe[0]),offl?0:0.4+0.25*Math.sin(t*1.7+ti),true);});
  // throat collar: stacked rings narrowing away from the skull
  for(var th=0;th<4;th++){
    var ty2=HC.y+(104+th*11)*HS, tw=(30-th*5)*HS;
    g.fillStyle=th%2?"#0d1219":"#10151e";
    g.beginPath();g.ellipse(HC.x,ty2,tw,9,0,0,7);g.fill();
    g.strokeStyle="rgba(4,8,14,0.7)";g.lineWidth=1;g.beginPath();g.ellipse(HC.x,ty2,tw,9,0,0,7);g.stroke();
    if(th<2)cavity(g,HC.x-tw,ty2-2,tw*2,7,0.4);}

  /* the whole head — silhouette, plating, greebles, eyes, fangs — is drawn
     at 1:1 and scaled about HC as one unit, so nothing can drift off the
     traced outline when the size changes */
  [g,RE].forEach(function(c){c.save();c.translate(HC.x,HC.y);c.scale(HS,HS);c.translate(-HC.x,-HC.y);});
  /* ---- 2 · THE SKULL POD: the operator's own outline ---- */
  /* TARGET is danmt's blue overlay from PR #230, traced out of the
     screenshot pixel by pixel and mapped back into canvas space through the
     eye cluster (whose coordinates in that revision are known exactly). It
     is the authority on this silhouette — everything outside it is gone.

     What it says, and what every previous revision got wrong: the head is
     WIDE AND SQUAT, roughly 172 x 148, not a tall dome. The crown I kept
     rebuilding sits entirely outside the line. The top carries two low
     humps with a shallow saddle between them; the flanks fall away fast;
     the underside is a rounded chin that hangs lowest at the centre line
     and lifts at the jaw corners. Render with ?outline=1 to draw the
     target over the unit and check the fit. */
  var TARGET=window.__TARGET__=[[-87.9,8.2],[-81.1,-13.6],[-74.2,-20.8],[-67.4,-26.3],[-60.6,-29.9],[-53.7,-32.7],[-46.9,-34.5],[-40.1,-35.4],[-33.2,-35.4],[-26.4,-34.5],[-19.6,-29.9],[-12.7,-21.8],[-5.9,-14.5],[1.6,-11.8],[8.4,-16.3],[15.2,-23.6],[22.1,-31.7],[28.9,-37.2],[35.7,-37.2],[42.5,-35.4],[49.4,-33.6],[56.2,-30.8],[63,-27.2],[69.9,-20.8],[76.7,-7.2],[83.5,18.2],[83.5,34.6],[76.7,69.1],[69.9,82.7],[63,88.2],[56.2,89.1],[49.4,87.3],[42.5,85.5],[35.7,85.5],[28.9,90],[22.1,99.1],[15.2,107.3],[8.4,111.8],[1.6,112.7],[-5.9,111.8],[-12.7,110],[-19.6,106.3],[-26.4,99.1],[-33.2,86.4],[-40.1,84.5],[-46.9,90],[-53.7,92.7],[-60.6,90],[-67.4,81.8],[-74.2,61.8],[-81.1,27.3],[-87.9,8.2]];
  function skullPath(c){
    c.beginPath();
    c.moveTo(HC.x+TARGET[0][0],HC.y+TARGET[0][1]);
    for(var ti=1;ti<TARGET.length;ti++){
      // Catmull-Rom through the traced points: the sketch is hand-drawn, so
      // the line is smoothed, but never moved off its own samples.
      var p0=TARGET[(ti-2+TARGET.length)%TARGET.length],p1=TARGET[ti-1],
          p2=TARGET[ti],p3=TARGET[(ti+1)%TARGET.length];
      c.bezierCurveTo(HC.x+p1[0]+(p2[0]-p0[0])/6, HC.y+p1[1]+(p2[1]-p0[1])/6,
                      HC.x+p2[0]-(p3[0]-p1[0])/6, HC.y+p2[1]-(p3[1]-p1[1])/6,
                      HC.x+p2[0], HC.y+p2[1]);}

  }
  skullPath(g);
  var hg=g.createLinearGradient(0,HC.y-38,0,HC.y+113);
  hg.addColorStop(0,sT);hg.addColorStop(0.5,sM);hg.addColorStop(1,sB);
  g.fillStyle=hg;g.fill();g.strokeStyle=ed;g.lineWidth=1.3;g.stroke();

    g.strokeStyle="rgba(198,216,246,"+(offl?(sg<0?0.09:0.05):(sg<0?0.26:0.15))+")";g.lineWidth=1.6;
    g.beginPath();g.moveTo(HC.x+sg*10,HC.y-16);
    g.bezierCurveTo(HC.x+sg*22,HC.y-31, HC.x+sg*44,HC.y-36, HC.x+sg*62,HC.y-28);g.stroke();

    g.moveTo(HC.x+sg*6,HC.y-13);
    g.bezierCurveTo(HC.x+sg*24,HC.y-33, HC.x+sg*48,HC.y-37, HC.x+sg*72,HC.y-22);
    g.bezierCurveTo(HC.x+sg*80,HC.y-4, HC.x+sg*54,HC.y+2, HC.x+sg*8,HC.y+2);

  g.beginPath();g.moveTo(HC.x+30,HC.y-26);g.lineTo(HC.x+40,HC.y-14);g.lineTo(HC.x+34,HC.y-6);g.stroke();
  [[HC.x-86,HC.y-36],[HC.x+86,HC.y-36],[HC.x-26,HC.y-76],[HC.x+26,HC.y-76],[HC.x-120,HC.y-2],[HC.x+120,HC.y-2]].forEach(function(rv){

  // battle record: gouge across the left crown panel, scorch up the right cheek

    g.bezierCurveTo(HC.x+sg*36,HC.y-24, HC.x+sg*60,HC.y-27, HC.x+sg*76,HC.y-14);g.stroke();
    g.beginPath();g.moveTo(HC.x+sg*22,HC.y+4);
    g.bezierCurveTo(HC.x+sg*44,HC.y-10, HC.x+sg*66,HC.y-11, HC.x+sg*80,HC.y+2);g.stroke();
    plate(g,[[HC.x+sg*30,HC.y-30],[HC.x+sg*50,HC.y-33],[HC.x+sg*52,HC.y-24],[HC.x+sg*32,HC.y-21]],sM,sB,ed);
    [[34,-27],[48,-29]].forEach(function(bp){
      var bx=HC.x+sg*bp[0],by=HC.y+bp[1];
      g.fillStyle="#05080e";g.beginPath();g.arc(bx,by,1.6,0,7);g.fill();
      g.fillStyle="rgba(190,204,228,"+(offl?0.06:0.18)+")";g.beginPath();g.arc(bx-0.5,by-0.5,0.7,0,7);g.fill();});});
  /* SKULL MODELLING — the pass that stops it reading as a flat mask.
     plate() lights every panel in its own little vertical box, so a head
     built from eight of them comes out evenly bright edge to edge, which
     is exactly what a cut-out looks like. One pass in skull space, clipped
     to the silhouette: a broad highlight up on the left-of-centre crown
     where the room lamp actually is, and hard falloff into both temples,
     so the thing finally turns away from the light at its own edges. */
  g.save();skullPath(g);g.clip();
  var vol=g.createRadialGradient(HC.x-30,HC.y-18,8,HC.x-10,HC.y+30,150);
  vol.addColorStop(0,"rgba(214,232,255,"+(offl?0.07:0.17)+")");
  vol.addColorStop(0.34,"rgba(150,178,214,"+(offl?0.02:0.06)+")");
  vol.addColorStop(0.72,"rgba(2,6,14,0.16)");
  vol.addColorStop(1,"rgba(2,6,14,0.5)");
  g.fillStyle=vol;g.fillRect(HC.x-100,HC.y-46,200,168);
  // terminator down the right flank: the side the lamp never reaches
  var trm=g.createLinearGradient(HC.x+26,0,HC.x+90,0);
  trm.addColorStop(0,"rgba(2,6,14,0)");trm.addColorStop(1,"rgba(2,6,14,0.4)");
  g.fillStyle=trm;g.fillRect(HC.x+26,HC.y-46,100,168);
  g.restore();
  /* GREEBLES — kept, but every one of them now lives INSIDE the outline.
     On the old tall crown they sat where the head no longer is. */
  // louvre bank, left hump: thin, well separated, following the hump slope
  for(var lv=0;lv<5;lv++){
    var lx0=HC.x-64+lv*3, ly0=HC.y-16+lv*7.5, lx1=lx0+22, ly1=ly0-5;
    pl(g,lx0,ly0,lx1,ly1,"rgba(3,6,11,0.62)",1.5);
    pl(g,lx0,ly0+1.3,lx1,ly1+1.3,"rgba(154,170,198,"+(offl?0.05:0.13)+")",0.7);}
  // inspection hatch, right hump: recessed panel, bolts, one sprung corner
  plate(g,[[HC.x+36,HC.y-18],[HC.x+70,HC.y-10],[HC.x+66,HC.y+10],[HC.x+32,HC.y+3]],sM,sB,ed);
  cavity(g,HC.x+32,HC.y-18,38,7,0.5);
  pl(g,HC.x+38,HC.y-8,HC.x+64,HC.y-2,"rgba(4,8,14,0.5)",1);          // seam across it
  [[HC.x+42,HC.y-13],[HC.x+64,HC.y-7],[HC.x+61,HC.y+5],[HC.x+38,HC.y-1]].forEach(function(bp){
    g.fillStyle="#05080e";g.beginPath();g.arc(bp[0],bp[1],1.7,0,7);g.fill();
    g.fillStyle="rgba(190,204,228,"+(offl?0.08:0.2)+")";g.beginPath();g.arc(bp[0]-0.5,bp[1]-0.5,0.75,0,7);g.fill();});
  pl(g,HC.x+32,HC.y+3,HC.x+42,HC.y+5,"rgba(206,222,248,"+(offl?0.1:0.26)+")",1.2);
  // side sensor pods, tucked onto the flanks well inside the edge
  [-1,1].forEach(function(sg){
    plate(g,[[HC.x+sg*78,HC.y+30],[HC.x+sg*64,HC.y+27],[HC.x+sg*62,HC.y+46],[HC.x+sg*75,HC.y+49]],sM,sB,ed);
    if(!offl){g.fillStyle=rdh(0.8);g.beginPath();g.arc(HC.x+sg*70,HC.y+38,2.2,0,7);g.fill();
      RE.fillStyle=rd(0.5);RE.beginPath();RE.arc(HC.x+sg*70,HC.y+38,3.6,0,7);RE.fill();}
    else{g.fillStyle="rgba(150,168,190,0.2)";g.beginPath();g.arc(HC.x+sg*70-1,HC.y+37,1.2,0,7);g.fill();}});
  // stencil, worn, low on the right flank
  g.save();g.globalAlpha=offl?0.12:0.24;g.fillStyle="#c6d2e4";
  g.font="700 8px ui-monospace,monospace";g.textAlign="center";
  g.fillText("SN-100",HC.x+50,HC.y+70);g.restore();
  /* ---- 3 · THE FACE: steel plate, berry eyes, mandible fringe ---- */
  /* the bowl is the SAME ring inset toward the face centre — derived from
     the outline rather than drawn beside it, so no edge of it can ever fall
     outside the silhouette again */
  /* The bowl must not echo the silhouette — an inset copy of the ring drew
     the humps a second time and the head came out double-outlined. It is a
     lens instead: its top follows the brow V (high in the middle, falling
     to the temples) and its floor follows the chin. */
  var FC={x:HC.x,y:HC.y+46};
  g.beginPath();
  g.moveTo(HC.x-78,HC.y+30);
  g.bezierCurveTo(HC.x-52,HC.y+13, HC.x-22,HC.y+9, HC.x,HC.y+12);
  g.bezierCurveTo(HC.x+22,HC.y+9, HC.x+52,HC.y+13, HC.x+78,HC.y+30);
  g.bezierCurveTo(HC.x+80,HC.y+56, HC.x+60,HC.y+80, HC.x+34,HC.y+90);
  g.bezierCurveTo(HC.x+14,HC.y+97, HC.x-14,HC.y+97, HC.x-34,HC.y+90);
  g.bezierCurveTo(HC.x-60,HC.y+80, HC.x-80,HC.y+56, HC.x-78,HC.y+30);
  g.closePath();
  var fg2=g.createLinearGradient(0,HC.y+9,0,HC.y+97);
  fg2.addColorStop(0,offl?"#161b24":"#222937");fg2.addColorStop(0.5,offl?"#0e1219":"#141a25");fg2.addColorStop(1,"#080b11");
  g.fillStyle=fg2;g.fill();
  // no outline stroke: the rim is sold by the cavity below, not by a line
  g.strokeStyle="rgba(8,12,20,0.7)";g.lineWidth=1.2;g.stroke();
  cavity(g,HC.x-70,HC.y-54,140,12,0.55);
  // plate scratches — the face has been CLOSE to things
  pl(g,HC.x-52,HC.y+30,HC.x-20,HC.y+44,"rgba(198,216,246,"+(offl?0.05:0.12)+")",1);
  pl(g,HC.x+26,HC.y+52,HC.x+50,HC.y+40,"rgba(198,216,246,"+(offl?0.04:0.1)+")",1);
  /* the EYES: glossy red berries in chrome sockets, spider-wrapped.
     [dx,dy,r] from face centre; one is dead and cracked. */
  var FY=HC.y+46, ES=0.74;                       // the head shrank; the stare scales with it
  var EYES=[[0,6,15],[-33,2,10.5],[33,2,10.5],[-16,-18,8.5],[16,-18,8.5],
            [-57,-8,7.5],[57,-8,7.5],[0,-30,6.5],[-40,-26,6],[40,-26,6],
            [-66,-24,4.5],[66,-24,4.5],[-18,26,5.5],[18,26,5.5],[0,34,4]]
           .map(function(e){return [e[0]*ES,e[1]*ES,e[2]*ES];});
  var DEAD=9;
  EYES.forEach(function(E,ei){
    var ex=HC.x+E[0], ey=FY+E[1], er=E[2];
    // chrome socket: a raised ring catching the room light
    g.fillStyle="#060a10";g.beginPath();g.arc(ex,ey,er+2.6,0,7);g.fill();
    var chv=0.72+Rnd(ei*13)*0.5;                       // this socket's own polish
    g.strokeStyle=offl?"rgba(57,65,78,"+chv+")":"rgba(102,116,140,"+chv+")";
    g.lineWidth=1.2+Rnd(ei*17)*0.8;
    g.beginPath();g.arc(ex,ey,er+1.8,0,7);g.stroke();
    g.strokeStyle="rgba(210,224,246,"+((offl?0.12:0.35)*chv)+")";g.lineWidth=1;
    g.beginPath();g.arc(ex,ey,er+1.8,Math.PI*1.1,Math.PI*1.7);g.stroke();
    if(offl||ei===DEAD){
      // dead glass: deep dark ball that still keeps its glint
      var dgr=g.createRadialGradient(ex-er*0.35,ey-er*0.4,er*0.1,ex,ey,er);
      dgr.addColorStop(0,"#2a3038");dgr.addColorStop(0.5,"#12161d");dgr.addColorStop(1,"#07090e");
      g.fillStyle=dgr;g.beginPath();g.arc(ex,ey,er,0,7);g.fill();
      g.fillStyle="rgba(220,232,250,0.5)";g.beginPath();g.arc(ex-er*0.38,ey-er*0.42,Math.max(0.8,er*0.16),0,7);g.fill();
      if(ei===DEAD){pl(g,ex-er*0.7,ey-er*0.2,ex+er*0.5,ey+er*0.55,"rgba(170,185,205,0.45)",0.9);
        pl(g,ex,ey-er*0.7,ex+er*0.3,ey+er*0.1,"rgba(170,185,205,0.3)",0.8);}
      return;}
    // live berry: deep red ball, hot core, hard specular
    var ph=Rnd(ei*7)*6.28;
    var shimmer=0.82+0.18*Math.sin(t*(1.3+Rnd(ei*3))+ph);
    if(Math.sin(t*0.5+ph*3)<-0.94)shimmer*=0.5;
    var lum=(work?1:0.62)*shimmer;
    var eg=g.createRadialGradient(ex,ey+er*0.14,er*0.08,ex,ey,er);
    eg.addColorStop(0,"rgba(255,120,96,"+(0.95*lum)+")");
    eg.addColorStop(0.4,"rgba(224,32,20,"+(0.95*lum)+")");
    eg.addColorStop(0.8,"rgba(120,10,8,"+(0.9*lum+0.1)+")");
    eg.addColorStop(1,"rgba(46,4,4,1)");
    g.fillStyle=eg;g.beginPath();g.arc(ex,ey,er,0,7);g.fill();
    g.fillStyle="rgba(255,244,240,"+(0.75*lum+0.1)+")";              // the glint
    g.beginPath();g.arc(ex-er*0.36,ey-er*0.42,Math.max(0.9,er*0.2),0,7);g.fill();
    RE.save();var ge=RE.createRadialGradient(ex,ey,er*0.2,ex,ey,er+6);
    ge.addColorStop(0,rdh(0.7*lum));ge.addColorStop(0.6,rd(0.35*lum));ge.addColorStop(1,rd(0));
    RE.fillStyle=ge;RE.beginPath();RE.arc(ex,ey,er+6,0,7);RE.fill();RE.restore();
  });
  if(!offl){ // the stare lights its own face plate and the deck below
    g.save();g.globalCompositeOperation="lighter";
    var cl=g.createRadialGradient(HC.x,FY+14,12,HC.x,FY+14,120);
    cl.addColorStop(0,rd(0.16*pulse+0.08));cl.addColorStop(0.6,rd(0.05));cl.addColorStop(1,rd(0));
    g.fillStyle=cl;g.beginPath();g.arc(HC.x,FY+14,120,0,7);g.fill();g.restore();
  }
  /* mandible fringe: small dark claws hanging along the chin curve,
     twitching independently — an underbite of hooks, not a grin */
  /* An even row of triangles is a GRIN. These are feed hooks: irregular
     spacing, three lengths, a couple folded back under the jaw, and none of
     them vertical — the fringe should look like it grabs, not like it smiles. */
  var FANG=[[-33,0.55,0.5],[-25,1.0,0.15],[-18,0.42,-0.35],[-9,0.86,0.1],
            [-1,0.62,-0.2],[7,1.0,0.25],[15,0.5,-0.4],[23,0.78,0.05],[31,0.46,0.45]];
  FANG.forEach(function(F,md){
    var mx=HC.x+F[0]*1.9, my=HC.y+68+Math.cos(F[0]*0.05)*8;
    var taper=1-Math.pow(Math.abs(F[0])/34,2)*0.45;    // the jaw lifts at its corners
    var ml2=(8+F[1]*15)*taper, tw2=offl?0:Math.sin(t*(5+md*0.8)+md*2)*1.8;
    var w0=2.6+F[1]*2.6;
    var tipx=mx+F[2]*ml2*0.8+tw2, tipy=my+ml2;
    var ang=Math.atan2(tipy-my,tipx-mx), nx=-Math.sin(ang)*w0, ny=Math.cos(ang)*w0;
    poly(g,[[mx+nx,my+ny],[mx-nx,my-ny],[tipx-nx*0.1,tipy-ny*0.1],[tipx+nx*0.1,tipy+ny*0.1]]);
    var fgd=g.createLinearGradient(mx,my,tipx,tipy);
    fgd.addColorStop(0,offl?"#2b323d":"#4d5768");fgd.addColorStop(0.5,offl?"#181e27":"#252c39");fgd.addColorStop(1,"#070b11");
    g.fillStyle=fgd;g.fill();
    pl(g,mx-nx*0.7,my-ny*0.7,tipx-nx*0.1,tipy-ny*0.1,"rgba(206,222,248,"+(offl?0.1:0.3)+")",1);
    var kg=g.createRadialGradient(mx-0.6,my-1.4,0.3,mx,my-0.5,w0*0.6);
    kg.addColorStop(0,offl?"#232b36":"#3a4453");kg.addColorStop(1,"#070b11");
    g.fillStyle=kg;g.beginPath();g.arc(mx,my-0.5,w0*0.5,0,7);g.fill();});
  [g,RE].forEach(function(c){c.restore();});

  /* ---- 4 · FRONT WHIPS: one curling high past the skull, one strike
     whip hovering its grapple over the deck. Offline both lie dead. ---- */
  if(!offl){
    // one thrown up past the skull, one reaching forward-down at the viewer
    var FP1=[[cx-24+HX,RT-8],[cx-150,RT+10],[cx-190,236],[cx-146,158+sw*6]];
    var p1=whip(FP1,6,2.4,40), e1=p1[p1.length-1], q1=p1[p1.length-2];
    grapple(e1[0],e1[1],Math.atan2(e1[1]-q1[1],e1[0]-q1[0]),0.75,true);
    var FP2=[[cx+26+HX,RT-6],[cx+128,RT+60],[cx+196,RT+130],[cx+150,RT+196+sw2*6]];
    var p2=whip(FP2,6,2.6,38), e2=p2[p2.length-1], q2=p2[p2.length-2];
    grapple(e2[0],e2[1],Math.atan2(e2[1]-q2[1],e2[0]-q2[0]),0.9,true);
  }else{
    var FP1=[[cx-26,RT-8],[cx-96,528],[cx-146,556],[cx-198,546]];
    var p1=whip(FP1,6,2.4,36), e1=p1[p1.length-1], q1=p1[p1.length-2];
    grapple(e1[0],e1[1],Math.atan2(e1[1]-q1[1],e1[0]-q1[0]),0,true);
    var FP2=[[cx+26,RT-6],[cx+104,534],[cx+156,559],[cx+206,548]];
    var p2=whip(FP2,6,2.6,36), e2=p2[p2.length-1], q2=p2[p2.length-2];
    grapple(e2[0],e2[1],Math.atan2(e2[1]-q2[1],e2[0]-q2[0]),0,true);
  }

  /* ---- 5 · offline: beacon rakes the crown lobes ---- */
  if(offl){var bp=0.55;
    // the beacon catches EDGES: the lobe's top arris and the brow lip, the
    // two lines that actually face a light standing off to the left
    // drawn outside the head transform, so the crest coords carry HS themselves
    var kx=function(v){return HC.x+v*HS;}, ky=function(v){return HC.y+v*HS;};
    pl(g,kx(-72),ky(-16),kx(-34),ky(-33),"rgba(255,64,52,"+(0.3*bp)+")",2);
    pl(g,kx(-84),ky(18),kx(-44),ky(6),"rgba(255,64,52,"+(0.17*bp)+")",1.6);
    RE.strokeStyle="rgba(255,64,52,"+(0.13*bp)+")";RE.lineWidth=2.4;
    RE.beginPath();RE.moveTo(kx(-72),ky(-16));RE.lineTo(kx(-34),ky(-33));RE.stroke();}

  /* ---- room light lands on the unit ---- */
  RB.save();RB.globalCompositeOperation="source-atop";
  var key=RB.createLinearGradient(0,140,0,GY);
  key.addColorStop(0,"rgba(206,226,255,"+(offl?0.05:0.12)+")");
  key.addColorStop(0.3,"rgba(186,206,238,"+(offl?0.02:0.045)+")");
  key.addColorStop(0.68,"rgba(2,6,14,0.10)");
  key.addColorStop(1,"rgba(2,6,14,0.22)");
  RB.fillStyle=key;RB.fillRect(0,0,W,H);
  var bnc=RB.createLinearGradient(0,GY-130,0,GY-8);
  bnc.addColorStop(0,"rgba(104,146,196,0)");bnc.addColorStop(1,"rgba(104,146,196,"+(offl?0.04:0.1)+")");
  RB.fillStyle=bnc;RB.fillRect(0,0,W,H);RB.restore();

  /* ---- rim light: red key, cyan fill ---- */
  RR.globalCompositeOperation="source-over";RR.drawImage(body,0,0);
  RR.globalCompositeOperation="destination-out";RR.drawImage(body,-2.2,1.7);RR.drawImage(body,-1.5,-2.4);
  RR.globalCompositeOperation="source-in";
  var rl=RR.createLinearGradient(60,0,460,0);
  rl.addColorStop(0,"rgba(255,45,34,0.95)");rl.addColorStop(0.42,"rgba(198,140,150,0.42)");rl.addColorStop(1,"rgba(95,214,255,1)");
  RR.fillStyle=rl;RR.fillRect(0,0,W,H);RR.globalCompositeOperation="source-over";
}

/* ---- scene ---- */
function drawScene(t,st){
  var offl=st==="offline";
  var wall=S.createLinearGradient(0,0,0,H);
  wall.addColorStop(0,offl?"#07090d":"#0b0e14");wall.addColorStop(0.75,offl?"#05070a":"#090c12");wall.addColorStop(1,"#05070b");
  S.fillStyle=wall;S.fillRect(0,0,W,H);
  if(!offl){var cone=S.createLinearGradient(0,40,0,560);
    cone.addColorStop(0,"rgba(255,214,150,0.07)");cone.addColorStop(1,"rgba(255,214,150,0)");
    S.fillStyle=cone;S.beginPath();S.moveTo(225,40);S.lineTo(295,40);S.lineTo(410,560);S.lineTo(110,560);S.closePath();S.fill();
    var rg=S.createRadialGradient(260,290,20,260,290,240);
    rg.addColorStop(0,"rgba(255,45,34,0.06)");rg.addColorStop(1,"rgba(255,45,34,0)");
    S.fillStyle=rg;S.fillRect(0,0,W,H);}
  else{var bc=S.createRadialGradient(90,120,4,90,120,150);
    bc.addColorStop(0,"rgba(255,60,50,0.12)");bc.addColorStop(1,"rgba(255,60,50,0)");
    S.fillStyle=bc;S.fillRect(0,0,W,H);}
  S.fillStyle=offl?"#07090c":"#0d1118";S.fillRect(0,560,W,H-560);
  pl(S,0,560,W,560,"rgba(120,140,170,0.14)",1);
  /* Alive: ONE soft shadow pooled far below a body that touches nothing —
     small, diffuse and offset by the drift, which is the whole tell that a
     thing is airborne. Dead: hard contact patches where it fell. */
  if(offl){
    [-238,-166,-100,-58,-52,58,70,112,176,242].forEach(function(dx){
      var sh=S.createRadialGradient(260+dx,560,1,260+dx,560,30);
      sh.addColorStop(0,"rgba(0,0,0,0.5)");sh.addColorStop(0.6,"rgba(0,0,0,0.22)");sh.addColorStop(1,"rgba(0,0,0,0)");
      S.fillStyle=sh;S.beginPath();S.ellipse(260+dx,560,30,8,0,0,7);S.fill();});
    var sh2=S.createRadialGradient(260,558,8,260,558,180);
    sh2.addColorStop(0,"rgba(0,0,0,0.45)");sh2.addColorStop(1,"rgba(0,0,0,0)");
    S.fillStyle=sh2;S.beginPath();S.ellipse(260,558,180,18,0,0,7);S.fill();
  }else{
    var dr=Math.sin(t*0.53)*4;
    var sh3=S.createRadialGradient(260+dr,562,10,260+dr,562,120);
    sh3.addColorStop(0,"rgba(0,0,0,0.34)");sh3.addColorStop(0.55,"rgba(0,0,0,0.14)");sh3.addColorStop(1,"rgba(0,0,0,0)");
    S.fillStyle=sh3;S.beginPath();S.ellipse(260+dr,562,120,13,0,0,7);S.fill();
    S.save();S.globalCompositeOperation="lighter";
    var tp=S.createRadialGradient(260+dr,558,4,260+dr,558,150);
    tp.addColorStop(0,"rgba(255,45,34,0.07)");tp.addColorStop(1,"rgba(255,45,34,0)");
    S.fillStyle=tp;S.beginPath();S.ellipse(260+dr,558,150,16,0,0,7);S.fill();S.restore();}
  S.drawImage(body,0,0);
  S.drawImage(rim,0,0);
  S.save();S.globalCompositeOperation="lighter";S.drawImage(emis,0,0);S.restore();
}

function drawTarget(){
  if(qs.get("outline")===null)return;
  var T=window.__TARGET__;if(!T)return;
  S.save();S.strokeStyle="#2b6bff";S.lineWidth=3;S.lineJoin="round";
  var k=window.__HS__||1;
  S.beginPath();T.forEach(function(p,i){var x=260+p[0]*k,y=250+p[1]*k;i?S.lineTo(x,y):S.moveTo(x,y);});
  S.closePath();S.stroke();S.restore();}
function frame(){
  var t=reduced?T0:(performance.now()/1000);
  drawUnit(t,STATE);drawScene(t,STATE);drawTarget();
  if(!reduced)requestAnimationFrame(frame);
}
frame();

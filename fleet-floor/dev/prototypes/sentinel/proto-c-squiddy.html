<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SQUIDDY — sentinel prototype C</title>
<style>
  html,body{margin:0;background:#04060a;height:100%;font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0}
  canvas{display:block;background:#000;border-radius:6px;max-width:94vw;height:auto}
  #bar{margin-top:12px;display:flex;gap:8px}
  #bar button{font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:7px 14px;background:#0a0f16;border:1px solid #1c2733;border-radius:7px;color:#7d8ba0;cursor:pointer}
  #bar button.on{color:#ff8a7a;border-color:#5c2a24;background:#1c0f0d}
  #cap{margin-top:10px;font-size:11px;color:#55657a;letter-spacing:.06em}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="520" height="640"></canvas>
  <div id="bar">
    <button data-st="working">working</button>
    <button data-st="idle">idle</button>
    <button data-st="offline">offline</button>
  </div>
  <div id="cap">SQUIDDY (SN-100) — bilobed skull, the machine-mother stare · it never touches the deck</div>
</div>
<script>
/* ============================================================================
   SENTINEL PROTO C — "SQUIDDY" (SN-100)                            crew#128

   Drawn against the actual Matrix sentinel reference, then taken through
   ten render loops. What the reference actually is:

     · a BILOBED cranium, drawn to the operator's own outline (the blue
       overlay on PR #230): two humps with a saddle dipping between them,
       flanks bulging out and down, the mass tapering to a rounded chin.
       That dip is the whole shape — a flat oval carapace with a straight
       brow bar under it is a TICK, which is exactly what the previous
       revision was. So the brow is not one horizontal ledge: it is two
       ridges, one per lobe, meeting in the saddle and throwing a V of
       shadow down into the eye field.
     · the eyes are glossy red BERRIES in chrome sockets, fifteen of
       them, different sizes, packed across a deep recessed face bowl,
       each with its own specular glint, shimmer clock and socket
       polish. One is dead and cracked. Not a neat ring: a stare.
     · a fringe of tapered MANDIBLE FANGS under the jaw, curling inward,
       each twitching on its own clock
     · a dozen long thin ribbed WHIPS — segmented conduit with a lit
       crown and a shadowed belly, S-curving in every direction, tipped
       with three-prong grapple claws
   It FLIES: alive it hovers with nothing touching the deck, drifting a
   slow figure-of-eight, one whip thrown high and one reaching forward.
   Dead it is on the floor — the hull drops, every whip crumples at its
   own height, and fifteen dead lenses keep their glints.
   ========================================================================== */
var cv=document.getElementById("cv"), S=cv.getContext("2d");
var W=520,H=640;
var body=document.createElement("canvas"),emis=document.createElement("canvas"),rim=document.createElement("canvas");
[body,emis,rim].forEach(function(c){c.width=W;c.height=H;});
var RB=body.getContext("2d"),RE=emis.getContext("2d"),RR=rim.getContext("2d");

function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}}
function poly(c,pts){c.beginPath();for(var i=0;i<pts.length;i++){if(i)c.lineTo(pts[i][0],pts[i][1]);else c.moveTo(pts[i][0],pts[i][1]);}c.closePath();}
function plate(c,pts,top,bot,ed){var y0=1e9,y1=-1e9;for(var i=0;i<pts.length;i++){if(pts[i][1]<y0)y0=pts[i][1];if(pts[i][1]>y1)y1=pts[i][1];}var gg=c.createLinearGradient(0,y0,0,y1);gg.addColorStop(0,top);gg.addColorStop(1,bot);poly(c,pts);c.fillStyle=gg;c.fill();if(ed){c.strokeStyle=ed;c.lineWidth=1.2;c.lineJoin="round";c.stroke();}}
function pl(c,x0,y0,x1,y1,col,w){c.strokeStyle=col;c.lineWidth=w||1;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}
function cavity(c,x,y,w,h,a){var gg=c.createLinearGradient(0,y,0,y+h);gg.addColorStop(0,"rgba(2,5,9,"+a+")");gg.addColorStop(1,"rgba(2,5,9,0)");c.fillStyle=gg;c.fillRect(x,y,w,h);}
function Rnd(i){var x=Math.sin(i*127.1+13.7)*43758.5453;return x-Math.floor(x);}
function cub(P,u){var v=1-u;
  return [v*v*v*P[0][0]+3*v*v*u*P[1][0]+3*v*u*u*P[2][0]+u*u*u*P[3][0],
          v*v*v*P[0][1]+3*v*v*u*P[1][1]+3*v*u*u*P[2][1]+u*u*u*P[3][1]];}

var qs=new URLSearchParams(location.search);
var STATE=qs.get("state")||"working";
var reduced=qs.get("t")!==null;
var T0=qs.get("t")===null?0:Number(qs.get("t"));

document.querySelectorAll("#bar button").forEach(function(b){
  if(b.dataset.st===STATE)b.classList.add("on");
  b.onclick=function(){location.search="?state="+b.dataset.st;};
});

function drawUnit(t,st){
  var offl=st==="offline", work=st==="working";
  [RB,RE,RR].forEach(function(c){c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);c.globalAlpha=1;c.globalCompositeOperation="source-over";});
  var g=RB, cx=260, GY=560;
  var sT="#2a3242",sM="#161c28",sB="#090d14",ed="#323c50",eH="#47556a";
  if(offl){sT="#1b202a";sM="#0e121a";sB="#05080e";ed="#222936";eH="#2a3241";}
  var RD=offl?[70,66,72]:[255,45,34], RDH=offl?[110,104,108]:[255,148,130];
  function rd(a){return "rgba("+RD[0]+","+RD[1]+","+RD[2]+","+a+")";}
  function rdh(a){return "rgba("+RDH[0]+","+RDH[1]+","+RDH[2]+","+a+")";}
  var pulse=offl?0:(work?(0.66+0.2*Math.sin(t*5.5)):(0.4+0.12*Math.sin(t*1.7)));
  /* It FLIES. Alive it hovers, nothing touching the deck — the drift is a
     slow figure-of-eight, not a bob, because a hovering thing holds station
     against something. Dead it is on the floor: the hull drops the whole
     way down and the whips crumple under it. That is the state language. */
  var hov=offl?0:Math.sin(t*0.9)*5+Math.sin(t*0.37)*3;
  var hovX=offl?0:Math.sin(t*0.53)*4;
  var DY=offl?150:hov;
  var HC={x:cx+hovX,y:250+DY};            // skull centre

  /* ---- helpers: ribbed whip + grapple claw + coil stack ---- */
  var segA="#1b222d", segB="#11161f", segAo="#141922", segBo="#0c1017";
  function whip(P,r0,r1,N){
    var pts=[];for(var i2=0;i2<=N;i2++)pts.push(cub(P,i2/N));
    for(var i2=0;i2<N;i2++){
      var a=pts[i2],b=pts[i2+1];
      var ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
      var r=r0+(r1-r0)*(i2/N), stp=Math.hypot(b[0]-a[0],b[1]-a[1]);
      g.save();g.translate((a[0]+b[0])/2,(a[1]+b[1])/2);g.rotate(ang);
      g.fillStyle=(i2%2)?(offl?segAo:segA):(offl?segBo:segB);
      g.beginPath();g.ellipse(0,0,Math.max(stp*0.72,1.4),r,0,0,7);g.fill();
      // conduit is a tube: lit crown on top, hard shadow along the belly
      if(i2%2){g.strokeStyle="rgba(150,164,190,"+(offl?0.05:0.14)+")";g.lineWidth=0.9;
        g.beginPath();g.ellipse(0,0,Math.max(stp*0.6,1.2),r*0.94,0,Math.PI*1.15,Math.PI*1.85);g.stroke();}
      g.strokeStyle="rgba(2,5,10,0.5)";g.lineWidth=Math.max(r*0.5,1);
      g.beginPath();g.moveTo(-stp*0.5,r*0.45);g.lineTo(stp*0.5,r*0.45);g.stroke();
      g.restore();
    }
    return pts;
  }
  function grapple(x,y,ang,open,alive){
    [-1,0,1].forEach(function(k){
      var a2=ang+k*(0.34+open*0.5);
      var tx=x+Math.cos(a2)*13, ty=y+Math.sin(a2)*13;
      var hx=tx+Math.cos(a2+ (k>=0?1.7:-1.7))*4.5, hy=ty+Math.sin(a2+(k>=0?1.7:-1.7))*4.5;
      g.strokeStyle="#05080e";g.lineWidth=3.6;g.lineCap="round";
      g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(tx,ty,hx,hy);g.stroke();
      g.strokeStyle=offl?"#3a4350":"#8b98ac";g.lineWidth=1.5;
      g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(tx,ty,hx,hy);g.stroke();});
    g.fillStyle="#04070c";g.beginPath();g.arc(x,y,4.4,0,7);g.fill();
    g.strokeStyle=eH;g.lineWidth=1;g.beginPath();g.arc(x,y,4.4,0,7);g.stroke();
    if(alive&&!offl){g.fillStyle=rdh(0.9);g.beginPath();g.arc(x,y,1.7,0,7);g.fill();
      RE.fillStyle=rd(0.5);RE.beginPath();RE.arc(x,y,3,0,7);RE.fill();}
  }
  var sw=offl?0:Math.sin(t*0.9), sw2=offl?0:Math.cos(t*0.7);

  /* ---- 0 · BACK WHIPS: flared around the skull, S-curving, never straight.
     Offline they fall and lie where they land. ---- */
  var HX=hovX, RT=HC.y+112;                          // whip root, under the skull
  var BACK=offl?[
    [[cx-46,RT],[cx-138,500],[cx-206,538],[cx-236,558]],
    [[cx+46,RT],[cx+126,516],[cx+196,530],[cx+244,557]],
    [[cx-52,RT+8],[cx-168,530],[cx-104,560],[cx-172,552]],
    [[cx+52,RT+8],[cx+186,522],[cx+142,559],[cx+182,545]],
    [[cx-30,RT+12],[cx-58,548],[cx-14,560],[cx-70,556]],
    [[cx+30,RT+12],[cx+80,536],[cx+38,559],[cx+96,553]]
  ]:[
    // two thrown high and back — the rest sweep out and down like a jellyfish
    [[cx-52+HX,RT],[cx-186,RT-40+sw*6],[cx-118,180],[cx-198,110+sw*5]],
    [[cx+52+HX,RT],[cx+192,RT-36-sw*6],[cx+124,188],[cx+208,124-sw*5]],
    [[cx-58+HX,RT+6],[cx-206,RT+70+sw2*5],[cx-232,398],[cx-238,330+sw2*7]],
    [[cx+58+HX,RT+6],[cx+214,RT+74-sw2*5],[cx+240,406],[cx+246,342-sw2*7]],
    [[cx-34+HX,RT+12],[cx-142,RT+70],[cx-96,466],[cx-176,498+sw*6]],
    [[cx+34+HX,RT+12],[cx+86,RT+118],[cx+178,432],[cx+118,470-sw*6]]
  ];
  BACK.forEach(function(P,bi){
    var pts=whip(P,6.5,2.6,42);
    var e=pts[pts.length-1],pe=pts[pts.length-2];
    grapple(e[0],e[1],Math.atan2(e[1]-pe[1],e[0]-pe[0]),offl?0:0.5+0.3*Math.sin(t*2+bi),true);
  });

  /* ---- 1 · THE UNDERSIDE: the ribbed throat collar the whips root into.
     No feet, no stand — this thing never touches the deck while it lives. */
  var TWO=offl?[
    [[cx-20,RT-6],[cx-52,542],[cx-104,556],[cx-134,548]],
    [[cx+20,RT-4],[cx+58,546],[cx+112,558],[cx+136,550]]
  ]:[
    [[cx-20+HX,RT-6],[cx-84,RT+64],[cx-18,RT+140],[cx-70,RT+188+sw*5]],
    [[cx+20+HX,RT-4],[cx+58,RT+96],[cx+104,RT+140],[cx+44,RT+222-sw*5]]
  ];
  TWO.forEach(function(P,ti){var pts=whip(P,7,3.4,30);
    var e=pts[pts.length-1],pe=pts[pts.length-2];
    grapple(e[0],e[1],Math.atan2(e[1]-pe[1],e[0]-pe[0]),offl?0:0.4+0.25*Math.sin(t*1.7+ti),true);});
  // throat collar: stacked rings narrowing away from the skull
  for(var th=0;th<4;th++){
    var ty2=HC.y+82+th*13, tw=46-th*7;
    g.fillStyle=th%2?"#0d1219":"#10151e";
    g.beginPath();g.ellipse(HC.x,ty2,tw,9,0,0,7);g.fill();
    g.strokeStyle="rgba(4,8,14,0.7)";g.lineWidth=1;g.beginPath();g.ellipse(HC.x,ty2,tw,9,0,0,7);g.stroke();
    if(th<2)cavity(g,HC.x-tw,ty2-2,tw*2,7,0.4);}

  /* ---- 2 · THE SKULL POD: a bilobed cranium ---- */
  /* Operator sketch (PR #230, the blue outline): the head is BILOBED — two
     humps with a saddle dipping between them, sides bulging out and down,
     and the whole mass tapering to a rounded chin. That dip is the entire
     shape. Without it the outline is a flat oval carapace with a straight
     brow bar under it, which is a TICK; with it the thing reads as a skull
     that grew lobes. So the brow is no longer one horizontal ledge across
     the face — it is two ridges, one per lobe, meeting in the saddle. */
  function skullPath(c){
    c.beginPath();
    c.moveTo(HC.x,HC.y-74);                                            // the saddle, dead centre
    c.bezierCurveTo(HC.x-22,HC.y-96, HC.x-52,HC.y-104, HC.x-80,HC.y-96); // up over the left hump
    c.bezierCurveTo(HC.x-110,HC.y-86, HC.x-126,HC.y-50, HC.x-128,HC.y-6); // down the left flank
    c.bezierCurveTo(HC.x-130,HC.y+40, HC.x-104,HC.y+78, HC.x-56,HC.y+96); // bulge, then in to the jaw
    c.bezierCurveTo(HC.x-30,HC.y+107, HC.x+30,HC.y+107, HC.x+56,HC.y+96); // the rounded chin
    c.bezierCurveTo(HC.x+104,HC.y+78, HC.x+130,HC.y+40, HC.x+128,HC.y-6);
    c.bezierCurveTo(HC.x+126,HC.y-50, HC.x+110,HC.y-86, HC.x+80,HC.y-96);
    c.bezierCurveTo(HC.x+52,HC.y-104, HC.x+22,HC.y-96, HC.x,HC.y-74);   // back down into the saddle
    c.closePath();
  }
  skullPath(g);
  var hg=g.createLinearGradient(0,HC.y-106,0,HC.y+107);
  hg.addColorStop(0,sT);hg.addColorStop(0.58,sM);hg.addColorStop(1,sB);
  g.fillStyle=hg;g.fill();g.strokeStyle=ed;g.lineWidth=1.3;g.stroke();
  /* the two lobe shells, each following its own hump and ending AT the
     saddle — the seam between them is the head's centre line */
  function lobeShell(sg){
    g.beginPath();
    g.moveTo(HC.x+sg*3,HC.y-72);
    g.bezierCurveTo(HC.x+sg*22,HC.y-92, HC.x+sg*52,HC.y-100, HC.x+sg*78,HC.y-92);
    g.bezierCurveTo(HC.x+sg*106,HC.y-82, HC.x+sg*120,HC.y-48, HC.x+sg*120,HC.y-10);
    g.bezierCurveTo(HC.x+sg*104,HC.y-14, HC.x+sg*62,HC.y-26, HC.x+sg*8,HC.y-34);
    g.closePath();
    var lg3=g.createLinearGradient(0,HC.y-102,0,HC.y-6);
    lg3.addColorStop(0,offl?"#20262f":"#323b4b");lg3.addColorStop(1,"rgba(22,28,40,0)");
    g.fillStyle=lg3;g.fill();
    // the crest highlight riding the top of the hump
    g.strokeStyle="rgba(198,216,246,"+(offl?(sg<0?0.08:0.05):(sg<0?0.24:0.14))+")";g.lineWidth=1.5;
    g.beginPath();g.moveTo(HC.x+sg*20,HC.y-86);
    g.bezierCurveTo(HC.x+sg*46,HC.y-97, HC.x+sg*82,HC.y-90, HC.x+sg*104,HC.y-60);g.stroke();
  }
  lobeShell(-1);lobeShell(1);
  // the saddle itself: a sunk keel channel where the two lobes meet
  g.beginPath();
  g.moveTo(HC.x-30,HC.y-46);
  g.bezierCurveTo(HC.x-12,HC.y-76, HC.x+12,HC.y-76, HC.x+30,HC.y-46);
  g.bezierCurveTo(HC.x+14,HC.y-34, HC.x-14,HC.y-34, HC.x-30,HC.y-46);
  g.closePath();
  var kg2=g.createLinearGradient(0,HC.y-76,0,HC.y-34);
  kg2.addColorStop(0,"rgba(4,8,14,0.55)");kg2.addColorStop(1,"rgba(4,8,14,0)");
  g.fillStyle=kg2;g.fill();
  // one seam running down out of the valley — the head's centre line
  g.strokeStyle="rgba(4,8,14,0.5)";g.lineWidth=1.3;
  g.beginPath();g.moveTo(HC.x,HC.y-70);g.lineTo(HC.x,HC.y-26);g.stroke();
  g.strokeStyle="rgba(186,208,242,"+(offl?0.04:0.1)+")";g.lineWidth=1;
  g.beginPath();g.moveTo(HC.x+1.4,HC.y-68);g.lineTo(HC.x+1.4,HC.y-30);g.stroke();
  /* BROW RIDGES — one per lobe, sweeping down and outward from the saddle,
     so the shadow they throw is a V and not a bar */
  [-1,1].forEach(function(sg){
    g.beginPath();
    g.moveTo(HC.x+sg*10,HC.y-22);
    g.bezierCurveTo(HC.x+sg*48,HC.y-30, HC.x+sg*92,HC.y-18, HC.x+sg*114,HC.y+8);
    g.bezierCurveTo(HC.x+sg*92,HC.y+2, HC.x+sg*50,HC.y-8, HC.x+sg*10,HC.y-4);
    g.closePath();
    var bg3=g.createLinearGradient(0,HC.y-30,0,HC.y+8);
    bg3.addColorStop(0,sT);bg3.addColorStop(1,sB);
    g.fillStyle=bg3;g.fill();g.strokeStyle=ed;g.lineWidth=1.1;g.stroke();
    g.strokeStyle="rgba(198,216,246,"+(offl?0.07:0.2)+")";g.lineWidth=1.3;
    g.beginPath();g.moveTo(HC.x+sg*12,HC.y-21);
    g.bezierCurveTo(HC.x+sg*48,HC.y-29, HC.x+sg*90,HC.y-17, HC.x+sg*110,HC.y+6);g.stroke();});
  // the V-shaped shadow the ridges throw down into the eye field
  g.save();g.beginPath();
  g.moveTo(HC.x-116,HC.y+4);g.lineTo(HC.x,HC.y-8);g.lineTo(HC.x+116,HC.y+4);
  g.lineTo(HC.x+116,HC.y+40);g.lineTo(HC.x-116,HC.y+40);g.closePath();g.clip();
  cavity(g,HC.x-116,HC.y-8,232,40,0.7);g.restore();
  // cheek plates hugging the flank bulges, following the curve down
  [-1,1].forEach(function(sg){
    g.beginPath();
    g.moveTo(HC.x+sg*122,HC.y+2);
    g.bezierCurveTo(HC.x+sg*124,HC.y+38, HC.x+sg*104,HC.y+72, HC.x+sg*62,HC.y+90);
    g.lineTo(HC.x+sg*58,HC.y+76);
    g.bezierCurveTo(HC.x+sg*96,HC.y+60, HC.x+sg*112,HC.y+34, HC.x+sg*110,HC.y+2);
    g.closePath();
    var cg4=g.createLinearGradient(0,HC.y+2,0,HC.y+90);
    cg4.addColorStop(0,sM);cg4.addColorStop(1,sB);
    g.fillStyle=cg4;g.fill();g.strokeStyle=ed;g.lineWidth=1.1;g.stroke();});
  // seam cracks wandering the crown; rivets where the panels pin
  g.strokeStyle="rgba(4,8,14,0.6)";g.lineWidth=1.1;
  g.beginPath();g.moveTo(HC.x-58,HC.y-74);g.lineTo(HC.x-44,HC.y-58);g.lineTo(HC.x-52,HC.y-48);g.stroke();
  g.beginPath();g.moveTo(HC.x+40,HC.y-78);g.lineTo(HC.x+52,HC.y-62);g.lineTo(HC.x+44,HC.y-52);g.stroke();
  [[HC.x-86,HC.y-36],[HC.x+86,HC.y-36],[HC.x-26,HC.y-76],[HC.x+26,HC.y-76],[HC.x-120,HC.y-2],[HC.x+120,HC.y-2]].forEach(function(rv){
    g.fillStyle="#05080e";g.beginPath();g.arc(rv[0],rv[1],1.8,0,7);g.fill();
    g.fillStyle="rgba(190,204,228,"+(offl?0.08:0.2)+")";g.beginPath();g.arc(rv[0]-0.5,rv[1]-0.5,0.8,0,7);g.fill();});
  // battle record: gouge across the left crown panel, scorch up the right cheek
  poly(g,[[HC.x-92,HC.y-46],[HC.x-56,HC.y-68],[HC.x-52,HC.y-60],[HC.x-86,HC.y-38]]);
  g.fillStyle="rgba(2,4,8,0.92)";g.fill();
  pl(g,HC.x-92,HC.y-46,HC.x-56,HC.y-68,"rgba(198,216,246,"+(offl?0.06:0.16)+")",1.2);
  var sco=g.createLinearGradient(0,HC.y+40,0,HC.y+92);
  sco.addColorStop(0,"rgba(8,5,3,0)");sco.addColorStop(1,"rgba(8,5,3,0.4)");
  g.fillStyle=sco;poly(g,[[HC.x+56,HC.y+44],[HC.x+104,HC.y+40],[HC.x+70,HC.y+90],[HC.x+40,HC.y+92]]);g.fill();
  // hook antennae on the crown — three small black barbs
  [[-64,-98,-0.6],[-38,-100,-0.3],[38,-100,0.3],[64,-98,0.6]].forEach(function(an){
    g.strokeStyle="#0a0e15";g.lineWidth=2.6;g.lineCap="round";
    g.beginPath();g.moveTo(HC.x+an[0],HC.y+an[1]+6);
    g.quadraticCurveTo(HC.x+an[0]+an[2]*10,HC.y+an[1]-8,HC.x+an[0]+an[2]*16,HC.y+an[1]-4);g.stroke();
    g.strokeStyle="rgba(150,164,190,"+(offl?0.08:0.2)+")";g.lineWidth=1;
    g.beginPath();g.moveTo(HC.x+an[0],HC.y+an[1]+6);
    g.quadraticCurveTo(HC.x+an[0]+an[2]*10,HC.y+an[1]-8,HC.x+an[0]+an[2]*16,HC.y+an[1]-4);g.stroke();});
  // side sensor pods on the temple bevels, one lens each
  [-1,1].forEach(function(sg){
    plate(g,[[HC.x+sg*106,HC.y+16],[HC.x+sg*92,HC.y+14],[HC.x+sg*90,HC.y+40],[HC.x+sg*104,HC.y+42]],sM,sB,ed);
    if(!offl){g.fillStyle=rdh(0.8);g.beginPath();g.arc(HC.x+sg*98,HC.y+27,2.4,0,7);g.fill();
      RE.fillStyle=rd(0.5);RE.beginPath();RE.arc(HC.x+sg*98,HC.y+27,4,0,7);RE.fill();}
    else{g.fillStyle="rgba(150,168,190,0.2)";g.beginPath();g.arc(HC.x+sg*98-1,HC.y+26,1.2,0,7);g.fill();}
  });
  /* SKULL MODELLING — the pass that stops it reading as a flat mask.
     plate() lights every panel in its own little vertical box, so a head
     built from eight of them comes out evenly bright edge to edge, which
     is exactly what a cut-out looks like. One pass in skull space, clipped
     to the silhouette: a broad highlight up on the left-of-centre crown
     where the room lamp actually is, and hard falloff into both temples,
     so the thing finally turns away from the light at its own edges. */
  g.save();skullPath(g);g.clip();
  var vol=g.createRadialGradient(HC.x-26,HC.y-72,10,HC.x-10,HC.y-30,168);
  vol.addColorStop(0,"rgba(214,232,255,"+(offl?0.07:0.17)+")");
  vol.addColorStop(0.34,"rgba(150,178,214,"+(offl?0.02:0.06)+")");
  vol.addColorStop(0.72,"rgba(2,6,14,0.16)");
  vol.addColorStop(1,"rgba(2,6,14,0.5)");
  g.fillStyle=vol;g.fillRect(HC.x-140,HC.y-130,280,240);
  // terminator down the right flank: the side the lamp never reaches
  var trm=g.createLinearGradient(HC.x+34,0,HC.x+124,0);
  trm.addColorStop(0,"rgba(2,6,14,0)");trm.addColorStop(1,"rgba(2,6,14,0.42)");
  g.fillStyle=trm;g.fillRect(HC.x+34,HC.y-130,110,240);
  g.restore();
  /* GREEBLES — the pass that turns three big panels into a machine. Cheap
     shapes, all of them reading at grid size: a louvre bank, an inspection
     hatch, and panel lines that cross the seams the way real plating does. */
  for(var lv=0;lv<4;lv++){                                   // louvre bank, left lobe
    var lvy=HC.y-78+lv*9;
    pl(g,HC.x-92+lv*2,lvy,HC.x-58+lv*2,lvy-5,"rgba(3,6,11,0.8)",2.6);
    pl(g,HC.x-92+lv*2,lvy+1.6,HC.x-58+lv*2,lvy-3.4,"rgba(150,166,194,"+(offl?0.05:0.14)+")",0.9);}
  // inspection hatch, right lobe: recessed panel, four bolts, one corner sprung
  plate(g,[[HC.x+50,HC.y-76],[HC.x+92,HC.y-66],[HC.x+88,HC.y-38],[HC.x+46,HC.y-48]],sM,sB,ed);
  cavity(g,HC.x+46,HC.y-76,46,8,0.5);
  [[HC.x+54,HC.y-70],[HC.x+86,HC.y-62],[HC.x+83,HC.y-44],[HC.x+51,HC.y-52]].forEach(function(bp){
    g.fillStyle="#05080e";g.beginPath();g.arc(bp[0],bp[1],2,0,7);g.fill();
    g.fillStyle="rgba(190,204,228,"+(offl?0.08:0.22)+")";g.beginPath();g.arc(bp[0]-0.6,bp[1]-0.6,0.9,0,7);g.fill();});
  pl(g,HC.x+46,HC.y-48,HC.x+58,HC.y-45,"rgba(206,222,248,"+(offl?0.1:0.28)+")",1.3);
  // panel lines raking across the brow shelf, crossing the seams
  pl(g,HC.x-74,HC.y-22,HC.x-30,HC.y-30,"rgba(4,8,14,0.5)",1.1);
  pl(g,HC.x+74,HC.y-22,HC.x+30,HC.y-30,"rgba(4,8,14,0.5)",1.1);
  pl(g,HC.x-52,HC.y-8,HC.x+52,HC.y-8,"rgba(4,8,14,0.35)",1);
  // stencil, worn, on the right crown panel
  g.save();g.globalAlpha=offl?0.12:0.26;g.fillStyle="#c6d2e4";
  g.font="700 9px ui-monospace,monospace";g.textAlign="center";
  g.fillText("SN-100",HC.x+70,HC.y-50);g.restore();

  /* ---- 3 · THE FACE: steel plate, berry eyes, mandible fringe ---- */
  // recessed face plate — a shade of worn steel the shell is not
  g.beginPath();
  g.moveTo(HC.x-96,HC.y+6);
  g.bezierCurveTo(HC.x-100,HC.y+44, HC.x-80,HC.y+72, HC.x-42,HC.y+86);
  g.bezierCurveTo(HC.x-18,HC.y+95, HC.x+18,HC.y+95, HC.x+42,HC.y+86);
  g.bezierCurveTo(HC.x+80,HC.y+72, HC.x+100,HC.y+44, HC.x+96,HC.y+6);
  g.bezierCurveTo(HC.x+50,HC.y-4, HC.x-50,HC.y-4, HC.x-96,HC.y+6);
  g.closePath();
  var fg2=g.createLinearGradient(0,HC.y-4,0,HC.y+95);
  fg2.addColorStop(0,offl?"#161b24":"#222937");fg2.addColorStop(0.5,offl?"#0e1219":"#141a25");fg2.addColorStop(1,"#080b11");
  g.fillStyle=fg2;g.fill();g.strokeStyle="#0a0e15";g.lineWidth=1.6;g.stroke();
  cavity(g,HC.x-70,HC.y-54,140,12,0.55);
  // plate scratches — the face has been CLOSE to things
  pl(g,HC.x-52,HC.y+30,HC.x-20,HC.y+44,"rgba(198,216,246,"+(offl?0.05:0.12)+")",1);
  pl(g,HC.x+26,HC.y+52,HC.x+50,HC.y+40,"rgba(198,216,246,"+(offl?0.04:0.1)+")",1);
  /* the EYES: glossy red berries in chrome sockets, spider-wrapped.
     [dx,dy,r] from face centre; one is dead and cracked. */
  var FY=HC.y+42;
  var EYES=[[0,6,15],[-33,2,10.5],[33,2,10.5],[-16,-18,8.5],[16,-18,8.5],
            [-57,-8,7.5],[57,-8,7.5],[0,-30,6.5],[-40,-26,6],[40,-26,6],
            [-66,-24,4.5],[66,-24,4.5],[-18,26,5.5],[18,26,5.5],[0,34,4]];
  var DEAD=9;
  EYES.forEach(function(E,ei){
    var ex=HC.x+E[0], ey=FY+E[1], er=E[2];
    // chrome socket: a raised ring catching the room light
    g.fillStyle="#060a10";g.beginPath();g.arc(ex,ey,er+2.6,0,7);g.fill();
    var chv=0.72+Rnd(ei*13)*0.5;                       // this socket's own polish
    g.strokeStyle=offl?"rgba(57,65,78,"+chv+")":"rgba(102,116,140,"+chv+")";
    g.lineWidth=1.2+Rnd(ei*17)*0.8;
    g.beginPath();g.arc(ex,ey,er+1.8,0,7);g.stroke();
    g.strokeStyle="rgba(210,224,246,"+((offl?0.12:0.35)*chv)+")";g.lineWidth=1;
    g.beginPath();g.arc(ex,ey,er+1.8,Math.PI*1.1,Math.PI*1.7);g.stroke();
    if(offl||ei===DEAD){
      // dead glass: deep dark ball that still keeps its glint
      var dgr=g.createRadialGradient(ex-er*0.35,ey-er*0.4,er*0.1,ex,ey,er);
      dgr.addColorStop(0,"#2a3038");dgr.addColorStop(0.5,"#12161d");dgr.addColorStop(1,"#07090e");
      g.fillStyle=dgr;g.beginPath();g.arc(ex,ey,er,0,7);g.fill();
      g.fillStyle="rgba(220,232,250,0.5)";g.beginPath();g.arc(ex-er*0.38,ey-er*0.42,Math.max(0.8,er*0.16),0,7);g.fill();
      if(ei===DEAD){pl(g,ex-er*0.7,ey-er*0.2,ex+er*0.5,ey+er*0.55,"rgba(170,185,205,0.45)",0.9);
        pl(g,ex,ey-er*0.7,ex+er*0.3,ey+er*0.1,"rgba(170,185,205,0.3)",0.8);}
      return;}
    // live berry: deep red ball, hot core, hard specular
    var ph=Rnd(ei*7)*6.28;
    var shimmer=0.82+0.18*Math.sin(t*(1.3+Rnd(ei*3))+ph);
    if(Math.sin(t*0.5+ph*3)<-0.94)shimmer*=0.5;
    var lum=(work?1:0.62)*shimmer;
    var eg=g.createRadialGradient(ex,ey+er*0.14,er*0.08,ex,ey,er);
    eg.addColorStop(0,"rgba(255,120,96,"+(0.95*lum)+")");
    eg.addColorStop(0.4,"rgba(224,32,20,"+(0.95*lum)+")");
    eg.addColorStop(0.8,"rgba(120,10,8,"+(0.9*lum+0.1)+")");
    eg.addColorStop(1,"rgba(46,4,4,1)");
    g.fillStyle=eg;g.beginPath();g.arc(ex,ey,er,0,7);g.fill();
    g.fillStyle="rgba(255,244,240,"+(0.75*lum+0.1)+")";              // the glint
    g.beginPath();g.arc(ex-er*0.36,ey-er*0.42,Math.max(0.9,er*0.2),0,7);g.fill();
    RE.save();var ge=RE.createRadialGradient(ex,ey,er*0.2,ex,ey,er+6);
    ge.addColorStop(0,rdh(0.7*lum));ge.addColorStop(0.6,rd(0.35*lum));ge.addColorStop(1,rd(0));
    RE.fillStyle=ge;RE.beginPath();RE.arc(ex,ey,er+6,0,7);RE.fill();RE.restore();
  });
  if(!offl){ // the stare lights its own face plate and the deck below
    g.save();g.globalCompositeOperation="lighter";
    var cl=g.createRadialGradient(HC.x,FY+14,12,HC.x,FY+14,120);
    cl.addColorStop(0,rd(0.16*pulse+0.08));cl.addColorStop(0.6,rd(0.05));cl.addColorStop(1,rd(0));
    g.fillStyle=cl;g.beginPath();g.arc(HC.x,FY+14,120,0,7);g.fill();g.restore();
  }
  /* mandible fringe: small dark claws hanging along the chin curve,
     twitching independently — an underbite of hooks, not a grin */
  for(var md=0;md<9;md++){
    var mu=md/8, mx=HC.x-40+mu*80, my=HC.y+80+Math.sin(mu*Math.PI)*7;
    // fangs, not staples: each is a tapered wedge that curls inward toward
    // the centreline, longest at the jaw's middle, and every one twitches
    // on its own clock so the fringe is never a tidy row
    var ml2=(13+Math.sin(mu*Math.PI)*9)*(0.78+Rnd(md*5)*0.4);
    var inw=(HC.x-mx)*0.09, tw2=offl?0:Math.sin(t*(5.5+md*0.6)+md*2)*2.2;
    var w0=5+Rnd(md*3)*1.8;
    var tipx=mx+inw+tw2, tipy=my+ml2;
    var ang=Math.atan2(tipy-my,tipx-mx), nx=-Math.sin(ang)*w0, ny=Math.cos(ang)*w0;
    poly(g,[[mx+nx,my+ny],[mx-nx,my-ny],[tipx-nx*0.12,tipy-ny*0.12],[tipx+nx*0.12,tipy+ny*0.12]]);
    var fgd=g.createLinearGradient(mx,my,tipx,tipy);
    fgd.addColorStop(0,offl?"#333b48":"#5a6678");fgd.addColorStop(0.55,offl?"#1c222c":"#2c3442");fgd.addColorStop(1,"#080c13");
    g.fillStyle=fgd;g.fill();
    // the honed inner edge — a fang catches light on one side only
    pl(g,mx-nx*0.7,my-ny*0.7,tipx-nx*0.1,tipy-ny*0.1,"rgba(206,222,248,"+(offl?0.12:0.4)+")",1.2);
    // socket knuckle where it hinges into the jaw
    // hinge knuckle, lit — a black dot here just reads as a hole
    var kg=g.createRadialGradient(mx-0.6,my-1.6,0.3,mx,my-0.6,w0*0.6);
    kg.addColorStop(0,offl?"#232b36":"#3d4757");kg.addColorStop(1,"#070b11");
    g.fillStyle=kg;g.beginPath();g.arc(mx,my-0.6,w0*0.52,0,7);g.fill();}
  /* ---- 4 · FRONT WHIPS: one curling high past the skull, one strike
     whip hovering its grapple over the deck. Offline both lie dead. ---- */
  if(!offl){
    // one thrown up past the skull, one reaching forward-down at the viewer
    var FP1=[[cx-26+HX,RT-8],[cx-136,RT-70],[cx-186,240],[cx-140,150+sw*6]];
    var p1=whip(FP1,7.5,3,40), e1=p1[p1.length-1], q1=p1[p1.length-2];
    grapple(e1[0],e1[1],Math.atan2(e1[1]-q1[1],e1[0]-q1[0]),0.75,true);
    var FP2=[[cx+26+HX,RT-6],[cx+128,RT+60],[cx+196,RT+130],[cx+150,RT+196+sw2*6]];
    var p2=whip(FP2,7.5,3.2,38), e2=p2[p2.length-1], q2=p2[p2.length-2];
    grapple(e2[0],e2[1],Math.atan2(e2[1]-q2[1],e2[0]-q2[0]),0.9,true);
  }else{
    var FP1=[[cx-26,RT-8],[cx-96,528],[cx-146,556],[cx-198,546]];
    var p1=whip(FP1,7.5,3,36), e1=p1[p1.length-1], q1=p1[p1.length-2];
    grapple(e1[0],e1[1],Math.atan2(e1[1]-q1[1],e1[0]-q1[0]),0,true);
    var FP2=[[cx+26,RT-6],[cx+104,534],[cx+156,559],[cx+206,548]];
    var p2=whip(FP2,7.5,3.2,36), e2=p2[p2.length-1], q2=p2[p2.length-2];
    grapple(e2[0],e2[1],Math.atan2(e2[1]-q2[1],e2[0]-q2[0]),0,true);
  }

  /* ---- 5 · offline: beacon rakes the crown lobes ---- */
  if(offl){var bp=0.55;
    // the beacon catches EDGES: the lobe's top arris and the brow lip, the
    // two lines that actually face a light standing off to the left
    pl(g,HC.x-96,HC.y-82,HC.x-54,HC.y-102,"rgba(255,64,52,"+(0.3*bp)+")",2);
    pl(g,HC.x-116,HC.y-2,HC.x-60,HC.y-8,"rgba(255,64,52,"+(0.18*bp)+")",1.6);
    RE.strokeStyle="rgba(255,64,52,"+(0.13*bp)+")";RE.lineWidth=2.4;
    RE.beginPath();RE.moveTo(HC.x-96,HC.y-82);RE.lineTo(HC.x-54,HC.y-102);RE.stroke();}

  /* ---- room light lands on the unit ---- */
  RB.save();RB.globalCompositeOperation="source-atop";
  var key=RB.createLinearGradient(0,140,0,GY);
  key.addColorStop(0,"rgba(206,226,255,"+(offl?0.05:0.12)+")");
  key.addColorStop(0.3,"rgba(186,206,238,"+(offl?0.02:0.045)+")");
  key.addColorStop(0.68,"rgba(2,6,14,0.10)");
  key.addColorStop(1,"rgba(2,6,14,0.22)");
  RB.fillStyle=key;RB.fillRect(0,0,W,H);
  var bnc=RB.createLinearGradient(0,GY-130,0,GY-8);
  bnc.addColorStop(0,"rgba(104,146,196,0)");bnc.addColorStop(1,"rgba(104,146,196,"+(offl?0.04:0.1)+")");
  RB.fillStyle=bnc;RB.fillRect(0,0,W,H);RB.restore();

  /* ---- rim light: red key, cyan fill ---- */
  RR.globalCompositeOperation="source-over";RR.drawImage(body,0,0);
  RR.globalCompositeOperation="destination-out";RR.drawImage(body,-2.2,1.7);RR.drawImage(body,-1.5,-2.4);
  RR.globalCompositeOperation="source-in";
  var rl=RR.createLinearGradient(60,0,460,0);
  rl.addColorStop(0,"rgba(255,45,34,0.95)");rl.addColorStop(0.42,"rgba(198,140,150,0.42)");rl.addColorStop(1,"rgba(95,214,255,1)");
  RR.fillStyle=rl;RR.fillRect(0,0,W,H);RR.globalCompositeOperation="source-over";
}

/* ---- scene ---- */
function drawScene(t,st){
  var offl=st==="offline";
  var wall=S.createLinearGradient(0,0,0,H);
  wall.addColorStop(0,offl?"#07090d":"#0b0e14");wall.addColorStop(0.75,offl?"#05070a":"#090c12");wall.addColorStop(1,"#05070b");
  S.fillStyle=wall;S.fillRect(0,0,W,H);
  if(!offl){var cone=S.createLinearGradient(0,40,0,560);
    cone.addColorStop(0,"rgba(255,214,150,0.07)");cone.addColorStop(1,"rgba(255,214,150,0)");
    S.fillStyle=cone;S.beginPath();S.moveTo(225,40);S.lineTo(295,40);S.lineTo(410,560);S.lineTo(110,560);S.closePath();S.fill();
    var rg=S.createRadialGradient(260,290,20,260,290,240);
    rg.addColorStop(0,"rgba(255,45,34,0.06)");rg.addColorStop(1,"rgba(255,45,34,0)");
    S.fillStyle=rg;S.fillRect(0,0,W,H);}
  else{var bc=S.createRadialGradient(90,120,4,90,120,150);
    bc.addColorStop(0,"rgba(255,60,50,0.12)");bc.addColorStop(1,"rgba(255,60,50,0)");
    S.fillStyle=bc;S.fillRect(0,0,W,H);}
  S.fillStyle=offl?"#07090c":"#0d1118";S.fillRect(0,560,W,H-560);
  pl(S,0,560,W,560,"rgba(120,140,170,0.14)",1);
  /* Alive: ONE soft shadow pooled far below a body that touches nothing —
     small, diffuse and offset by the drift, which is the whole tell that a
     thing is airborne. Dead: hard contact patches where it fell. */
  if(offl){
    [-238,-166,-100,-58,-52,58,70,112,176,242].forEach(function(dx){
      var sh=S.createRadialGradient(260+dx,560,1,260+dx,560,30);
      sh.addColorStop(0,"rgba(0,0,0,0.5)");sh.addColorStop(0.6,"rgba(0,0,0,0.22)");sh.addColorStop(1,"rgba(0,0,0,0)");
      S.fillStyle=sh;S.beginPath();S.ellipse(260+dx,560,30,8,0,0,7);S.fill();});
    var sh2=S.createRadialGradient(260,558,8,260,558,180);
    sh2.addColorStop(0,"rgba(0,0,0,0.45)");sh2.addColorStop(1,"rgba(0,0,0,0)");
    S.fillStyle=sh2;S.beginPath();S.ellipse(260,558,180,18,0,0,7);S.fill();
  }else{
    var dr=Math.sin(t*0.53)*4;
    var sh3=S.createRadialGradient(260+dr,562,10,260+dr,562,120);
    sh3.addColorStop(0,"rgba(0,0,0,0.34)");sh3.addColorStop(0.55,"rgba(0,0,0,0.14)");sh3.addColorStop(1,"rgba(0,0,0,0)");
    S.fillStyle=sh3;S.beginPath();S.ellipse(260+dr,562,120,13,0,0,7);S.fill();
    S.save();S.globalCompositeOperation="lighter";
    var tp=S.createRadialGradient(260+dr,558,4,260+dr,558,150);
    tp.addColorStop(0,"rgba(255,45,34,0.07)");tp.addColorStop(1,"rgba(255,45,34,0)");
    S.fillStyle=tp;S.beginPath();S.ellipse(260+dr,558,150,16,0,0,7);S.fill();S.restore();}
  S.drawImage(body,0,0);
  S.drawImage(rim,0,0);
  S.save();S.globalCompositeOperation="lighter";S.drawImage(emis,0,0);S.restore();
}

function frame(){
  var t=reduced?T0:(performance.now()/1000);
  drawUnit(t,STATE);drawScene(t,STATE);
  if(!reduced)requestAnimationFrame(frame);
}
frame();
</script>

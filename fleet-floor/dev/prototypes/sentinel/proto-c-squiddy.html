<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SQUIDDY — sentinel prototype C</title>
<style>
  html,body{margin:0;background:#04060a;height:100%;font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{display:flex;flex-direction:column;align-items:center;padding:18px 0}
  canvas{display:block;background:#000;border-radius:6px;max-width:94vw;height:auto}
  #bar{margin-top:12px;display:flex;gap:8px}
  #bar button{font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:7px 14px;background:#0a0f16;border:1px solid #1c2733;border-radius:7px;color:#7d8ba0;cursor:pointer}
  #bar button.on{color:#ff8a7a;border-color:#5c2a24;background:#1c0f0d}
  #cap{margin-top:10px;font-size:11px;color:#55657a;letter-spacing:.06em}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="520" height="640"></canvas>
  <div id="bar">
    <button data-st="working">working</button>
    <button data-st="idle">idle</button>
    <button data-st="offline">offline</button>
  </div>
  <div id="cap">SQUIDDY (SN-100) — bilobed skull, the machine-mother stare · it never touches the deck</div>
</div>
<script>
/* ============================================================================
   SENTINEL PROTO C — "SQUIDDY" (SN-100)                            crew#128

   Drawn against the actual Matrix sentinel reference, then taken through
   ten render loops. What the reference actually is:

     · the silhouette comes from danmt's blue overlay on PR #230, traced
       out of the screenshot pixel by pixel and mapped back into canvas
       space through the eye cluster (TARGET, kept for reference; render
       with ?outline=1). But the trace is the INTENT, not the geometry —
       a freehand line is asymmetric, and shipping that wobble literally
       was its own mistake. So the head is a symmetric HALF-profile,
       mirrored, pulled wider and flatter than the trace with the saddle
       dip cut to about a third: WIDE AND SQUAT, ~202 x 124.
     · the head stays at 1:1. It is the small end of this unit — the
       WHIPS are the mass and are meant to own the frame.
     · nothing under the chin may read as a mouth. Tapered spikes along a
       jaw line are teeth, and lit edges on them are a grin; what hangs
       there is a cluster of short matte manipulator stubs at mixed
       depths, no highlight on any of them.
     · the eyes are glossy red BERRIES in chrome sockets, fifteen of
       them, different sizes, packed across a deep recessed face bowl,
       each with its own specular glint, shimmer clock and socket
       polish. One is dead and cracked. Not a neat ring: a stare.
     · a fringe of tapered MANDIBLE FANGS under the jaw, curling inward,
       each twitching on its own clock
     · a dozen long thin ribbed WHIPS — segmented conduit with a lit
       crown and a shadowed belly, S-curving in every direction, tipped
       with three-prong grapple claws
   It FLIES: alive it hovers with nothing touching the deck, drifting a
   slow figure-of-eight, one whip thrown high and one reaching forward.
   Dead it is on the floor — the hull drops, every whip crumples at its
   own height, and fifteen dead lenses keep their glints.
   ========================================================================== */
var cv=document.getElementById("cv"), S=cv.getContext("2d");
var W=520,H=640;
var body=document.createElement("canvas"),emis=document.createElement("canvas"),rim=document.createElement("canvas");
[body,emis,rim].forEach(function(c){c.width=W;c.height=H;});
var RB=body.getContext("2d"),RE=emis.getContext("2d"),RR=rim.getContext("2d");

function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else{c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}}
function poly(c,pts){c.beginPath();for(var i=0;i<pts.length;i++){if(i)c.lineTo(pts[i][0],pts[i][1]);else c.moveTo(pts[i][0],pts[i][1]);}c.closePath();}
function plate(c,pts,top,bot,ed){var y0=1e9,y1=-1e9;for(var i=0;i<pts.length;i++){if(pts[i][1]<y0)y0=pts[i][1];if(pts[i][1]>y1)y1=pts[i][1];}var gg=c.createLinearGradient(0,y0,0,y1);gg.addColorStop(0,top);gg.addColorStop(1,bot);poly(c,pts);c.fillStyle=gg;c.fill();if(ed){c.strokeStyle=ed;c.lineWidth=1.2;c.lineJoin="round";c.stroke();}}
function pl(c,x0,y0,x1,y1,col,w){c.strokeStyle=col;c.lineWidth=w||1;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}
function cavity(c,x,y,w,h,a){var gg=c.createLinearGradient(0,y,0,y+h);gg.addColorStop(0,"rgba(2,5,9,"+a+")");gg.addColorStop(1,"rgba(2,5,9,0)");c.fillStyle=gg;c.fillRect(x,y,w,h);}
function Rnd(i){var x=Math.sin(i*127.1+13.7)*43758.5453;return x-Math.floor(x);}
function cub(P,u){var v=1-u;
  return [v*v*v*P[0][0]+3*v*v*u*P[1][0]+3*v*u*u*P[2][0]+u*u*u*P[3][0],
          v*v*v*P[0][1]+3*v*v*u*P[1][1]+3*v*u*u*P[2][1]+u*u*u*P[3][1]];}

var qs=new URLSearchParams(location.search);
var STATE=qs.get("state")||"working";
var reduced=qs.get("t")!==null;
var T0=qs.get("t")===null?0:Number(qs.get("t"));

document.querySelectorAll("#bar button").forEach(function(b){
  if(b.dataset.st===STATE)b.classList.add("on");
  b.onclick=function(){location.search="?state="+b.dataset.st;};
});

function drawUnit(t,st){
  var offl=st==="offline", work=st==="working";
  [RB,RE,RR].forEach(function(c){c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);c.globalAlpha=1;c.globalCompositeOperation="source-over";});
  var g=RB, cx=260, GY=560;
  var sT="#2a3242",sM="#161c28",sB="#090d14",ed="#323c50",eH="#47556a";
  if(offl){sT="#1b202a";sM="#0e121a";sB="#05080e";ed="#222936";eH="#2a3241";}
  var RD=offl?[70,66,72]:[255,45,34], RDH=offl?[110,104,108]:[255,148,130];
  function rd(a){return "rgba("+RD[0]+","+RD[1]+","+RD[2]+","+a+")";}
  function rdh(a){return "rgba("+RDH[0]+","+RDH[1]+","+RDH[2]+","+a+")";}
  var pulse=offl?0:(work?(0.66+0.2*Math.sin(t*5.5)):(0.4+0.12*Math.sin(t*1.7)));
  /* It FLIES. Alive it hovers, nothing touching the deck — the drift is a
     slow figure-of-eight, not a bob, because a hovering thing holds station
     against something. Dead it is on the floor: the hull drops the whole
     way down and the whips crumple under it. That is the state language. */
  var hov=offl?0:Math.sin(t*0.9)*5+Math.sin(t*0.37)*3;
  var hovX=offl?0:Math.sin(t*0.53)*4;
  var DY=offl?152:hov;   // dead: the hub is the lowest part, so it sets the rest height
  var HC={x:cx+hovX,y:250+DY};            // skull centre

  /* ---- helpers: ribbed whip + grapple claw + coil stack ---- */
  var segA="#1b222d", segB="#11161f", segAo="#141922", segBo="#0c1017";
  /* A fat conduit cannot be drawn as a row of ellipses — at this gauge the
     ellipses stop overlapping cleanly and the limb comes out scalloped, like
     a feather. It is built as a real tube instead: one tapered body polygon
     down both offsets of the spine, then shading across it (lit crown, dark
     belly) and ribs drawn as short cross-strokes. */
  function whip(P,r0,r1,N){
    var pts=[],i2;for(i2=0;i2<=N;i2++)pts.push(cub(P,i2/N));
    var rad=function(u){return r0+(r1-r0)*u;};
    var nrm=[];
    for(i2=0;i2<=N;i2++){
      var pa=pts[Math.max(0,i2-1)],pb=pts[Math.min(N,i2+1)];
      var dx=pb[0]-pa[0],dy=pb[1]-pa[1],ln=Math.hypot(dx,dy)||1;
      nrm.push([-dy/ln,dx/ln]);
    }
    // body
    g.beginPath();
    for(i2=0;i2<=N;i2++){var r=rad(i2/N),q=pts[i2],n2=nrm[i2];
      var x=q[0]+n2[0]*r,y=q[1]+n2[1]*r;i2?g.lineTo(x,y):g.moveTo(x,y);}
    for(i2=N;i2>=0;i2--){var r2=rad(i2/N),q2=pts[i2],n3=nrm[i2];
      g.lineTo(q2[0]-n3[0]*r2,q2[1]-n3[1]*r2);}
    g.closePath();
    var tg=g.createLinearGradient(0,0,0,1);   // replaced per-segment below
    g.fillStyle=offl?"#141922":"#1c232e";g.fill();
    g.strokeStyle=offl?"rgba(30,36,46,0.8)":"rgba(46,56,72,0.85)";g.lineWidth=1;g.stroke();
    // lit crown along one offset, hard shadow along the belly
    g.save();g.clip();
    for(i2=0;i2<N;i2++){
      var u=i2/N,r3=rad(u),q3=pts[i2],n4=nrm[i2],q4=pts[i2+1];
      g.strokeStyle="rgba(2,5,10,0.5)";g.lineWidth=r3*0.85;
      g.beginPath();g.moveTo(q3[0]-n4[0]*r3*0.55,q3[1]-n4[1]*r3*0.55);
      g.lineTo(q4[0]-n4[0]*r3*0.55,q4[1]-n4[1]*r3*0.55);g.stroke();
      g.strokeStyle="rgba(158,174,202,"+(offl?0.07:0.17)+")";g.lineWidth=r3*0.34;
      g.beginPath();g.moveTo(q3[0]+n4[0]*r3*0.5,q3[1]+n4[1]*r3*0.5);
      g.lineTo(q4[0]+n4[0]*r3*0.5,q4[1]+n4[1]*r3*0.5);g.stroke();
    }
    // ribs: cross-strokes every other step, so it reads as segmented armour
    for(i2=1;i2<N;i2+=2){
      var r5=rad(i2/N),q5=pts[i2],n5=nrm[i2];
      g.strokeStyle="rgba(3,7,13,0.55)";g.lineWidth=1.8;
      g.beginPath();g.moveTo(q5[0]+n5[0]*r5,q5[1]+n5[1]*r5);
      g.lineTo(q5[0]-n5[0]*r5,q5[1]-n5[1]*r5);g.stroke();
      g.strokeStyle="rgba(170,186,214,"+(offl?0.05:0.12)+")";g.lineWidth=0.9;
      g.beginPath();g.moveTo(q5[0]+n5[0]*r5*0.92,q5[1]+n5[1]*r5*0.92);
      g.lineTo(q5[0]-n5[0]*r5*0.2,q5[1]-n5[1]*r5*0.2);g.stroke();
    }
    g.restore();
    return pts;
  }
  function grapple(x,y,ang,open,alive){
    [-1,0,1].forEach(function(k){
      var a2=ang+k*(0.34+open*0.5);
      var tx=x+Math.cos(a2)*21, ty=y+Math.sin(a2)*21;
      var hx=tx+Math.cos(a2+ (k>=0?1.7:-1.7))*6.4, hy=ty+Math.sin(a2+(k>=0?1.7:-1.7))*6.4;
      g.strokeStyle="#05080e";g.lineWidth=6;g.lineCap="round";
      g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(tx,ty,hx,hy);g.stroke();
      g.strokeStyle=offl?"#3a4350":"#8b98ac";g.lineWidth=2.3;
      g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(tx,ty,hx,hy);g.stroke();});
    g.fillStyle="#04070c";g.beginPath();g.arc(x,y,7,0,7);g.fill();
    g.strokeStyle=eH;g.lineWidth=1.2;g.beginPath();g.arc(x,y,7,0,7);g.stroke();
    if(alive&&!offl){g.fillStyle=rdh(0.9);g.beginPath();g.arc(x,y,2.4,0,7);g.fill();
      RE.fillStyle=rd(0.5);RE.beginPath();RE.arc(x,y,4.2,0,7);RE.fill();}
  }
  var sw=offl?0:Math.sin(t*0.9), sw2=offl?0:Math.cos(t*0.7);

  /* ---- 0 · BACK WHIPS: flared around the skull, S-curving, never straight.
     Offline they fall and lie where they land. ---- */
  var HS=window.__HS__=1.0;                  // 1:1 — the whips own the frame, not the skull
  var HX=hovX, RT=HC.y+148*HS;      // the socket row — limbs start where they plug in                          // whip root, under the skull
  var BACK=offl?[
    [[cx-40,RT-16],[cx-138,500],[cx-206,538],[cx-236,558]],
    [[cx+40,RT-16],[cx+126,516],[cx+196,530],[cx+244,557]],
    [[cx-29,RT-14],[cx-168,530],[cx-104,560],[cx-172,552]],
    [[cx+29,RT-14],[cx+186,522],[cx+142,559],[cx+182,545]],
    [[cx-17,RT-12],[cx-58,548],[cx-14,560],[cx-70,556]],
    [[cx+17,RT-12],[cx+80,536],[cx+38,559],[cx+96,553]]
  ]:[
    // the two thrown high swing WIDE of the head before they climb, so the
    // face is never crossed by its own limbs
    [[cx-40+HX,RT-16],[cx-198,RT+40+sw*6],[cx-232,158],[cx-214,86+sw*5]],
    [[cx+40+HX,RT-16],[cx+204,RT+44-sw*6],[cx+238,168],[cx+224,100-sw*5]],
    [[cx-29+HX,RT-14],[cx-218,RT+94+sw2*5],[cx-252,412],[cx-256,330+sw2*7]],
    [[cx+29+HX,RT-14],[cx+226,RT+98-sw2*5],[cx+258,420],[cx+262,342-sw2*7]],
    [[cx-17+HX,RT-12],[cx-138,RT+80],[cx-104,472],[cx-166,512+sw*6]],
    [[cx+17+HX,RT-12],[cx+112,RT+104],[cx+172,476],[cx+126,520-sw*6]]
  ];
  /* These eight are BACK limbs: they run out from behind the hull and the
     hub covers where they meet it, so they need no visible attachment —
     the same division codex uses for its rear legs. Roots are pulled up
     into the drum's footprint so no stub is left showing beside it. */
  BACK.forEach(function(P,bi){
    var pts=whip(P,12,4.2,52);
    var e=pts[pts.length-1],pe=pts[pts.length-2];
    grapple(e[0],e[1],Math.atan2(e[1]-pe[1],e[0]-pe[0]),offl?0:0.5+0.3*Math.sin(t*2+bi),true);
  });

  /* ---- THE ROOT HUB ----
     Four stacked ellipses were standing in for the single most mechanically
     interesting part of the unit: the place a dozen limbs actually attach.
     It is now a real assembly — an armoured collar under the chin, a ribbed
     drum below it, and a socket for every whip, each with its own rim and
     its own shadow, so the limbs read as PLUGGED IN rather than as lines
     that happen to converge. */
  (function(){
    var HY=HC.y+96*HS, k=HS;
    function P(x,y){return [HC.x+x*k, HY+y*k];}
    // 1 · collar: a faceted ring plate the drum hangs from
    var col=[P(-62,0),P(62,0),P(53,20),P(-53,20)];
    plate(g,col,sT,sM,ed);
    pl(g,P(-60,2)[0],P(-60,2)[1],P(60,2)[0],P(60,2)[1],"rgba(198,216,246,"+(offl?0.07:0.2)+")",1.4);
    cavity(g,P(-53,18)[0],P(-53,18)[1],106*k,8*k,0.55);
    // 2 · drum: ribbed barrel, lit crown, dark underside
    var dr=[P(-55,18),P(55,18),P(48,52),P(-48,52)];
    plate(g,dr,sM,sB,ed);
    for(var rb2=-4;rb2<=4;rb2++){                      // vertical ribs
      var rx2=rb2*12;
      pl(g,P(rx2,20)[0],P(rx2,20)[1],P(rx2*0.88,50)[0],P(rx2*0.88,50)[1],"rgba(4,8,14,0.55)",2.2);
      pl(g,P(rx2+2,20)[0],P(rx2+2,20)[1],P(rx2*0.88+2,50)[0],P(rx2*0.88+2,50)[1],
         "rgba(150,166,194,"+(offl?0.04:0.11)+")",0.9);}
    cavity(g,P(-48,46)[0],P(-48,46)[1],96*k,10*k,0.6);
    // outboard mount ears: the outer pair of limbs needs something to bolt
    // ONTO, otherwise the assembly floats beside the drum
    [-1,1].forEach(function(sg6){
      plate(g,[[P(sg6*46,22)[0],P(sg6*46,22)[1]],[P(sg6*64,26)[0],P(sg6*64,26)[1]],
               [P(sg6*62,44)[0],P(sg6*62,44)[1]],[P(sg6*44,42)[0],P(sg6*44,42)[1]]],sT,sB,ed);
      pl(g,P(sg6*47,24)[0],P(sg6*47,24)[1],P(sg6*63,28)[0],P(sg6*63,28)[1],
         "rgba(198,216,246,"+(offl?0.06:0.18)+")",1.2);});
    // 3 · the core: a caged vent in the middle of the drum, lit from inside
    var cw=26*k, chh=15*k, cxp=P(0,28)[0]-cw/2, cyp=P(0,28)[1];
    g.fillStyle="#04070c";rr(g,cxp,cyp,cw,chh,3);g.fill();
    g.strokeStyle=eH;g.lineWidth=1.1;rr(g,cxp,cyp,cw,chh,3);g.stroke();
    if(!offl){
      var cg5=g.createLinearGradient(cxp,cyp,cxp,cyp+chh);
      cg5.addColorStop(0,rdh(0.5*pulse+0.2));cg5.addColorStop(1,rd(0.28*pulse+0.1));
      g.save();rr(g,cxp+1,cyp+1,cw-2,chh-2,2);g.clip();g.fillStyle=cg5;
      g.fillRect(cxp,cyp,cw,chh);g.restore();
      RE.save();rr(RE,cxp,cyp,cw,chh,3);RE.clip();
      var ce=RE.createRadialGradient(cxp+cw/2,cyp+chh/2,1,cxp+cw/2,cyp+chh/2,cw*0.7);
      ce.addColorStop(0,rdh(0.55*pulse+0.2));ce.addColorStop(1,rd(0));
      RE.fillStyle=ce;RE.fillRect(cxp-6,cyp-6,cw+12,chh+12);RE.restore();
    }else{g.fillStyle="rgba(150,168,190,0.22)";g.fillRect(cxp+3,cyp+chh/2-0.7,cw-6,1.4);}
    for(var cb=0;cb<3;cb++){                            // cage bars over the vent
      var bxp=cxp+cw*(cb+1)/4;
      g.fillStyle="#0b1018";g.fillRect(bxp-1.6,cyp-1,3.2,chh+2);}
    // 4 · SOCKETS: one per limb, along the drum's lower edge
    var SOCK=[[-38,52,7.5],[-27,55,8],[-16,57,8],[-5,58,8.5],[5,58,8.5],
              [16,57,8],[27,55,8],[38,52,7.5],[-11,44,5],[11,44,5]];
    SOCK.forEach(function(S2,si){
      var sp=P(S2[0],S2[1]), sr=S2[2]*k;
      g.fillStyle="#04070c";g.beginPath();g.ellipse(sp[0],sp[1],sr,sr*0.78,0,0,7);g.fill();
      // rim: bright on top, so each socket reads as a hole with a lip
      g.strokeStyle=offl?"rgba(58,66,80,0.8)":"rgba(112,126,150,0.9)";g.lineWidth=1.4;
      g.beginPath();g.ellipse(sp[0],sp[1],sr,sr*0.78,0,0,7);g.stroke();
      g.strokeStyle="rgba(206,222,248,"+(offl?0.08:0.22)+")";g.lineWidth=1;
      g.beginPath();g.ellipse(sp[0],sp[1],sr*0.98,sr*0.76,0,Math.PI*1.08,Math.PI*1.92);g.stroke();
      if(!offl&&si<8){ RE.fillStyle=rd(0.16);RE.beginPath();
        RE.ellipse(sp[0],sp[1],sr*0.5,sr*0.4,0,0,7);RE.fill(); }
    });
    // 5 · bolts round the collar, and two hoses slung across the drum
    [-52,-26,0,26,52].forEach(function(bx2){
      var bp2=P(bx2,10);
      g.fillStyle="#05080e";g.beginPath();g.arc(bp2[0],bp2[1],2*k,0,7);g.fill();
      g.fillStyle="rgba(190,204,228,"+(offl?0.07:0.2)+")";
      g.beginPath();g.arc(bp2[0]-0.6*k,bp2[1]-0.6*k,0.9*k,0,7);g.fill();});
    [[-53,24,-20,40],[53,24,20,40]].forEach(function(h2){
      var s1=P(h2[0],h2[1]),e1=P(h2[2],h2[3]);
      g.strokeStyle="rgba(8,12,19,0.95)";g.lineWidth=4*k;
      g.beginPath();g.moveTo(s1[0],s1[1]);g.quadraticCurveTo((s1[0]+e1[0])/2,e1[1]+10*k,e1[0],e1[1]);g.stroke();
      g.strokeStyle="rgba(120,132,156,"+(offl?0.08:0.22)+")";g.lineWidth=1.2;
      g.beginPath();g.moveTo(s1[0],s1[1]);g.quadraticCurveTo((s1[0]+e1[0])/2,e1[1]+10*k,e1[0],e1[1]);g.stroke();});
  })();

  /* the whole head — silhouette, plating, greebles, eyes, fangs — is drawn
     at 1:1 and scaled about HC as one unit, so nothing can drift off the
     traced outline when the size changes */
  [g,RE].forEach(function(c){c.save();c.translate(HC.x,HC.y);c.scale(HS,HS);c.translate(-HC.x,-HC.y);});
  /* ---- 2 · THE SKULL POD: the operator's own outline ---- */
  /* TARGET is danmt's blue overlay from PR #230, traced out of the
     screenshot pixel by pixel and mapped back into canvas space through the
     eye cluster (whose coordinates in that revision are known exactly). It
     is the authority on this silhouette — everything outside it is gone.

     What it says, and what every previous revision got wrong: the head is
     WIDE AND SQUAT, roughly 172 x 148, not a tall dome. The crown I kept
     rebuilding sits entirely outside the line. The top carries two low
     humps with a shallow saddle between them; the flanks fall away fast;
     the underside is a rounded chin that hangs lowest at the centre line
     and lifts at the jaw corners. Render with ?outline=1 to draw the
     target over the unit and check the fit. */
  /* The hand-drawn line is the INTENT, not the geometry: it is asymmetric
     because it was drawn freehand, and tracing it literally shipped that
     wobble as if it were design. So the outline is rebuilt as a symmetric
     half-profile — mirrored, so left and right cannot disagree — pulled
     wider and flatter than the trace, with the saddle dip cut to about a
     third of what the trace showed. Same shape language, drawn properly.

     HALF[i] = [dx, top y, bottom y], from the centre line out to the widest
     point where the two edges meet. */
  var HALF=[[0,-24,98],[14,-36,95],[30,-38,89],[46,-38.5,83],[60,-37,78],
            [74,-33,75],[88,-24,66],[98,-10,46],[104,16,16]];
  /* Squared, not domed. Two round bumps over a notch is a butt at any size,
     so the crown is built like a machined casting instead: a narrow steep

  /* ---- 4 · FRONT LIMBS, and the only joints that have to be believed ----
     Eight limbs run from behind the hull and the hub hides where they meet
     it. These four are in FRONT of it, so their attachment is on show and
     has to be a mechanism: a bolted mount plate on the hub face, a dark
     socket cup, a ball with a lit crescent, a clamp collar round the limb's
     first segment, a stub ram, and a feed line off the drum. Same division
     codex uses — front legs mounted in the open, rear legs' joints hidden. */
  function whipMount(x,y,ang,k2){
    var co=Math.cos(ang),si=Math.sin(ang), nx6=-si, ny6=co;
    g.save();
    // bolted mount plate, sitting flat on the hub's face
    plate(g,[[x-nx6*13*k2-co*5*k2,y-ny6*13*k2-si*5*k2],
             [x+nx6*13*k2-co*5*k2,y+ny6*13*k2-si*5*k2],
             [x+nx6*10*k2+co*9*k2,y+ny6*10*k2+si*9*k2],
             [x-nx6*10*k2+co*9*k2,y-ny6*10*k2+si*9*k2]],sT,sM,ed);
    [[-9,-1],[9,-1]].forEach(function(bp3){
      var bx3=x+nx6*bp3[0]*k2+co*bp3[1]*k2, by3=y+ny6*bp3[0]*k2+si*bp3[1]*k2;
      g.fillStyle="#05080e";g.beginPath();g.arc(bx3,by3,2*k2,0,7);g.fill();
      g.fillStyle="rgba(190,204,228,"+(offl?0.07:0.2)+")";
      g.beginPath();g.arc(bx3-0.6*k2,by3-0.6*k2,0.9*k2,0,7);g.fill();});
    // socket cup: dark, and wider than the ball so the ball sits INSIDE it
    g.fillStyle="#04070c";g.beginPath();g.arc(x+co*7*k2,y+si*7*k2,10.5*k2,0,7);g.fill();
    g.strokeStyle=ed;g.lineWidth=1.3;g.beginPath();g.arc(x+co*7*k2,y+si*7*k2,10.5*k2,0,7);g.stroke();
    // the ball, lit on the lamp side — the one shape that says "this rotates"
    var bg6=g.createRadialGradient(x+co*7*k2-3*k2,y+si*7*k2-3.4*k2,0.6,x+co*7*k2,y+si*7*k2,8.4*k2);
    bg6.addColorStop(0,"rgba(168,188,220,"+(offl?0.2:0.5)+")");
    bg6.addColorStop(0.55,"rgba(52,64,82,0.7)");bg6.addColorStop(1,"rgba(3,7,12,0.9)");
    g.fillStyle=bg6;g.beginPath();g.arc(x+co*7*k2,y+si*7*k2,8.4*k2,0,7);g.fill();
    g.strokeStyle="rgba(206,222,248,"+(offl?0.1:0.3)+")";g.lineWidth=1.2;
    g.beginPath();g.arc(x+co*7*k2,y+si*7*k2,8.4*k2,ang-2.5,ang-0.7);g.stroke();
    // clamp collar biting the limb just past the ball
    var clx=x+co*19*k2, cly=y+si*19*k2;
    plate(g,[[clx-nx6*12*k2-co*4*k2,cly-ny6*12*k2-si*4*k2],
             [clx+nx6*12*k2-co*4*k2,cly+ny6*12*k2-si*4*k2],
             [clx+nx6*11*k2+co*5*k2,cly+ny6*11*k2+si*5*k2],
             [clx-nx6*11*k2+co*5*k2,cly-ny6*11*k2+si*5*k2]],sM,sB,ed);
    pl(g,clx-nx6*11*k2-co*3*k2,cly-ny6*11*k2-si*3*k2,clx+nx6*11*k2-co*3*k2,cly+ny6*11*k2-si*3*k2,
       "rgba(206,222,248,"+(offl?0.08:0.24)+")",1.1);
    // stub ram from the mount plate to the collar: sleeve then polished rod
    var r0x=x-nx6*11*k2, r0y=y-ny6*11*k2, r1x=clx-nx6*9*k2, r1y=cly-ny6*9*k2;
    var mx7=r0x+(r1x-r0x)*0.55, my7=r0y+(r1y-r0y)*0.55;
    pl(g,r0x,r0y,mx7,my7,"#0a0f18",4.4*k2);
    pl(g,mx7,my7,r1x,r1y,offl?"#333c48":"#93a7c2",2*k2);
    g.fillStyle=sT;g.beginPath();g.arc(r0x,r0y,2.6*k2,0,7);g.fill();
    // feed line off the drum into the collar
    g.strokeStyle="rgba(8,12,19,0.95)";g.lineWidth=3.4*k2;
    g.beginPath();g.moveTo(x+nx6*12*k2,y+ny6*12*k2);
    g.quadraticCurveTo(x+nx6*20*k2+co*10*k2,y+ny6*20*k2+si*10*k2,clx+nx6*9*k2,cly+ny6*9*k2);g.stroke();
    g.strokeStyle="rgba(120,132,156,"+(offl?0.08:0.22)+")";g.lineWidth=1*k2;
    g.beginPath();g.moveTo(x+nx6*12*k2,y+ny6*12*k2);
    g.quadraticCurveTo(x+nx6*20*k2+co*10*k2,y+ny6*20*k2+si*10*k2,clx+nx6*9*k2,cly+ny6*9*k2);g.stroke();
    // a thin status pip on the mount plate — not on the ball, which is a
    // bearing; a glowing ball just reads as another eye
    if(!offl){var pipx=x+nx6*9*k2+co*6*k2, pipy=y+ny6*9*k2+si*6*k2;
      g.fillStyle=rdh(0.75);g.beginPath();g.arc(pipx,pipy,1.5*k2,0,7);g.fill();
      RE.fillStyle=rd(0.3);RE.beginPath();RE.arc(pipx,pipy,2.6*k2,0,7);RE.fill();}
    g.restore();
  }
  var FRONT=offl?[
    [[cx-56,RT-30],[cx-96,528],[cx-146,556],[cx-198,546]],
    [[cx+56,RT-30],[cx+104,534],[cx+156,559],[cx+206,548]],
    [[cx-30,RT-22],[cx-52,542],[cx-104,556],[cx-134,548]],
    [[cx+30,RT-22],[cx+58,546],[cx+112,558],[cx+136,550]]
  ]:[
    [[cx-56+HX,RT-30],[cx-150,RT+10],[cx-190,236],[cx-146,158+sw*6]],
    [[cx+56+HX,RT-30],[cx+128,RT+60],[cx+196,RT+130],[cx+150,RT+196+sw2*6]],
    [[cx-30+HX,RT-22],[cx-76,RT+60],[cx-16,RT+134],[cx-64,RT+182+sw*5]],
    [[cx+30+HX,RT-22],[cx+54,RT+92],[cx+96,RT+136],[cx+40,RT+214-sw*5]]
  ];
  FRONT.forEach(function(P,fi){
    var pts=whip(P,13,4.5,46);
    var e=pts[pts.length-1],pe=pts[pts.length-2];
    grapple(e[0],e[1],Math.atan2(e[1]-pe[1],e[0]-pe[0]),offl?0:0.7+0.25*Math.sin(t*2+fi),true);
    // the mount goes on LAST, over the limb's own root, so it clamps it
    var q0=pts[0],q1=pts[2];
    whipMount(q0[0],q0[1],Math.atan2(q1[1]-q0[1],q1[0]-q0[0]),HS*(fi<2?0.94:0.8));
  });

  /* ---- 5 · offline: beacon rakes the crown lobes ---- */
  if(offl){var bp=0.55;
    // the beacon catches EDGES: the lobe's top arris and the brow lip, the
    // two lines that actually face a light standing off to the left
    // drawn outside the head transform, so the crest coords carry HS themselves
    var kx=function(v){return HC.x+v*HS;}, ky=function(v){return HC.y+v*HS;};
    pl(g,kx(-72),ky(-16),kx(-34),ky(-33),"rgba(255,64,52,"+(0.3*bp)+")",2);
    pl(g,kx(-84),ky(18),kx(-44),ky(6),"rgba(255,64,52,"+(0.17*bp)+")",1.6);
    RE.strokeStyle="rgba(255,64,52,"+(0.13*bp)+")";RE.lineWidth=2.4;
    RE.beginPath();RE.moveTo(kx(-72),ky(-16));RE.lineTo(kx(-34),ky(-33));RE.stroke();}

  /* ---- room light lands on the unit ---- */
  RB.save();RB.globalCompositeOperation="source-atop";
  var key=RB.createLinearGradient(0,140,0,GY);
  key.addColorStop(0,"rgba(206,226,255,"+(offl?0.05:0.12)+")");
  key.addColorStop(0.3,"rgba(186,206,238,"+(offl?0.02:0.045)+")");
  key.addColorStop(0.68,"rgba(2,6,14,0.10)");
  key.addColorStop(1,"rgba(2,6,14,0.22)");
  RB.fillStyle=key;RB.fillRect(0,0,W,H);
  var bnc=RB.createLinearGradient(0,GY-130,0,GY-8);
  bnc.addColorStop(0,"rgba(104,146,196,0)");bnc.addColorStop(1,"rgba(104,146,196,"+(offl?0.04:0.1)+")");
  RB.fillStyle=bnc;RB.fillRect(0,0,W,H);RB.restore();

  /* ---- rim light: red key, cyan fill ---- */
  RR.globalCompositeOperation="source-over";RR.drawImage(body,0,0);
  RR.globalCompositeOperation="destination-out";RR.drawImage(body,-2.2,1.7);RR.drawImage(body,-1.5,-2.4);
  RR.globalCompositeOperation="source-in";
  var rl=RR.createLinearGradient(60,0,460,0);
  rl.addColorStop(0,"rgba(255,45,34,0.95)");rl.addColorStop(0.42,"rgba(198,140,150,0.42)");rl.addColorStop(1,"rgba(95,214,255,1)");
  RR.fillStyle=rl;RR.fillRect(0,0,W,H);RR.globalCompositeOperation="source-over";
}

/* ---- scene ---- */
function drawScene(t,st){
  var offl=st==="offline";
  var wall=S.createLinearGradient(0,0,0,H);
  wall.addColorStop(0,offl?"#07090d":"#0b0e14");wall.addColorStop(0.75,offl?"#05070a":"#090c12");wall.addColorStop(1,"#05070b");
  S.fillStyle=wall;S.fillRect(0,0,W,H);
  if(!offl){var cone=S.createLinearGradient(0,40,0,560);
    cone.addColorStop(0,"rgba(255,214,150,0.07)");cone.addColorStop(1,"rgba(255,214,150,0)");
    S.fillStyle=cone;S.beginPath();S.moveTo(225,40);S.lineTo(295,40);S.lineTo(410,560);S.lineTo(110,560);S.closePath();S.fill();
    var rg=S.createRadialGradient(260,290,20,260,290,240);
    rg.addColorStop(0,"rgba(255,45,34,0.06)");rg.addColorStop(1,"rgba(255,45,34,0)");
    S.fillStyle=rg;S.fillRect(0,0,W,H);}
  else{var bc=S.createRadialGradient(90,120,4,90,120,150);
    bc.addColorStop(0,"rgba(255,60,50,0.12)");bc.addColorStop(1,"rgba(255,60,50,0)");
    S.fillStyle=bc;S.fillRect(0,0,W,H);}
  S.fillStyle=offl?"#07090c":"#0d1118";S.fillRect(0,560,W,H-560);
  pl(S,0,560,W,560,"rgba(120,140,170,0.14)",1);
  /* Alive: ONE soft shadow pooled far below a body that touches nothing —
     small, diffuse and offset by the drift, which is the whole tell that a
     thing is airborne. Dead: hard contact patches where it fell. */
  if(offl){
    [-238,-166,-100,-58,-52,58,70,112,176,242].forEach(function(dx){
      var sh=S.createRadialGradient(260+dx,560,1,260+dx,560,30);
      sh.addColorStop(0,"rgba(0,0,0,0.5)");sh.addColorStop(0.6,"rgba(0,0,0,0.22)");sh.addColorStop(1,"rgba(0,0,0,0)");
      S.fillStyle=sh;S.beginPath();S.ellipse(260+dx,560,30,8,0,0,7);S.fill();});
    var sh2=S.createRadialGradient(260,558,8,260,558,180);
    sh2.addColorStop(0,"rgba(0,0,0,0.45)");sh2.addColorStop(1,"rgba(0,0,0,0)");
    S.fillStyle=sh2;S.beginPath();S.ellipse(260,558,180,18,0,0,7);S.fill();
  }else{
    var dr=Math.sin(t*0.53)*4;
    var sh3=S.createRadialGradient(260+dr,562,10,260+dr,562,120);
    sh3.addColorStop(0,"rgba(0,0,0,0.34)");sh3.addColorStop(0.55,"rgba(0,0,0,0.14)");sh3.addColorStop(1,"rgba(0,0,0,0)");
    S.fillStyle=sh3;S.beginPath();S.ellipse(260+dr,562,120,13,0,0,7);S.fill();
    S.save();S.globalCompositeOperation="lighter";
    var tp=S.createRadialGradient(260+dr,558,4,260+dr,558,150);
    tp.addColorStop(0,"rgba(255,45,34,0.07)");tp.addColorStop(1,"rgba(255,45,34,0)");
    S.fillStyle=tp;S.beginPath();S.ellipse(260+dr,558,150,16,0,0,7);S.fill();S.restore();}
  S.drawImage(body,0,0);
  S.drawImage(rim,0,0);
  S.save();S.globalCompositeOperation="lighter";S.drawImage(emis,0,0);S.restore();
}

function drawTarget(){
  if(qs.get("outline")===null)return;
  var T=window.__TARGET__;if(!T)return;
  S.save();S.strokeStyle="#2b6bff";S.lineWidth=3;S.lineJoin="round";
  var k=window.__HS__||1;
  S.beginPath();T.forEach(function(p,i){var x=260+p[0]*k,y=250+p[1]*k;i?S.lineTo(x,y):S.moveTo(x,y);});
  S.closePath();S.stroke();S.restore();}
function frame(){
  var t=reduced?T0:(performance.now()/1000);
  drawUnit(t,STATE);drawScene(t,STATE);drawTarget();
  if(!reduced)requestAnimationFrame(frame);
}
frame();
</script>

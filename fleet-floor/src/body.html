
<div id="stage">
  <canvas id="scene"></canvas>
  <div class="hud">
    <button id="back">◀ Fleet Floor</button>
    <div class="title"><b>CREW</b> · AGENT CONSOLE
      <span class="sub" id="sub">claude · builder quarters</span>
      <span class="sub version" id="room-version">version unavailable</span></div>
    <span class="demo-badge" title="Roster is real (crew examples/fleet.roster). Vitals, queue, sessions &amp; metrics are placeholder data — run `crew floor` to serve this page against the real fleet.">◈ DEMO DATA</span>
  </div>
  <div class="foot">
    <span id="fl">claude-builder · sector-7</span>
    <span class="r" id="modelabel">WORKING</span>
  </div>

  <!-- fleet command bar (floor view) -->
  <div class="fleetbar">
    <div class="brand"><b>◆</b> FLEET FLOOR<span class="rp">heavy-duty/crew</span></div>
    <span class="clock" id="clock">--:--:--</span>
    <span class="demo-badge" title="Roster is real (crew examples/fleet.roster). States, active ops, metrics &amp; activity are placeholder data — run `crew floor` to serve this page against the real fleet.">◈ DEMO DATA</span>
    <!-- Result of the last operator action, and the reason a live page stopped
         being live. Empty in DEMO mode. -->
    <span class="livestat" id="livestat"></span>
    <div class="sp"></div>
    <div class="tiles" id="tiles"></div>
    <div class="filters" id="filters">
      <span class="flabel">state</span>
      <button class="fchip on" data-f="state" data-v="all">All</button>
      <button class="fchip" data-f="state" data-v="working">Working</button>
      <button class="fchip" data-f="state" data-v="idle">Idle</button>
      <button class="fchip" data-f="state" data-v="suppressed">Suppressed</button>
      <button class="fchip" data-f="state" data-v="limited">Limited</button>
      <button class="fchip" data-f="state" data-v="disarmed">Disarmed</button>
      <button class="fchip" data-f="state" data-v="silent">Silent</button>
      <span class="flabel">role</span>
      <button class="fchip on" data-f="role" data-v="all">All</button>
      <button class="fchip" data-f="role" data-v="builder">Build</button>
      <button class="fchip" data-f="role" data-v="reviewer">Review</button>
      <button class="fchip" data-f="role" data-v="triage">Triage</button>
    </div>
  </div>

  <!-- agent console (zoom view) -->
  <div class="rail rail-l">
    <div class="wpanel" id="w-id"></div>
    <div class="wpanel" id="w-vitals"></div>
    <div class="wpanel" id="w-queue" style="flex:1;min-height:0;overflow:auto"></div>
  </div>
  <div class="rail rail-r">
    <div class="wpanel" id="w-current"></div>
    <div class="wpanel" id="w-metrics"></div>
    <div class="wpanel" id="w-sessions" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  </div>
  <div class="console2">
    <div class="cl" id="c-target">▸ MESSAGE UNIT</div>
    <div class="crow"><input id="c-in" placeholder="Send a prompt to the agent…" autocomplete="off"><button class="abtn" id="c-send">Send</button>
      <button class="act2" id="a-pause">⏸ Pause</button><button class="act2" id="a-restart">↻ Restart</button><button class="act2" id="a-logs">▤ Logs</button></div>
  </div>

  <!-- The floor with no console on it (#204): a roster written before the
       first `crew hire` draws an empty grid on purpose, and an empty grid with
       no words on it leaves a fresh operator with no next step. Populated by
       syncEmptyFloor(); hidden in DEMO and whenever a console is drawn. -->
  <div class="emptyfloor" id="emptyfloor"></div>

  <!-- fleet operations bar (floor view) -->
  <div class="opsbar">
    <div class="obox ops">
      <div class="oh"><span>ACTIVE OPERATIONS <b id="ops-count"></b></span><span class="gacts"><button class="gbtn" id="g-start">▶ Start all</button><button class="gbtn" id="g-stop">⏸ Stop all</button><button class="gbtn" id="g-wake">◈ Wake silent</button><!--
        The fleet-wide half of #488. It sits with the other fleet-scope
        controls rather than in the chrome above, because that is what it is:
        a change to what the whole fleet watches. The per-box half is in the
        box's own console, beside every other per-box control. --><button class="gbtn" id="g-reg">⛭ Registries</button></span></div>
      <div class="olist" id="opslist"></div>
    </div>
    <div class="obox met">
      <div class="oh"><span>◷ TIME METRICS</span></div>
      <div class="mrows" id="metrows"></div>
    </div>
    <div class="obox actp">
      <div class="oh"><span class="live">● LIVE</span> FLEET ACTIVITY</div>
      <div class="stream" id="stream"></div>
    </div>
  </div>
</div>

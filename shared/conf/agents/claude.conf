# agent profile: claude — the runtime, role-agnostic. Shared by every box
# that drives the Claude CLI (today: the triage box and the claude builder).
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.local/bin"

# One-shot session: prompt is appended as the final argument.
BOT_CLI_CMD=(claude --dangerously-skip-permissions -p)

# Did this session mutate anything? 0 acted · 1 idle · 2 cannot tell (#467).
#
# `claude -p` writes exactly one thing to this log: the model's final reply.
# The tool-use records live in a JSONL transcript under ~/.claude/projects,
# keyed by working directory and not by session, so a hook holding only this
# file's path cannot correlate them race-free. That was the old stub's reason
# for returning 2 and it is still true; what changed is that it stopped
# mattering. Every duty prompt this engine ships ends by asking the session to
# report what it did, so the reply IS a first-person account of the session's
# own acts — the same place codex and kimi read their answer from, in the only
# form this runtime writes it.
#
# The bias is deliberate (#467 D3): ambiguity answers ACTED. A false `no`
# invents waste that is not there and would send the fleet's tuning work
# optimising a duty that is working; a false `yes` only hides waste the raw
# session counts already expose. So `no` is never a default. It is returned
# for one thing: a reply that says, about itself, that it did nothing.
#
# The two patterns are declared beside the function rather than inside it
# because grok.conf carries the identical pair — the profiles are transported
# one file at a time (`crew` stages operator `agents/*.conf` individually), so
# a shared sibling file would not survive an operator overlay, and the
# standalone-sourceable contract asserted in shared/test/conf.sh forbids it.

# A first-person no-op claim, or a session that reports only that it is
# waiting on something. This net is deliberately the loose half of the pair:
# it decides only whether the reply is WORTH READING for idleness, and the act
# pattern below arbitrates every hit, so a fix push that also mentions a suite
# still running is still `yes`.
#
# What it must not contain is a claim about one optional SUB-action, because
# those are true of busy sessions and nothing downstream can rescue them.
# "I made no review requests" and "I did not claim a new issue" are both
# ordinary sentences in a session that pushed a fix, and are absent for that
# reason — as is the bare phrase `nothing changed`, which is these replies
# quoting the doctrine sentence "a resumption that finds nothing changed posts
# nothing", not claiming anything about themselves.
CLAUDE_ACTED_IDLE_RE='\b(i|we) (posted|pushed|committed|wrote|changed|claimed|touched|did|added|removed|edited) nothing\b|\bnothing (was|has been|is being) (posted|pushed|committed|written|changed|done)\b|(^|[[:punct:]] *)nothing (to (act on|do|answer|address|fix|report|amend|correct)|posted|pushed|left to do)\b|\bno (further )?action (was |is |were )?(taken|needed|required)\b|\btook no action\b|\b(i|we) (made|make) no (changes|commits|edits|pushes|posts|comments)\b|\b(i|we) (did not|never) (post|push|commit|comment|write|edit|change|touch)\b|\bno (code|commits?|changes?|edits?) (was|were) (written|made|pushed|committed)\b|\bstill (running|pending|in progress|queued|going|mid-run)\b|\bwaiting (on|for)\b|\b(monitor|watcher)s? (is|are)? ?(now )?armed\b|\bi.?ll (stop polling|hold|stand by|wait|pick (this|it|back) ?(up|it up)?)\b|\bholding (here|until)\b|\bstand(ing)? by\b|\bno more polling\b|\bnothing (further )?(for me )?to (act on|do)\b'

# Evidence the session mutated something itself. The subject is the whole
# discriminator: these replies quote other actors constantly — the engine's
# `🤝 handed off at head`, a reviewer's push, the builder's own signal marker
# from a PREVIOUS session — and every one of those would read as an act to a
# bare verb match. So the verb is anchored to a first-person subject, or to
# the start of a line or sentence, which is where a report of one's own work
# begins ("Claimed #216 and shipped it as PR #227") and where a quoted marker
# never does.
CLAUDE_ACTED_ACT_RE='\b(i|we) (also |then |just |finally |instead |additionally |subsequently |duly |promptly )*(pushed|posted|committed|commented|signalled|signaled|claimed|opened|filed|replied|rebased|amended|reverted|merged|created|wrote|edited|added|removed|applied|marked|assigned|flipped|answered|handed|extended|deleted|renamed|corrected|reworded)\b|\b(i|we).?(ve|have) (pushed|posted|opened|claimed|signalled|signaled|committed|added|removed|answered|handed|marked|edited|written)\b|(^|\. )[-*[:space:]]*(pushed|posted|committed|commented|signalled|signaled|claimed|opened|filed|replied|rebased|amended|applied|assigned|flipped|handed off|answered the round)\b'

# What the vendor prints INSTEAD of a reply: the CLI's own fault and refusal
# banners. A session that hit the weekly cap or a dead login never reached the
# model at all, so its log is not a report of doing nothing — it is not a
# report (#467 D4).
CLAUDE_ACTED_BANNER_RE="^(Execution error|API Error|Credit balance is too low|Invalid API key|Not logged in|You'?.?ve hit your (session|weekly|usage) limit|Usage limit reached)"

# The model's prose, minus what the harness wrote around it: reminder blocks
# the CLI injects into its own output, and those banners. A log holding
# nothing else is a session that never spoke.
#
# `Execution error` arrives with NO trailing newline, so a retry within the
# same session writes `Execution errorExecution errorStill running…` as one
# line: the banner is a PREFIX, not a line, and deleting that line would throw
# away the reply fused to it. So the repeated prefix is stripped first, and
# only then are the lines that were nothing but a banner dropped.
_claude_reply_prose() {
  sed -e '/<system-reminder>/,/<\/system-reminder>/d' "$1" 2>/dev/null \
    | sed -E 's/^(Execution error)+//' \
    | grep -vE "$CLAUDE_ACTED_BANNER_RE" \
    | grep -E '[[:alpha:]]'
}

bot_session_acted() {
  local log="${1:-}" prose residue
  # No file, or a file with no reply in it: a session killed before it spoke,
  # a bare CLI fault. Undeterminable — and #467 D4 keeps that distinct from
  # idle, because "cannot tell" and "did nothing" are different facts.
  [ -n "$log" ] && [ -s "$log" ] || return 2
  prose="$(_claude_reply_prose "$log")"
  [ -n "$prose" ] || return 2

  # No no-op claim anywhere: acted, by D3's default, without further reading.
  printf '%s\n' "$prose" | grep -Eiq "$CLAUDE_ACTED_IDLE_RE" || return 0

  # There is one. Delete the claims themselves before looking for evidence of
  # acting, so "I posted nothing" cannot be read back as "I posted" — the
  # question is whether anything the reply says BESIDES its no-op claim
  # reports a mutation. Something does: the claim was about one sub-action,
  # and the session acted (D3).
  residue="$(printf '%s\n' "$prose" | sed -E "s/$CLAUDE_ACTED_IDLE_RE//Ig")"
  printf '%s\n' "$residue" | grep -Eiq "$CLAUDE_ACTED_ACT_RE" && return 0
  return 1
}

# Auth probe beyond gh. Return 0 = healthy. May touch the network — called
# once per BOOT by the duty gate and by `crew hire`, never per tick.
bot_cli_probe() {
  claude auth status 2>/dev/null | grep -q '"loggedIn": true'
}

# bot_cli_present — the same question, from local disk, in microseconds.
# THREE outcomes, because two would force a guess:
#   0  logged in        1  definitely not      2  cannot tell locally
# Only 1 raises an alert. A profile that cannot tell must return 2 and stay
# quiet: a false "your token is dead" at 3am costs more than a missed one.
#
# The distinction that matters is WHICH credential is tested. `expiresAt` is
# the ACCESS token — roughly eight hours out and refreshed automatically, so a
# box would read "logged out" three times a day. `refreshTokenExpiresAt` is
# the one whose passing means a human must run /login again, so that is what
# this compares against now.
bot_cli_present() {
  local f="$HOME/.claude/.credentials.json"
  if [ ! -s "$f" ]; then
    # A long-lived token from `claude setup-token`, or an API key in the
    # environment, authenticates with no file here. Unverifiable locally —
    # so 2, not 1.
    [ -n "${ANTHROPIC_API_KEY:-}" ] && return 2
    return 1
  fi
  local refresh
  refresh="$(jq -r '.claudeAiOauth.refreshTokenExpiresAt // empty' "$f" 2>/dev/null)" || return 2
  if [ -z "$refresh" ]; then
    # Parsed, but no refresh expiry: a token shape this profile does not know.
    jq -e '.claudeAiOauth.accessToken // empty' "$f" >/dev/null 2>&1 && return 0
    return 2
  fi
  # Numeric guard BEFORE the arithmetic: bash treats a non-numeric word as 0,
  # so an ISO string here would compute an expiry of 1970 and report a
  # confident logout — and rc 1 is the only value that alerts. A shape this
  # profile does not understand is `cannot tell`, never `logged out`.
  case "$refresh" in
    ''|*[!0-9]*) return 2 ;;
  esac
  # Milliseconds since the epoch, hence the /1000.
  [ "$(( refresh / 1000 ))" -gt "$(date +%s)" ]
}

# No bot_cli_expiry. The DATE a credential dies is expressed differently by
# every vendor — epoch millis here, a JWT claim on kimi, nothing at all on
# codex and grok — and that inconsistency was the flaky half of an otherwise
# stable idea. The boolean above is the stable half, and it is all the floor
# needs: this box can work, or it cannot.

AGENT_LOGIN_HINT="run: claude, then /login (or claude setup-token for a long-lived token)"

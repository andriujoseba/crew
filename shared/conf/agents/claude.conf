# agent profile: claude — the runtime, role-agnostic. Shared by every box
# that drives the Claude CLI (today: the triage box and the claude builder).
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.local/bin"

# One-shot session: prompt is appended as the final argument.
BOT_CLI_CMD=(claude --dangerously-skip-permissions -p)

# bot_cli_structured_cmd BASE... — translate the already-resolved invocation
# (including any per-duty model tier) into Claude's machine-readable print
# mode. Other profiles deliberately omit this hook until their own CLI shape
# is known; run_session then keeps using BOT_CLI_CMD byte-for-byte (#475).
bot_cli_structured_cmd() {
  local -a base=("$@")
  local last=$(( ${#base[@]} - 1 ))
  if [ "$last" -ge 0 ] && [ "${base[last]}" = "-p" ]; then
    BOT_CLI_STRUCTURED_CMD=("${base[@]:0:last}" --output-format json -p)
  else
    BOT_CLI_STRUCTURED_CMD=("${base[@]}" --output-format json)
  fi
}

# Restore the same final-answer prose the ordinary `claude -p` invocation
# writes. A CLI error or schema drift is copied verbatim: accounting is never
# allowed to erase the diagnostic log of the session it tried to measure.
bot_cli_structured_prose() {
  local structured="$1"
  if jq -e 'type == "object" and (.result | type == "string")' \
      "$structured" >/dev/null 2>&1; then
    jq -r '.result' "$structured"
  else
    cat "$structured"
  fi
}

# bot_cli_session_id_args SID — the argv fragment that pins a NEW session's id
# (#538 D2). run_session splices it into the already-resolved invocation, so
# this hook renders the fragment and never the whole command.
#
# OBSERVED SESSION. Taken on this box against CLI `2.1.220`, not from vendor
# documentation, and recorded on the PR. `claude --dangerously-skip-permissions
# --session-id d7d876b7-ae67-47d5-ba46-ce4a32081d20 --output-format json -p
# '…'` exited `0` and its result object carried
# `"session_id":"d7d876b7-ae67-47d5-ba46-ce4a32081d20"` — the id the engine
# minted, echoed back — and left the transcript at
# `~/.claude/projects/<cwd-slug>/d7d876b7-….jsonl`. `--session-id` takes a UUID
# and `_session_mint_sid` produces one; a value this CLI would reject never
# reaches here, because an unmintable id is `unknown` and pins nothing.
bot_cli_session_id_args() {
  BOT_CLI_SESSION_ID_ARGS=(--session-id "$1")
}

# bot_cli_resume_args SID — the argv fragment that RESUMES a session (#538 D2).
#
# A separate hook from the one above, and on this CLI that separation is not a
# formality. Measured in the same probe: re-launching with `--session-id` on an
# id that already exists fails the session outright —
# `Error: Session ID <uuid> is already in use.` at `rc=1`. So a resume must
# carry `--resume` and must NOT carry `--session-id`, which is exactly what two
# independently rendered fragments and one splice site give.
#
# `--fork-session` is deliberately absent. Observed: `claude
# --dangerously-skip-permissions --resume <uuid> --output-format json -p 'what
# token did you reply with?'` answered `ALPHA-7391` — the token from the
# killed session's turn, so the context really is carried — and reported
# `"session_id"` UNCHANGED at the resumed id. That is the acceptance criterion
# "the resumed session's sid equals the killed session's", and `--fork-session`
# is the flag that would break it.
bot_cli_resume_args() {
  BOT_CLI_RESUME_ARGS=(--resume "$1")
}

# bot_cli_usage STRUCTURED_LOG SESSION_DIR PROSE_LOG — normalize Claude's
# vendor fields for the engine. This profile reads structured stdout; the
# additional context lets another profile select a session artifact without
# changing run_session's contract. Input and output tokens are the complete
# required measurement. Cache counters and cost are independent enrichment:
# an absent cache concept stays absent, and partial/unknown cost is withheld
# without withholding tokens, model attribution, session identity or pool.
bot_cli_usage() {
  jq -ce '
    select(type == "object" and .type == "result")
    | select(.usage | type == "object")
    | select([
        .usage.input_tokens,
        .usage.output_tokens
      ] | all(type == "number" and . >= 0 and floor == .))
    | . as $result
    | (.modelUsage // {}
        | to_entries
        | map(select(
            (.key | type == "string" and length > 0)
            and (.value.outputTokens | type == "number" and . >= 0 and floor == .)
          ))
        | sort_by([-(.value.outputTokens), .key])) as $models
    | {
        input_tokens: .usage.input_tokens,
        output_tokens: .usage.output_tokens,
        session_id: (
          if (.session_id | type == "string" and length > 0)
          then .session_id else "unknown" end
        ),
        model: (if ($models | length) > 0 then $models[0].key else "unknown" end),
        models: ($models | length)
      }
    | if ($result.usage.cache_creation_input_tokens
        | type == "number" and . >= 0 and floor == .)
      then . + {cache_creation_input_tokens: $result.usage.cache_creation_input_tokens}
      else . end
    | if ($result.usage.cache_read_input_tokens
        | type == "number" and . >= 0 and floor == .)
      then . + {cache_read_input_tokens: $result.usage.cache_read_input_tokens}
      else . end
    | if (([$result.cost_is_partial, $result.usage_is_incomplete, $result.hasUnknownModelCost]
          | any(. == true)) | not)
        and ($result.total_cost_usd | type == "number" and . >= 0)
      then . + {cost_usd: $result.total_cost_usd}
      else . end
  ' "$1" 2>/dev/null
}

# bot_cli_model_cmd TIER — this profile's translation of "this duty wants a
# different model tier" into its own flag (#469 D3). Writes the whole
# invocation into BOT_CLI_MODEL_CMD and returns 0; returns non-zero for a tier
# it cannot express, and the engine then leaves the duty on BOT_CLI_CMD and
# warns rather than proceeding quietly.
#
# Built FROM BOT_CLI_CMD rather than retyped, so the two cannot drift: a flag
# added to the default invocation is inherited by every tiered session on the
# next tick, which is the failure a hand-copied array guarantees eventually.
#
# The tier is passed through as the CLI's own model name — `claude --model`
# takes an alias (`haiku`, `sonnet`, `opus`) or a full model id, and this
# profile does not maintain a second vocabulary on top of it. crew ships the
# mechanism; which tier any duty runs at is @danmt's (#469 D4, D6).
bot_cli_model_cmd() {
  local tier="${1:-}"
  # A tier of whitespace, or one shaped like a flag, is a conf typo rather
  # than a model — refuse it here instead of passing it to the CLI as an
  # argument that means something else entirely.
  case "$tier" in ''|-*|*[[:space:]]*) return 1 ;; esac
  # -p must stay LAST: run_session appends the prompt as the final argument,
  # and `claude -p <prompt>` is what makes it the prompt rather than a stray
  # operand. So the flag pair goes in AHEAD of a trailing -p, and plainly on
  # the end for any other shape an operator overlay might carry.
  local -a base=("${BOT_CLI_CMD[@]}")
  local last=$(( ${#base[@]} - 1 ))
  if [ "$last" -ge 0 ] && [ "${base[last]}" = "-p" ]; then
    BOT_CLI_MODEL_CMD=("${base[@]:0:last}" --model "$tier" -p)
  else
    BOT_CLI_MODEL_CMD=("${base[@]}" --model "$tier")
  fi
}

# Did this session mutate anything? 0 acted · 1 idle · 2 cannot tell (#467).
#
# `claude -p` writes exactly one thing to this log: the model's final reply.
# The tool-use records live in a JSONL transcript under ~/.claude/projects,
# keyed by working directory and not by session, so a hook holding only this
# file's path cannot correlate them race-free. That was the old stub's reason
# for returning 2 and it is still true; what changed is that it stopped
# mattering. Every duty prompt this engine ships ends by asking the session to
# report what it did, so the reply IS a first-person account of the session's
# own acts — the same place codex and kimi read their answer from, in the only
# form this runtime writes it.
#
# The bias is deliberate (#467 D3): ambiguity answers ACTED. A false `no`
# invents waste that is not there and would send the fleet's tuning work
# optimising a duty that is working; a false `yes` only hides waste the raw
# session counts already expose. So `no` is never a default. It is returned
# for one thing: a reply that says, about itself, that it did nothing.
#
# The two patterns are declared beside the function rather than inside it
# because grok.conf carries the identical pair — the profiles are transported
# one file at a time (`crew` stages operator `agents/*.conf` individually), so
# a shared sibling file would not survive an operator overlay, and the
# standalone-sourceable contract asserted in shared/test/conf.sh forbids it.

# A first-person no-op claim, or a session that reports only that it is
# waiting on something. This net is deliberately the loose half of the pair:
# it decides only whether the reply is WORTH READING for idleness, and the act
# pattern below arbitrates every hit, so a fix push that also mentions a suite
# still running is still `yes`.
#
# What it must not contain is a claim about one optional SUB-action, because
# those are true of busy sessions and nothing downstream can rescue them.
# "I made no review requests" and "I did not claim a new issue" are both
# ordinary sentences in a session that pushed a fix, and are absent for that
# reason — as is the bare phrase `nothing changed`, which is these replies
# quoting the doctrine sentence "a resumption that finds nothing changed posts
# nothing", not claiming anything about themselves.
CLAUDE_ACTED_IDLE_RE='\b(i|we) (posted|pushed|committed|wrote|changed|claimed|touched|did|added|removed|edited) nothing\b|\bnothing (was|has been|is being) (posted|pushed|committed|written|changed|done)\b|(^|[[:punct:]] *)nothing (to (act on|do|answer|address|fix|report|amend|correct)|posted|pushed|left to do)\b|\bno (further )?action (was |is |were )?(taken|needed|required)\b|\btook no action\b|\b(i|we) (made|make) no (changes|commits|edits|pushes|posts|comments)\b|\b(i|we) (did not|never) (post|push|commit|comment|write|edit|change|touch)\b|\bno (code|commits?|changes?|edits?) (was|were) (written|made|pushed|committed)\b|\bstill (running|pending|in progress|queued|going|mid-run)\b|\bwaiting (on|for)\b|\b(monitor|watcher)s? (is|are)? ?(now )?armed\b|\bi.?ll (stop polling|hold|stand by|wait|pick (this|it|back) ?(up|it up)?)\b|\bholding (here|until)\b|\bstand(ing)? by\b|\bno more polling\b|\bnothing (further )?(for me )?to (act on|do)\b'

# Evidence the session mutated something itself. The subject is the whole
# discriminator: these replies quote other actors constantly — the engine's
# `🤝 handed off at head`, a reviewer's push, the builder's own signal marker
# from a PREVIOUS session — and every one of those would read as an act to a
# bare verb match. So the verb is anchored to a first-person subject, or to
# the start of a line or sentence, which is where a report of one's own work
# begins ("Claimed #216 and shipped it as PR #227") and where a quoted marker
# never does.
#
# The verb list is what the corpus showed a session doing, and it stops where
# mutation stops: `checked`, `verified`, `confirmed`, `reproduced` and `ran`
# are the four most common past-tense verbs in the idle replies here, and none
# of them changes anything, so none of them is listed. `made` is the one verb
# that needs its object, because "I made no review requests" and "I made one
# correction to the memory file" differ only there.
CLAUDE_ACTED_ACT_RE='\b(i|we)(.?ve| have| had)? (also |then |just |finally |instead |additionally |subsequently |duly |promptly )*(pushed|posted|committed|commented|signalled|signaled|claimed|opened|filed|replied|rebased|amended|reverted|merged|created|wrote|written|edited|added|removed|applied|marked|assigned|flipped|answered|handed|extended|deleted|renamed|corrected|reworded|updated|announced|recorded|requested|flagged|shipped|rewrote|stripped|saved|replaced|logged|escalated|approved|submitted|reviewed|voted|declared|landed)\b|\b(i|we) made (a|an|one|the|two|three|four|five|six|[0-9]|it|them|that)\b|(^|\. )[-*[:space:]]*(pushed|posted|committed|commented|signalled|signaled|claimed|opened|filed|replied|rebased|amended|applied|assigned|flipped|handed off|answered the round|declared|landed)\b'

# The REVIEW duty's acts, which the pattern above structurally cannot see.
#
# This exists because the survey that built that verb list was drawn from a
# box holding 577 `resume`, 312 `build`, 131 `attention` and 36 `ci-red`
# sessions and NOT ONE `review` session — while `claude.conf` is the profile
# every reviewer box in the fleet loads too. claude-bot measured the cost on a
# box whose 1260 logs are 1253 reviews: 25 sessions that had submitted a
# verdict to GitHub, at the SHA their reply named, read back as `no`. That is
# the one direction D3 forbids, and it was invisible from here.
#
# Two things had to change, not one. The vocabulary is the easy half. The hard
# half is that a reviewer's report is SUBJECTLESS BY DESIGN: the shape the
# engine asks for is its own marker, `**<repo>#N — approved** at head <sha>`,
# and the passive summaries around it — `Both verdicts submitted`, `Both PRs
# reviewed and approved` — have no first-person subject for the pattern above
# to anchor to. So this one anchors to the marker and to the verdict noun
# instead, which is where a review session's act actually appears.
#
# The anchor that replaces the subject is POSITION, and it had to be measured
# rather than guessed. The first draft of this pattern accepted a verdict word
# next to a head SHA — `approved at <sha>` — and the corpus answered
# immediately: 45 sessions flipped `no` → `yes` and ALL FORTY-FIVE were false.
# Every one was a builder's `resume` session reading the panel's state back
# ("all three APPROVED at `019db9b4`", "zero verdicts submitted at that head"),
# which is the same quoted-actor failure the subject anchor exists to stop,
# arriving through a different door. So the three forms below are the ones a
# reviewer's OWN report uses and a quotation of someone else's does not:
#
#   A  the engine's marker, where the verdict sits directly after the issue
#      reference — `**<repo>#N — approved** at head <sha>`. A quotation names
#      the voter first ("all three panelists — ... — approved") and never has
#      `#N` adjacent to the dash.
#   B  the verdict noun as the SUBJECT of its sentence — `Both verdicts
#      submitted`, `Verdict submitted via the wrapper`. The quoting forms in
#      this corpus all carry it as an object mid-sentence: `zero verdicts
#      submitted`, `no verdict submitted`, `approvals were submitted`.
#   C  `reviewed and approved`, the compound this duty reports two PRs with.
#
# Widening act evidence is safe in a way that widening the idle net is not:
# this pattern is read ONLY on the residue, after an idle claim has already
# matched, so every verdict it can change is `no` → `yes`. That is D3's
# sanctioned direction, and it is why a loose word here costs less than a
# loose word in the idle net. It is not a licence to skip the audit — the 45
# above were D3-sanctioned too, and they were still wrong.
# The backtick runs below are ERE, not command substitution: a title span in
# a rendered marker is delimited by them, which is what lets it be matched as
# a span rather than as "anything up to a full stop" (a version number in a
# title ends that early). Hence the disable.
# shellcheck disable=SC2016
CLAUDE_ACTED_VERDICT_RE='(^|\. )[-*>|[:space:]]*\**(([a-z0-9_.-]+/[a-z0-9_.-]+)?#[0-9]+|pr[[:space:]]+#?[0-9]+)(\([^)]*\)|`[^`]*`|\*+|,|[[:space:]])*(—|–|→)((\([^)]*\)|`[^`]*`|\*+|,|[[:space:]])|(—|–|→))*\**(approved?|request(ed)? changes|changes requested|commented?)\b|(^|\. |, )[-*>|[:space:]]*\**(both |all |the |my |two |three |four )*(verdicts?|reviews?|approvals?|announcements?|announces?)\**,?[[:space:]]+(submitted|posted|left|filed|delivered|landed)\b|\breviewed and (approved|request(ed)? changes|changes requested)\b|(^|\. |, )[-*>|[:space:]]*\**submitted\**[[:space:]]*\**`?(request.changes|changes.requested|approv|(a|the|my|our|both|two|three) verdicts?|verdicts?)'

# Is this transcript a report from a session of this engine AT ALL? (#467 D4,
# third clause — "a transcript the profile does not recognise".)
#
# The three patterns above answer WHOSE acts a reply reports, and they answer
# it precisely, by anchoring a verb to its subject. This one answers a prior
# and much cruder question: does the reply mention any of this engine's
# objects — an issue, a head, one of its markers — or any of the acts its
# duties perform, in any form at all? It is the same vocabulary with every
# anchor removed, so it cannot distinguish a session's own act from a quoted
# one, and it is not asked to: what it separates is a duty session's reply
# from something that is not one.
#
# Deliberately loose, because it gates the UNKNOWN state and D3 governs
# everything inside it. A reply this recognises but cannot read is ambiguous,
# and ambiguity answers ACTED; only prose that never mentions this engine's
# work at all is a transcript the profile cannot read.
CLAUDE_ACTED_REPORT_RE='(📣|🔧|⟲|🤝|🔎|📌|✅|🛑)|\b(round answered|addressing round|resuming from|handed off|picked up|reviewing head|needs-human|plan of record|acceptance criteri)|#[0-9]+\b|\b[0-9a-f]{7,40}\b|\b(post|posts|posted|posting|push|pushes|pushed|pushing|commit|commits|committed|committing|comment|comments|commented|commenting|signal|signals|signalled|signaled|signalling|claim|claims|claimed|claiming|rebase|rebased|amend|amended|merge|merged|revert|reverted|approve|approved|approving|submit|submitted|submitting|review|reviews|reviewed|reviewing|verdict|verdicts|worklog|changelog|branch|worktree|checkbox|checkboxes|ship|shipped|wrote|written|writing|edit|edited|editing)\b'

# What the vendor prints INSTEAD of a reply: the CLI's own fault and refusal
# banners. A session that hit the weekly cap or a dead login never reached the
# model at all, so its log is not a report of doing nothing — it is not a
# report (#467 D4).
CLAUDE_ACTED_BANNER_RE="^(Execution error|API Error|Credit balance is too low|Invalid API key|Not logged in|You'?.?ve hit your (session|weekly|usage) limit|Usage limit reached)"

# The model's prose, minus what the harness wrote around it: reminder blocks
# the CLI injects into its own output, and those banners. A log holding
# nothing else is a session that never spoke.
#
# `Execution error` arrives with NO trailing newline — all 26 of it in this
# box's captured logs are a 15-byte file with nothing after it. That it has so
# far been the whole line is luck, not contract: nothing makes the next write
# start a new one, and a whole-line filter would take the reply fused to it
# along with the banner. So the repeated prefix is stripped first, and only
# then are the lines that were nothing but a banner dropped.
_claude_reply_prose() {
  sed -e '/<system-reminder>/,/<\/system-reminder>/d' "$1" 2>/dev/null \
    | sed -E 's/^(Execution error)+//' \
    | grep -vE "$CLAUDE_ACTED_BANNER_RE" \
    | grep -E '[[:alpha:]]'
}

bot_session_acted() {
  local log="${1:-}" prose residue
  # No file, or a file with no reply in it: a session killed before it spoke,
  # a bare CLI fault. Undeterminable — and #467 D4 keeps that distinct from
  # idle, because "cannot tell" and "did nothing" are different facts.
  [ -n "$log" ] && [ -s "$log" ] || return 2
  prose="$(_claude_reply_prose "$log")"
  [ -n "$prose" ] || return 2

  # There is prose, but nothing in it this profile can read as a report from
  # one of this engine's sessions: another runtime's transcript, a bare
  # question, a harness reminder that survived the strip. D4's third state,
  # and it is a different fact from "did nothing" — so it is not folded into
  # `no`, and it is not folded into `yes` either.
  printf '%s\n' "$prose" | grep -Eiq \
    "$CLAUDE_ACTED_REPORT_RE|$CLAUDE_ACTED_IDLE_RE|$CLAUDE_ACTED_ACT_RE|$CLAUDE_ACTED_VERDICT_RE" \
    || return 2

  # No no-op claim anywhere: acted, by D3's default, without further reading.
  printf '%s\n' "$prose" | grep -Eiq "$CLAUDE_ACTED_IDLE_RE" || return 0

  # There is one. Delete the claims themselves before looking for evidence of
  # acting, so "I posted nothing" cannot be read back as "I posted" — the
  # question is whether anything the reply says BESIDES its no-op claim
  # reports a mutation. Something does: the claim was about one sub-action,
  # and the session acted (D3).
  residue="$(printf '%s\n' "$prose" | sed -E "s/$CLAUDE_ACTED_IDLE_RE//Ig")"
  printf '%s\n' "$residue" \
    | grep -Eiq "$CLAUDE_ACTED_ACT_RE|$CLAUDE_ACTED_VERDICT_RE" && return 0
  return 1
}

# Vendor-specific terminal classification, derived from observed fleet
# sessions recorded on heavy-duty/crew#501: 2,509 consecutive claude-triage
# failures ended in the weekly-reset banner, while the reviewer corpus cited
# below contains the same session-reset family. The observed corpus is UTC-only,
# so the timezone suffix remains deliberately narrow. Only the final non-empty
# line can classify the failure; earlier output can quote a real quota banner
# before an unrelated transient error.
# Observed sessions: heavy-duty/crew#501 and shared/test/conf.sh quota.log.
bot_session_terminal_fixture() {
  printf '%s\n' "You've hit your weekly limit · resets 9am (UTC)"
}

bot_session_terminal() {
  local failure_tail
  failure_tail="$(awk 'NF { line=$0 } END { print line }' "$1" 2>/dev/null)"
  printf '%s\n' "$failure_tail" \
    | grep -Eiq "^You've hit your (session|weekly) limit · resets .+ \\(UTC\\)$"
}

# Auth probe beyond gh. Return 0 = healthy. May touch the network — called
# once per BOOT by the duty gate and by `crew hire`, never per tick.
bot_cli_probe() {
  claude auth status 2>/dev/null | grep -q '"loggedIn": true'
}

# bot_cli_present — the same question, from local disk, in microseconds.
# THREE outcomes, because two would force a guess:
#   0  logged in        1  definitely not      2  cannot tell locally
# Only 1 raises an alert. A profile that cannot tell must return 2 and stay
# quiet: a false "your token is dead" at 3am costs more than a missed one.
#
# The distinction that matters is WHICH credential is tested. `expiresAt` is
# the ACCESS token — roughly eight hours out and refreshed automatically, so a
# box would read "logged out" three times a day. `refreshTokenExpiresAt` is
# the one whose passing means a human must run /login again, so that is what
# this compares against now.
bot_cli_present() {
  local f="$HOME/.claude/.credentials.json"
  if [ ! -s "$f" ]; then
    # A long-lived token from `claude setup-token`, or an API key in the
    # environment, authenticates with no file here. Unverifiable locally —
    # so 2, not 1.
    [ -n "${ANTHROPIC_API_KEY:-}" ] && return 2
    return 1
  fi
  local refresh
  refresh="$(jq -r '.claudeAiOauth.refreshTokenExpiresAt // empty' "$f" 2>/dev/null)" || return 2
  if [ -z "$refresh" ]; then
    # Parsed, but no refresh expiry: a token shape this profile does not know.
    jq -e '.claudeAiOauth.accessToken // empty' "$f" >/dev/null 2>&1 && return 0
    return 2
  fi
  # Numeric guard BEFORE the arithmetic: bash treats a non-numeric word as 0,
  # so an ISO string here would compute an expiry of 1970 and report a
  # confident logout — and rc 1 is the only value that alerts. A shape this
  # profile does not understand is `cannot tell`, never `logged out`.
  case "$refresh" in
    ''|*[!0-9]*) return 2 ;;
  esac
  # Milliseconds since the epoch, hence the /1000.
  [ "$(( refresh / 1000 ))" -gt "$(date +%s)" ]
}

# No bot_cli_expiry. The DATE a credential dies is expressed differently by
# every vendor — epoch millis here, a JWT claim on kimi, nothing at all on
# codex and grok — and that inconsistency was the flaky half of an otherwise
# stable idea. The boolean above is the stable half, and it is all the floor
# needs: this box can work, or it cannot.

AGENT_LOGIN_HINT="run: claude, then /login (or claude setup-token for a long-lived token)"

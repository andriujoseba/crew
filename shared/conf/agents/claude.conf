# agent profile: claude — the runtime, role-agnostic. Shared by every box
# that drives the Claude CLI (today: the triage box and the claude builder).
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.local/bin"

# One-shot session: prompt is appended as the final argument.
BOT_CLI_CMD=(claude --dangerously-skip-permissions -p)

# Auth probe beyond gh. Return 0 = healthy. May touch the network — called
# once per BOOT by the duty gate and by `crew hire`, never per tick.
bot_cli_probe() {
  claude auth status 2>/dev/null | grep -q '"loggedIn": true'
}

# bot_cli_present — the same question, from local disk, in microseconds.
# THREE outcomes, because two would force a guess:
#   0  logged in        1  definitely not      2  cannot tell locally
# Only 1 raises an alert. A profile that cannot tell must return 2 and stay
# quiet: a false "your token is dead" at 3am costs more than a missed one.
#
# The distinction that matters here is which expiry is read. `expiresAt` is
# the ACCESS token — roughly eight hours out and refreshed automatically, so
# alarming on it would page the operator three times a day forever.
# `refreshTokenExpiresAt` is the one whose passing means a human must run
# /login again, which is the only event worth reporting.
bot_cli_present() {
  local f="$HOME/.claude/.credentials.json"
  if [ ! -s "$f" ]; then
    # A long-lived token from `claude setup-token`, or an API key in the
    # environment, authenticates with no file here. Unverifiable locally —
    # so 2, not 1.
    [ -n "${ANTHROPIC_API_KEY:-}" ] && return 2
    return 1
  fi
  local refresh
  refresh="$(jq -r '.claudeAiOauth.refreshTokenExpiresAt // empty' "$f" 2>/dev/null)" || return 2
  if [ -z "$refresh" ]; then
    # Parsed, but no refresh expiry: a token shape this profile does not know.
    jq -e '.claudeAiOauth.accessToken // empty' "$f" >/dev/null 2>&1 && return 0
    return 2
  fi
  # Milliseconds since the epoch, hence the /1000.
  [ "$(( refresh / 1000 ))" -gt "$(date +%s)" ]
}

# bot_cli_expiry — ISO8601 of the moment a human must log in again, or
# nothing. Same file, same field, no network.
bot_cli_expiry() {
  local f="$HOME/.claude/.credentials.json" refresh
  [ -s "$f" ] || return 0
  refresh="$(jq -r '.claudeAiOauth.refreshTokenExpiresAt // empty' "$f" 2>/dev/null)" || return 0
  [ -n "$refresh" ] || return 0
  date -u -d "@$(( refresh / 1000 ))" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || true
}

AGENT_LOGIN_HINT="run: claude, then /login (or claude setup-token for a long-lived token)"

# agent profile: codex — the runtime, role-agnostic.
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.local/bin"

BOT_CLI_CMD=(codex exec --dangerously-bypass-approvals-and-sandbox -c model_reasoning_effort="medium")

# bot_cli_structured_cmd BASE... — keep Codex's JSONL event stream separate
# from the final-answer prose that every existing session-log reader expects.
# The engine has not chosen either output path when it asks this hook to render
# the command, so the profile owns a temporary prose path and consumes it in
# bot_cli_structured_prose after the CLI exits.
#
# OBSERVED SESSION. Taken on a creds-bearing box against `codex-cli 0.146.0`:
#
#   codex exec --dangerously-bypass-approvals-and-sandbox \
#     -c model_reasoning_effort="low" --json -o <tmp>/prose.txt \
#     "Run pwd using the shell tool, then reply with exactly: observation complete. Do not modify any file."
#
# The prose file contained `observation complete.` unchanged. Structured stdout
# carried, in order, thread.started, turn.started, four item events and the one
# turn.completed usage object reproduced above bot_cli_usage below (#570 D2).
bot_cli_structured_cmd() {
  local -a base=("$@")
  CODEX_CLI_PROSE_LOG="$(mktemp "${TMPDIR:-/tmp}/crew-codex-prose.XXXXXX")" \
    || return 1
  BOT_CLI_STRUCTURED_CMD=(
    "${base[@]}" --json --output-last-message "$CODEX_CLI_PROSE_LOG"
  )
}

bot_cli_structured_prose() {
  local prose="${CODEX_CLI_PROSE_LOG:-}"
  if [ -n "$prose" ] && [ -f "$prose" ]; then
    cat "$prose"
    rm -f "$prose"
    CODEX_CLI_PROSE_LOG=""
    return 0
  fi
  CODEX_CLI_PROSE_LOG=""
  # Returning non-zero asks the engine to preserve structured stdout verbatim.
  # It owns that fallback; copying it here as well would duplicate the stream.
  return 1
}

# bot_cli_usage STRUCTURED_LOG SESSION_DIR PROSE_LOG — select usage from the
# single completed turn in Codex's JSONL stream. Identity legitimately comes
# from the earlier thread.started event; no other event contributes usage and
# no running total is accumulated.
#
# The observed turn.completed block was:
#
#   {"type":"turn.completed","usage":{"input_tokens":30302,
#   "cached_input_tokens":25088,"cache_write_input_tokens":0,
#   "output_tokens":91,"reasoning_output_tokens":0}}
#
# Codex counts cached input inside input_tokens, so this contract's uncached
# input is 30302 - 25088 = 5214. The stream names no model and no money:
# model=unknown is honest, the configured tier remains on SESSION END in its
# own field, and cost_usd is never fabricated. reasoning_output_tokens stays a
# distinct normalized field; the engine's deliberately closed renderer does
# not yet carry it onto SESSION END (#570 D3, D4, D6).
bot_cli_usage() {
  jq -sce '
    [ .[]
      | select(type == "object" and .type == "turn.completed")
      | select(.usage | type == "object")
    ] as $turns
    | select($turns | length == 1)
    | $turns[0].usage as $usage
    | select([
        $usage.input_tokens,
        $usage.cached_input_tokens,
        $usage.output_tokens
      ] | all(type == "number" and . >= 0 and floor == .))
    | select($usage.cached_input_tokens <= $usage.input_tokens)
    | [ .[]
        | select(type == "object" and .type == "thread.started")
        | .thread_id
        | select(type == "string" and length > 0)
      ] as $threads
    | {
        input_tokens: ($usage.input_tokens - $usage.cached_input_tokens),
        output_tokens: $usage.output_tokens,
        cache_read_input_tokens: $usage.cached_input_tokens,
        session_id: (if ($threads | length) == 1 then $threads[0] else "unknown" end),
        model: "unknown"
      }
    | if ($usage.cache_write_input_tokens
        | type == "number" and . >= 0 and floor == .)
      then . + {cache_creation_input_tokens: $usage.cache_write_input_tokens}
      else . end
    | if ($usage.reasoning_output_tokens
        | type == "number" and . >= 0 and floor == .)
      then . + {reasoning_output_tokens: $usage.reasoning_output_tokens}
      else . end
  ' "$1" 2>/dev/null
}

# bot_cli_model_cmd TIER — this profile's translation of a per-duty tier into
# its own flag (#469 D3). Writes BOT_CLI_MODEL_CMD and returns 0; returns
# non-zero for a tier it cannot express, and the engine then leaves the duty
# on BOT_CLI_CMD and warns rather than proceeding quietly.
#
# Built FROM BOT_CLI_CMD so the two cannot drift — the reasoning-effort
# setting above is inherited rather than retyped, which matters here more than
# on claude: effort and model are separate axes on this CLI, and a tiered
# session that silently lost `model_reasoning_effort` would be a second change
# nobody asked for.
#
# `--model` goes on the end: `codex exec` takes the prompt as a trailing
# operand and its flags may precede it in any order, so there is no last-flag
# constraint to respect the way `claude -p` has one.
bot_cli_model_cmd() {
  local tier="${1:-}"
  case "$tier" in ''|-*|*[[:space:]]*) return 1 ;; esac
  BOT_CLI_MODEL_CMD=("${BOT_CLI_CMD[@]}" --model "$tier")
}

bot_session_acted() {
  grep -Eq '(^|[[:space:]])(exec|apply_patch)([[:space:]]|$)|^tool (call|result)' "$1"
}

bot_cli_probe() {
  codex login status >/dev/null 2>&1
}

# Codex keeps its credential in ${CODEX_HOME:-~/.codex}/auth.json, shaped
# {"auth_mode":..,"tokens":{"access_token","id_token","refresh_token"},
#  "last_refresh":..}. Local reads only, once per tick.
_codex_auth()   { printf '%s/auth.json'   "${CODEX_HOME:-$HOME/.codex}"; }
_codex_config() { printf '%s/config.toml' "${CODEX_HOME:-$HOME/.codex}"; }

# 0 logged in · 1 definitely not · 2 cannot tell locally. Only 1 alerts.
#
# The middle case is real here in a way it is not for claude or kimi: codex can
# be configured to keep its credential in the desktop KEYRING instead of a
# file (cli_auth_credentials_store in config.toml). On such a box a missing
# auth.json is normal and says nothing, so it must not be read as a logout —
# hence 2, and the boot gate's `codex login status` remains the authority.
bot_cli_present() {
  local f
  f="$(_codex_auth)"
  if [ -s "$f" ]; then
    jq -e '.tokens.access_token // empty' "$f" >/dev/null 2>&1 && return 0
    return 2                                     # present but not a shape we know
  fi
  # No file. Only call that a logout when this box is actually file-backed.
  grep -q 'cli_auth_credentials_store' "$(_codex_config)" 2>/dev/null && return 2
  return 1
}

# Codex's refresh token is OPAQUE, so "has the credential a human must renew
# run out?" has no local answer here at all. The one expiry that IS readable —
# the `exp` inside access_token — is the short-lived one the CLI refreshes
# silently, and testing it would report a healthy box as logged out every few
# minutes. `last_refresh` is not it either: that is when the token was last
# renewed, not when renewal stops working. So presence is the answer, and
# anything less certain is 2.

AGENT_LOGIN_HINT="run: codex login"

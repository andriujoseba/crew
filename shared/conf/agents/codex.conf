# agent profile: codex — the runtime, role-agnostic.
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.local/bin"

BOT_CLI_CMD=(codex exec --dangerously-bypass-approvals-and-sandbox)

bot_cli_probe() {
  codex login status >/dev/null 2>&1
}

# UNVERIFIED against a real codex box: ~/.codex/auth.json is the conventional
# path, but nobody has confirmed it is the only one codex uses, so a missing
# file cannot be read as logged out. Present file -> 0; anything else -> 2
# (cannot tell), never 1. That makes this profile silent rather than wrong,
# and the per-boot bot_cli_probe above still catches a real logout.
#
# To finish this: on a codex box, confirm where the credential lives and
# whether it carries an expiry, then return 1 for absent and add
# bot_cli_expiry — exactly as claude.conf does.
bot_cli_present() {
  [ -s "$HOME/.codex/auth.json" ] && return 0
  return 2
}
AGENT_LOGIN_HINT="run: codex login"

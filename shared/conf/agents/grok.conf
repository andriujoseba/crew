# agent profile: grok — the runtime, role-agnostic.
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.grok/bin"

BOT_CLI_CMD=(grok --permission-mode bypassPermissions --always-approve -p)

bot_cli_probe() {
  [ -s "$HOME/.grok/auth.json" ]
}

# Grok's probe was ALREADY a local file test, so the per-tick check is the
# same check and is authoritative — 1, not 2, when the file is missing. This
# profile is the cheap case the other three are being moved toward.
bot_cli_present() {
  [ -s "$HOME/.grok/auth.json" ]
}

# No bot_cli_expiry: nothing in auth.json has been confirmed to carry an
# expiry, and inventing a field name here would produce a countdown to a date
# that means nothing. Absent is reported as "no expiry known", which is true.
AGENT_LOGIN_HINT="run the grok CLI login (it must create ~/.grok/auth.json)"

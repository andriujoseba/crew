# agent profile: grok — the runtime, role-agnostic.
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.grok/bin"

BOT_CLI_CMD=(grok --permission-mode bypassPermissions --always-approve -p)

bot_cli_probe() {
  [ -s "$HOME/.grok/auth.json" ]
}

# Grok keeps its session in $GROK_HOME/auth.json (default ~/.grok), 0600.
# The file is a MAP of credential slots keyed "<issuer>::<client_id>", each
# holding `key` (the access JWT), `refresh_token` (opaque), `expires_at` and
# `create_time` — not a flat object, which is why an `-s` file test alone is
# too weak: an empty `{}` written by a failed login is a non-empty file.
_grok_auth() { printf '%s/auth.json' "${GROK_HOME:-$HOME/.grok}"; }

# 0 logged in · 1 definitely not · 2 cannot tell locally. Only 1 alerts.
bot_cli_present() {
  local f
  f="$(_grok_auth)"
  if [ -s "$f" ]; then
    # At least one slot carrying a refresh token. `{}` or a half-written file
    # is "cannot tell" rather than a logout — the operator has nothing to fix.
    jq -e 'to_entries | map(select(.value.refresh_token // empty)) | length > 0' \
      "$f" >/dev/null 2>&1 && return 0
    return 2
  fi
  # API-key auth (XAI_API_KEY, or per-model keys in config.toml) works with no
  # auth.json at all, so a missing file is not evidence of a logout there.
  [ -n "${XAI_API_KEY:-}" ] && return 2
  return 1
}

# Same shape as codex: grok's refresh token is an opaque string with no local
# expiry, and the only readable date, `expires_at`, is the ACCESS token —
# hours, refreshed automatically — so testing it would call a working box
# logged out several times a day. `create_time` is the session's age, not its
# deadline. Presence is the answer here.

AGENT_LOGIN_HINT="run the grok CLI login (it must create ~/.grok/auth.json)"

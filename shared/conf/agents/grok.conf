# agent profile: grok — the runtime, role-agnostic.
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.grok/bin"

BOT_CLI_CMD=(grok --permission-mode bypassPermissions --always-approve -p)

bot_cli_probe() {
  [ -s "$HOME/.grok/auth.json" ]
}
AGENT_LOGIN_HINT="run the grok CLI login (it must create ~/.grok/auth.json)"

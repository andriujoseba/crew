# agent profile: grok — the runtime, role-agnostic.
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.grok/bin"

BOT_CLI_CMD=(grok --permission-mode bypassPermissions --always-approve -p)

# Did this session mutate anything? 0 acted · 1 idle · 2 cannot tell (#467).
#
# This profile used to define nothing at all, which reads in duty.log exactly
# as claude's stub did — `acted=unknown`, on every session this box has ever
# run — while being a different failure: session_acted's `declare -F` guard
# answers `unknown` for a profile with no hook, so the silence was by omission
# and nothing named it.
#
# `grok -p` is the same shape of runtime as `claude -p`: a one-shot whose only
# output on this log is the model's final reply, with its tool records kept
# elsewhere. So the detector is the same detector, and deliberately the same
# text — see claude.conf for the full reasoning, of which the load-bearing
# part is the bias: ambiguity answers ACTED (#467 D3), and `no` is returned
# only for a reply that says, about itself, that it did nothing.
#
# It is duplicated rather than shared because a profile is transported one
# file at a time — `crew` stages operator `agents/*.conf` individually — so a
# sourced sibling would not survive an operator overlay, and the
# standalone-sourceable contract asserted in shared/test/conf.sh forbids it.
# shared/test/conf.sh pins the two copies to the same behaviour, case for case.
GROK_ACTED_IDLE_RE='\b(i|we) (posted|pushed|committed|wrote|changed|claimed|touched|did|added|removed|edited) nothing\b|\bnothing (was|has been|is being) (posted|pushed|committed|written|changed|done)\b|(^|[[:punct:]] *)nothing (to (act on|do|answer|address|fix|report|amend|correct)|posted|pushed|left to do)\b|\bno (further )?action (was |is |were )?(taken|needed|required)\b|\btook no action\b|\b(i|we) (made|make) no (changes|commits|edits|pushes|posts|comments)\b|\b(i|we) (did not|never) (post|push|commit|comment|write|edit|change|touch)\b|\bno (code|commits?|changes?|edits?) (was|were) (written|made|pushed|committed)\b|\bstill (running|pending|in progress|queued|going|mid-run)\b|\bwaiting (on|for)\b|\b(monitor|watcher)s? (is|are)? ?(now )?armed\b|\bi.?ll (stop polling|hold|stand by|wait|pick (this|it|back) ?(up|it up)?)\b|\bholding (here|until)\b|\bstand(ing)? by\b|\bno more polling\b|\bnothing (further )?(for me )?to (act on|do)\b'

GROK_ACTED_ACT_RE='\b(i|we) (also |then |just |finally |instead |additionally |subsequently |duly |promptly )*(pushed|posted|committed|commented|signalled|signaled|claimed|opened|filed|replied|rebased|amended|reverted|merged|created|wrote|edited|added|removed|applied|marked|assigned|flipped|answered|handed|extended|deleted|renamed|corrected|reworded)\b|\b(i|we).?(ve|have) (pushed|posted|opened|claimed|signalled|signaled|committed|added|removed|answered|handed|marked|edited|written)\b|(^|\. )[-*[:space:]]*(pushed|posted|committed|commented|signalled|signaled|claimed|opened|filed|replied|rebased|amended|applied|assigned|flipped|handed off|answered the round)\b'

# What the vendor prints INSTEAD of a reply: the CLI's own fault and refusal
# banners. A session that hit the weekly cap or a dead login never reached the
# model at all, so its log is not a report of doing nothing — it is not a
# report (#467 D4).
GROK_ACTED_BANNER_RE="^(Execution error|API Error|Credit balance is too low|Invalid API key|Not logged in|You'?.?ve hit your (session|weekly|usage) limit|Usage limit reached)"

# The model's prose, minus what the harness wrote around it: reminder blocks
# the CLI injects into its own output, and those banners. A log holding
# nothing else is a session that never spoke.
#
# `Execution error` arrives with NO trailing newline, so a retry within the
# same session writes `Execution errorExecution errorStill running…` as one
# line: the banner is a PREFIX, not a line, and deleting that line would throw
# away the reply fused to it. So the repeated prefix is stripped first, and
# only then are the lines that were nothing but a banner dropped.
_grok_reply_prose() {
  sed -e '/<system-reminder>/,/<\/system-reminder>/d' "$1" 2>/dev/null \
    | sed -E 's/^(Execution error)+//' \
    | grep -vE "$GROK_ACTED_BANNER_RE" \
    | grep -E '[[:alpha:]]'
}

bot_session_acted() {
  local log="${1:-}" prose residue
  # No file, or a file with no reply in it: a session killed before it spoke,
  # a bare CLI fault. Undeterminable — and #467 D4 keeps that distinct from
  # idle, because "cannot tell" and "did nothing" are different facts.
  [ -n "$log" ] && [ -s "$log" ] || return 2
  prose="$(_grok_reply_prose "$log")"
  [ -n "$prose" ] || return 2

  # No no-op claim anywhere: acted, by D3's default, without further reading.
  printf '%s\n' "$prose" | grep -Eiq "$GROK_ACTED_IDLE_RE" || return 0

  # There is one. Delete the claims themselves before looking for evidence of
  # acting, so "I posted nothing" cannot be read back as "I posted" — the
  # question is whether anything the reply says BESIDES its no-op claim
  # reports a mutation. Something does: the claim was about one sub-action,
  # and the session acted (D3).
  residue="$(printf '%s\n' "$prose" | sed -E "s/$GROK_ACTED_IDLE_RE//Ig")"
  printf '%s\n' "$residue" | grep -Eiq "$GROK_ACTED_ACT_RE" && return 0
  return 1
}

bot_cli_probe() {
  [ -s "$HOME/.grok/auth.json" ]
}

# Grok keeps its session in $GROK_HOME/auth.json (default ~/.grok), 0600.
# The file is a MAP of credential slots keyed "<issuer>::<client_id>", each
# holding `key` (the access JWT), `refresh_token` (opaque), `expires_at` and
# `create_time` — not a flat object, which is why an `-s` file test alone is
# too weak: an empty `{}` written by a failed login is a non-empty file.
_grok_auth() { printf '%s/auth.json' "${GROK_HOME:-$HOME/.grok}"; }

# 0 logged in · 1 definitely not · 2 cannot tell locally. Only 1 alerts.
bot_cli_present() {
  local f
  f="$(_grok_auth)"
  if [ -s "$f" ]; then
    # At least one slot carrying a refresh token. `{}` or a half-written file
    # is "cannot tell" rather than a logout — the operator has nothing to fix.
    jq -e 'to_entries | map(select(.value.refresh_token // empty)) | length > 0' \
      "$f" >/dev/null 2>&1 && return 0
    return 2
  fi
  # API-key auth (XAI_API_KEY, or per-model keys in config.toml) works with no
  # auth.json at all, so a missing file is not evidence of a logout there.
  [ -n "${XAI_API_KEY:-}" ] && return 2
  return 1
}

# Same shape as codex: grok's refresh token is an opaque string with no local
# expiry, and the only readable date, `expires_at`, is the ACCESS token —
# hours, refreshed automatically — so testing it would call a working box
# logged out several times a day. `create_time` is the session's age, not its
# deadline. Presence is the answer here.

AGENT_LOGIN_HINT="run the grok CLI login (it must create ~/.grok/auth.json)"

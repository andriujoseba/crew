# agent profile: kimi — the runtime, role-agnostic.
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.kimi-code/bin"

BOT_CLI_CMD=(kimi -p)

bot_cli_probe() {
  kimi doctor >/dev/null 2>&1
}

# Kimi keeps its OAuth credential in $KIMI_CODE_HOME/credentials/kimi-code.json
# (default ~/.kimi-code), 0600 inside a 0700 dir. Everything below is a local
# read — no network, once per tick.
_kimi_cred() { printf '%s/credentials/kimi-code.json' "${KIMI_CODE_HOME:-$HOME/.kimi-code}"; }

# The refresh token is a JWT and its `exp` claim is the only one that means
# "a human must /login again" — same trap as claude.conf: `expires_at` in this
# file is the ACCESS token, which lives minutes and is refreshed silently, so
# testing it would report a healthy box as logged out continuously.
#
# Decoded with base64 + jq rather than python3: the engine depends only on
# bash+gh+jq+git+flock+timeout, and the kimi box is the one with no node.
# base64url is not base64 — the alphabet differs and the padding is stripped,
# so both are restored before decoding or base64 rejects the input.
_kimi_refresh_exp() {
  local f p exp
  f="$(_kimi_cred)"; [ -s "$f" ] || return 1
  p="$(jq -r '.refresh_token // empty' "$f" 2>/dev/null)" || return 1
  [ -n "$p" ] || return 1
  p="${p#*.}"; p="${p%%.*}"                       # the claims segment
  [ -n "$p" ] || return 1
  p="$(printf '%s' "$p" | tr '_-' '/+')"
  case $(( ${#p} % 4 )) in
    2) p="$p==" ;;
    3) p="$p=" ;;
    1) return 1 ;;                                # not a valid base64 length
  esac
  exp="$(printf '%s' "$p" | base64 -d 2>/dev/null | jq -r '.exp // empty' 2>/dev/null)" || return 1
  case "$exp" in ''|*[!0-9]*) return 1 ;; esac
  printf '%s' "$exp"
}

# 0 logged in · 1 definitely not · 2 cannot tell locally. Only 1 alerts.
#
# Local validity is not authority: a token revoked server-side still parses
# fine here and only fails at the next real API call. That is what the boot
# gate's `kimi doctor` above is for, and what a rejection recorded by the duty
# flow catches — this check exists to be free, not to be final.
bot_cli_present() {
  local exp
  [ -s "$(_kimi_cred)" ] || return 1              # no file: /login never completed
  exp="$(_kimi_refresh_exp)" || return 2          # present but unparseable
  [ "$exp" -gt "$(date +%s)" ]
}

# No bot_cli_expiry: the floor tracks no expiry dates. _kimi_refresh_exp is
# still read above, but only to answer "expired or not" — see claude.conf.

AGENT_LOGIN_HINT="run the kimi CLI login (verify with: kimi doctor)"

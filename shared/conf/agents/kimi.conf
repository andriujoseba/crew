# agent profile: kimi — the runtime, role-agnostic.
# shellcheck shell=bash disable=SC2034

# The CLI has shipped two homes for the same credential — ~/.kimi and
# ~/.kimi-code — so the home is RESOLVED, never assumed:
#   1. $KIMI_CODE_HOME when set: explicit operator intent outranks any probe;
#   2. else the first known home that actually holds the credential;
#   3. else ~/.kimi-code, the old default, so a box with no credential
#      anywhere still answers 1 (definitely not) rather than a false 0.
# Step 3 is the one that keeps bot_cli_present honest: falling back to a path
# that was never checked would turn a logout into "cannot tell".
#
# Defined ABOVE BOT_PATH_PREPEND on purpose — that is an assignment evaluated
# when the profile is sourced, not a function called later.
_kimi_home() {
  local h
  [ -n "${KIMI_CODE_HOME:-}" ] && { printf '%s' "$KIMI_CODE_HOME"; return; }
  for h in "$HOME/.kimi" "$HOME/.kimi-code"; do
    [ -s "$h/credentials/kimi-code.json" ] && { printf '%s' "$h"; return; }
  done
  printf '%s' "$HOME/.kimi-code"
}

# The resolved home's bin first, then every other known home's. common.sh
# splices this verbatim into PATH, and an entry that does not exist costs
# nothing — which is why the fallbacks are cheaper than guessing right.
_kimi_path_prepend() {
  local home h out
  home="$(_kimi_home)"; out="$home/bin"
  for h in "$HOME/.kimi" "$HOME/.kimi-code"; do
    [ "$h" = "$home" ] || out="$out:$h/bin"
  done
  printf '%s' "$out"
}

BOT_PATH_PREPEND="$(_kimi_path_prepend)"

# --afk: no user is present, so auto-dismiss questions and auto-approve tool
# calls. Every sibling profile carries its vendor's spelling of this, and it
# is not optional: run_session runs each CLI with </dev/null, so a prompt has
# no stdin to read and no human to answer it — the session blocks until the
# role budget kills it and records rc=124 outcome=TIMEOUT (#240).
# Keep the vendor's credential lookup on the same resolved home as crew's
# local credential check. `env` is part of the command array so every consumer
# of BOT_CLI_CMD — real sessions and the boot probe below — gets one launch
# shape and cannot drift to a different credential home (#240).
BOT_CLI_CMD=(env "KIMI_CODE_HOME=$(_kimi_home)" kimi --afk -p)

# ── session identity and usage: the artifact-backed shape (#571) ─────────────
#
# THE READINGS BELOW ARE OBSERVED, on this box, against `kimi-cli 1.50.0`
# installed exactly as rig/commands/bootstrap-tenant.sh installs it, and are
# recorded in full on the PR. Where a shape could not be observed without a
# credential it is taken from the shipped package source and SAID to be, in
# the sentence that uses it.
#
# The whole of this section exists because kimi answers the usage question in
# a FILE rather than on stdout. `--output-format stream-json` exists but must
# be combined with `--print`, its `JsonPrinter` has no usage branch on any
# path, and the fleet's invocation passes neither. So there is no structured
# stdout to opt into here: this profile deliberately defines NEITHER
# `bot_cli_structured_cmd` NOR `bot_cli_structured_prose`, and the invocation
# above is byte-identical to what it was but for the id pin below — which is
# #475 D8's second declaration shape, and the reason it exists.

# _kimi_share_dir — the SESSION ARTIFACT root, which is NOT the credential
# home and must never be confused with it. `kimi_cli/share.py` resolves it as
# `$KIMI_SHARE_DIR` when set, else `~/.kimi`, and that is the whole rule:
# KIMI_CODE_HOME — the variable the invocation above sets, and the one
# `_kimi_home` resolves — steers the CREDENTIAL lookup and has no bearing on
# where sessions are written. A box whose credential lives in ~/.kimi-code
# still writes its sessions under ~/.kimi, so reading the artifact from
# `_kimi_home` would look right on a one-home box and silently measure
# nothing on the box this profile went to the trouble of supporting.
_kimi_share_dir() {
  printf '%s' "${KIMI_SHARE_DIR:-$HOME/.kimi}"
}

# bot_cli_session_id_args SID — pin a NEW session's id (#538 D2), which on
# this CLI is also what makes the usage artifact addressable at all (#571 D4).
#
# OBSERVED. `kimi --afk -p '…' --session <uuid>` on an id that does not exist
# CREATES the session at that exact id: `kimi_cli/cli/__init__.py` calls
# `Session.find(work_dir, session_id)` and, on None, `Session.create(work_dir,
# session_id)` — find-or-create on one flag. The probe ran on this box with no
# credential at all, exited 1 on `LLM not set`, and still left
# `~/.kimi/sessions/8331003854c45d801e9c7516a9cf2092/<the id passed>/wire.jsonl`
# — the id echoed onto the path, under the fleet's own `--afk -p` invocation,
# with no `--print` anywhere. That single observation settles #571 D6: the
# artifact is written under today's invocation, so no capture-shaped change to
# it is required and none is made.
#
# `--session` is legal in every UI mode. Only the value-less PICKER form is
# shell-only (`"--session without a session ID is only supported for shell
# UI"`), and this hook always renders a value. Its one documented conflict is
# `--continue`, which this profile never passes.
#
# NO `bot_cli_resume_args` IS DEFINED HERE, deliberately. On this CLI the same
# `--session <id>` flag would serve both, since find-or-create resumes an id
# that does exist — but resuming a killed session is #538's deliverable and a
# behaviour change to the lane, where this issue's charter is measurement. An
# absent resume hook is D2's stated neutral answer and leaves the lane exactly
# as it runs today.
bot_cli_session_id_args() {
  BOT_CLI_SESSION_ID_ARGS=(--session "$1")
}

# _kimi_wire_file SID — this session's wire.jsonl, or nothing.
#
# Located BY THE SESSION ID and by nothing else (#571 D4). The id is a path
# COMPONENT — the directory kimi names after the session — so the glob below
# is exact: a uuid cannot collide, and no work-dir hash has to be computed to
# find it. That last part is deliberate. The path is
# `<share>/sessions/<md5(work_dir)>/<session_id>/wire.jsonl` (verified: md5 of
# the probe's work dir `/tmp/kimiprobe` is the `8331…` component observed
# above), and md5sum is not among the engine's dependencies — bash, gh, jq,
# git, flock and timeout — so keying on the id instead of the hash buys the
# exact same answer without adding one.
#
# TWO MATCHES ARE A REFUSAL, not a choice. One id under two work-dir hashes is
# a shape this CLI cannot produce; if it ever does, picking either one is a
# measurement attributed to a session nobody identified, and absence is the
# honest answer D5 asks for.
#
# `unknown` is refused first and by name: it is what `_session_mint_sid`
# answers when no id could be minted and what `sid=` then carries on the
# record, and treating it as a path component would go looking for a directory
# literally called `unknown`.
#
# `.` and `..` are refused by name for the same kind of reason, and they are
# the reason a character class alone is not the whole guard: both are built
# entirely from characters the class below permits, and neither is a path
# COMPONENT — `..` composes `sessions/*/../wire.jsonl`, which is
# `sessions/wire.jsonl` after the shell resolves it, a file this lookup was
# never asked about. Nothing upstream can produce either today
# (`_session_sid_valid` gates the minted and the resumed id to a uuid), so
# this is depth rather than a hole being closed — but the arm costs one line
# and the alternative is a guard that reads as though it covered them.
_kimi_wire_file() {
  local sid="$1" share f match=""
  case "$sid" in
    ''|unknown|.|..) return 1 ;;
    *[!A-Za-z0-9._-]*) return 1 ;;
  esac
  share="$(_kimi_share_dir)"
  for f in "$share"/sessions/*/"$sid"/wire.jsonl; do
    [ -f "$f" ] || continue
    [ -z "$match" ] || return 1
    match="$f"
  done
  [ -n "$match" ] || return 1
  printf '%s' "$match"
}

# bot_cli_usage STRUCTURED_LOG SESSION_DIR PROSE_LOG SESSION_ID — normalize
# kimi's usage for the engine, read from the session artifact after the CLI
# has exited (#571 D2).
#
# The first three arguments are unused here and that is the point of the
# contract: this profile needs the identity, not the stdout. The read happens
# on the same post-session path as every other field, never while the CLI
# runs, because a running session is still appending to this file and a
# partial sum is a wrong measurement that looks exactly like a right one.
#
# THE RECORD. Each line of wire.jsonl is `{"timestamp":…,"message":{"type":…,
# "payload":{…}}}`, and the FIRST line is a metadata header
# (`{"type":"metadata","protocol_version":"1.10"}`) with no `message` at all —
# both shapes observed on this box. Usage rides `StatusUpdate.token_usage`,
# whose fields are `kosong.chat_provider.TokenUsage`: `input_other` (*"input
# tokens excluding input_cache_read and input_cache_creation"*, its own
# documentation, which is this contract's UNCACHED input by definition rather
# than by subtraction), `output`, `input_cache_read` and `input_cache_creation`.
# The two cache fields carry defaults of 0 in that model, so a record that
# omits them is a real zero rather than a missing measurement.
#
# SUMMED, NEVER SAMPLED (#571 D3). `token_usage` is documented as *"the token
# usage statistics of the current step"* and kimi's own reader
# (`kimi_cli/vis/api/statistics.py`) accumulates `+=` across every
# StatusUpdate in the file. One record is one step, so the session's figure is
# the sum over the series and a single-record fixture would pass under an
# implementation that simply took the last one.
#
# NO COST, EVER (#571 D7). Kimi reports no per-session money on any surface.
# And `model` is `unknown` on purpose: no wire record names the model —
# `StepBegin` carries only a step number — and the invocation cannot name it
# either, since `bot_cli_model_cmd` below refuses every tier, so nothing was
# ever appended for this to read back. The tier the duty asked for stays on
# SESSION END in its own field, where it is already honest.
#
# ABSENCE IS AN ANSWER (#571 D5). No id, no file, an unreadable or unparseable
# one, a file with no StatusUpdate record, a share dir pointing somewhere
# unreadable: every one of them returns non-zero, the engine emits no usage
# suffix, and the session's outcome, prose log and exit status are untouched.
# Nothing here writes a zero, which an aggregate could not tell from a cheap
# session.
bot_cli_usage() {
  local wire
  wire="$(_kimi_wire_file "${4:-}")" || return 1
  jq -sce --arg sid "${4:-}" '
    [ .[]
      | select(type == "object")
      | select(.message | type == "object")
      | select(.message.type == "StatusUpdate")
      | .message.payload
      | select(type == "object")
      | .token_usage
      | select(type == "object")
    ] as $steps
    | select(($steps | length) > 0)
    | select(all($steps[];
        [ .input_other, .output,
          (.input_cache_read // 0), (.input_cache_creation // 0) ]
        | all(type == "number" and . >= 0 and floor == .)))
    | {
        input_tokens: ([$steps[].input_other] | add),
        output_tokens: ([$steps[].output] | add),
        cache_read_input_tokens:
          ([$steps[] | .input_cache_read // 0] | add),
        cache_creation_input_tokens:
          ([$steps[] | .input_cache_creation // 0] | add),
        session_id: $sid,
        model: "unknown"
      }
  ' "$wire" 2>/dev/null
}

# bot_cli_model_cmd TIER — the explicit NOT-SUPPORTED answer (#469 D3), for
# the same reason grok.conf gives: crew does not ship a model flag it has not
# verified against the CLI, and a profile that cannot express a tier must say
# so rather than let one be ignored silently.
#
# There is a second reason here, and it is this profile's alone. The
# invocation is not a plain command — it is `env KIMI_CODE_HOME=… kimi …`,
# and the `env` prefix is part of the array deliberately (#240) so that every
# consumer of BOT_CLI_CMD gets one launch shape and cannot drift to a
# different credential home. A translation appending a flag to that array has
# to keep the prefix and the resolved home intact, which is exactly the kind
# of thing that is easy to get right once and lose in a later edit. It is
# worth writing only against a model flag that has been confirmed, and that
# has not happened yet.
#
# To enable it later: build from BOT_CLI_CMD — never retype the array — so the
# env prefix and _kimi_home's resolution come along for free.
bot_cli_model_cmd() {
  return 1
}

# Kimi's shell UI renders each tool block as "Using NAME (...)" while it runs
# and "Used NAME (...)" once it finishes. The duty roles make their durable
# writes through Shell, so either rendering is enough to distinguish a session
# that reached its tools from a final-answer-only no-op.
bot_session_acted() {
  grep -Eq '(^|[^[:alpha:]])(Using|Used) Shell[[:space:]]*\(' "$1"
}

# Vendor-specific terminal classification. Only the final non-empty line can
# describe why the CLI exited: earlier output can quote source, issues, or tool
# results containing a real vendor error before an unrelated transient failure.
# On that final line, require either Kimi's typed error envelope or both the 403
# envelope and quota wording.
# Observed sessions: heavy-duty/crew#388 and the 0.1.2 breaker drill fixture.
bot_session_terminal_fixture() {
  printf '%s\n' \
    "Server: Error code: 403 - {'error': {'message': \"You've reached your usage limit for this billing cycle.\", 'type': 'access_terminated_error'}}"
}

bot_session_terminal() {
  local failure_tail
  failure_tail="$(awk 'NF { line=$0 } END { print line }' "$1" 2>/dev/null)"
  printf '%s\n' "$failure_tail" \
    | grep -Eiq "['\"]type['\"][[:space:]]*:[[:space:]]*['\"]access_terminated_error['\"]" \
    || { printf '%s\n' "$failure_tail" | grep -Eiq 'Error code:[[:space:]]*403' \
      && printf '%s\n' "$failure_tail" \
        | grep -Eiq 'reached your usage limit|billing[- ]cycle quota'; }
}

bot_cli_probe() {
  env -u DUTY_LOCKED -u NOTIFY_LOCKED -u DUTY_SNAPSHOT \
    timeout -k 10 60 "${BOT_CLI_CMD[@]}" 'Reply with OK.' \
    </dev/null >/dev/null 2>&1
}

# Kimi keeps its OAuth credential in <home>/credentials/kimi-code.json, 0600
# inside a 0700 dir, where <home> is what _kimi_home resolved above.
# Everything below is a local read — no network, once per tick.
_kimi_cred() { printf '%s/credentials/kimi-code.json' "$(_kimi_home)"; }

# The refresh token is a JWT and its `exp` claim is the only one that means
# "a human must /login again" — same trap as claude.conf: `expires_at` in this
# file is the ACCESS token, which lives minutes and is refreshed silently, so
# testing it would report a healthy box as logged out continuously.
#
# Decoded with base64 + jq rather than python3: the engine depends only on
# bash+gh+jq+git+flock+timeout, and the kimi box is the one with no node.
# base64url is not base64 — the alphabet differs and the padding is stripped,
# so both are restored before decoding or base64 rejects the input.
_kimi_refresh_exp() {
  local f p exp
  f="$(_kimi_cred)"; [ -s "$f" ] || return 1
  p="$(jq -r '.refresh_token // empty' "$f" 2>/dev/null)" || return 1
  [ -n "$p" ] || return 1
  p="${p#*.}"; p="${p%%.*}"                       # the claims segment
  [ -n "$p" ] || return 1
  p="$(printf '%s' "$p" | tr '_-' '/+')"
  case $(( ${#p} % 4 )) in
    2) p="$p==" ;;
    3) p="$p=" ;;
    1) return 1 ;;                                # not a valid base64 length
  esac
  exp="$(printf '%s' "$p" | base64 -d 2>/dev/null | jq -r '.exp // empty' 2>/dev/null)" || return 1
  case "$exp" in ''|*[!0-9]*) return 1 ;; esac
  printf '%s' "$exp"
}

# 0 logged in · 1 definitely not · 2 cannot tell locally. Only 1 alerts.
#
# Local validity is not authority: a token revoked server-side still parses
# fine here and only fails at the next real API call. That is what the boot
# gate's real vendor probe above is for, and what a rejection recorded by the
# duty flow catches — this check exists to be free, not to be final.
bot_cli_present() {
  local exp
  [ -s "$(_kimi_cred)" ] || return 1              # no file: /login never completed
  exp="$(_kimi_refresh_exp)" || return 2          # present but unparseable
  [ "$exp" -gt "$(date +%s)" ]
}

# No bot_cli_expiry: the floor tracks no expiry dates. _kimi_refresh_exp is
# still read above, but only to answer "expired or not" — see claude.conf.

AGENT_LOGIN_HINT="run the kimi CLI login (verify with: kimi --afk -p 'Reply with OK.')"

# agent profile: kimi — the runtime, role-agnostic.
# shellcheck shell=bash disable=SC2034

# The CLI has shipped two homes for the same credential — ~/.kimi and
# ~/.kimi-code — so the home is RESOLVED, never assumed:
#   1. $KIMI_CODE_HOME when set: explicit operator intent outranks any probe;
#   2. else the first known home that actually holds the credential;
#   3. else ~/.kimi-code, the old default, so a box with no credential
#      anywhere still answers 1 (definitely not) rather than a false 0.
# Step 3 is the one that keeps bot_cli_present honest: falling back to a path
# that was never checked would turn a logout into "cannot tell".
#
# Defined ABOVE BOT_PATH_PREPEND on purpose — that is an assignment evaluated
# when the profile is sourced, not a function called later.
_kimi_home() {
  local h
  [ -n "${KIMI_CODE_HOME:-}" ] && { printf '%s' "$KIMI_CODE_HOME"; return; }
  for h in "$HOME/.kimi" "$HOME/.kimi-code"; do
    [ -s "$h/credentials/kimi-code.json" ] && { printf '%s' "$h"; return; }
  done
  printf '%s' "$HOME/.kimi-code"
}

# The resolved home's bin first, then every other known home's. common.sh
# splices this verbatim into PATH, and an entry that does not exist costs
# nothing — which is why the fallbacks are cheaper than guessing right.
_kimi_path_prepend() {
  local home h out
  home="$(_kimi_home)"; out="$home/bin"
  for h in "$HOME/.kimi" "$HOME/.kimi-code"; do
    [ "$h" = "$home" ] || out="$out:$h/bin"
  done
  printf '%s' "$out"
}

BOT_PATH_PREPEND="$(_kimi_path_prepend)"

# --afk: no user is present, so auto-dismiss questions and auto-approve tool
# calls. Every sibling profile carries its vendor's spelling of this, and it
# is not optional: run_session runs each CLI with </dev/null, so a prompt has
# no stdin to read and no human to answer it — the session blocks until the
# role budget kills it and records rc=124 outcome=TIMEOUT (#240).
# Keep the vendor's credential lookup on the same resolved home as crew's
# local credential check. `env` is part of the command array so every consumer
# of BOT_CLI_CMD — real sessions and the boot probe below — gets one launch
# shape and cannot drift to a different credential home (#240).
BOT_CLI_CMD=(env "KIMI_CODE_HOME=$(_kimi_home)" kimi --afk -p)

bot_cli_probe() {
  "${BOT_CLI_CMD[@]}" 'Reply with OK.' >/dev/null 2>&1
}

# Kimi keeps its OAuth credential in <home>/credentials/kimi-code.json, 0600
# inside a 0700 dir, where <home> is what _kimi_home resolved above.
# Everything below is a local read — no network, once per tick.
_kimi_cred() { printf '%s/credentials/kimi-code.json' "$(_kimi_home)"; }

# The refresh token is a JWT and its `exp` claim is the only one that means
# "a human must /login again" — same trap as claude.conf: `expires_at` in this
# file is the ACCESS token, which lives minutes and is refreshed silently, so
# testing it would report a healthy box as logged out continuously.
#
# Decoded with base64 + jq rather than python3: the engine depends only on
# bash+gh+jq+git+flock+timeout, and the kimi box is the one with no node.
# base64url is not base64 — the alphabet differs and the padding is stripped,
# so both are restored before decoding or base64 rejects the input.
_kimi_refresh_exp() {
  local f p exp
  f="$(_kimi_cred)"; [ -s "$f" ] || return 1
  p="$(jq -r '.refresh_token // empty' "$f" 2>/dev/null)" || return 1
  [ -n "$p" ] || return 1
  p="${p#*.}"; p="${p%%.*}"                       # the claims segment
  [ -n "$p" ] || return 1
  p="$(printf '%s' "$p" | tr '_-' '/+')"
  case $(( ${#p} % 4 )) in
    2) p="$p==" ;;
    3) p="$p=" ;;
    1) return 1 ;;                                # not a valid base64 length
  esac
  exp="$(printf '%s' "$p" | base64 -d 2>/dev/null | jq -r '.exp // empty' 2>/dev/null)" || return 1
  case "$exp" in ''|*[!0-9]*) return 1 ;; esac
  printf '%s' "$exp"
}

# 0 logged in · 1 definitely not · 2 cannot tell locally. Only 1 alerts.
#
# Local validity is not authority: a token revoked server-side still parses
# fine here and only fails at the next real API call. That is what the boot
# gate's real vendor probe above is for, and what a rejection recorded by the
# duty flow catches — this check exists to be free, not to be final.
bot_cli_present() {
  local exp
  [ -s "$(_kimi_cred)" ] || return 1              # no file: /login never completed
  exp="$(_kimi_refresh_exp)" || return 2          # present but unparseable
  [ "$exp" -gt "$(date +%s)" ]
}

# No bot_cli_expiry: the floor tracks no expiry dates. _kimi_refresh_exp is
# still read above, but only to answer "expired or not" — see claude.conf.

AGENT_LOGIN_HINT="run the kimi CLI login (verify with: kimi --afk -p 'Reply with OK.')"

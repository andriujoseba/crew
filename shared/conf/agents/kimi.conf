# agent profile: kimi — the runtime, role-agnostic.
# shellcheck shell=bash disable=SC2034

BOT_PATH_PREPEND="$HOME/.kimi-code/bin"

BOT_CLI_CMD=(kimi -p)

bot_cli_probe() {
  kimi doctor >/dev/null 2>&1
}

# UNVERIFIED against a real kimi box — `kimi doctor` is all this repo has ever
# known about kimi's auth, and it is opaque. Same contract as codex.conf: 0
# when a credential is visibly present, 2 otherwise, never 1. See that file
# for what finishing this looks like.
bot_cli_present() {
  [ -s "$HOME/.kimi-code/auth.json" ] && return 0
  [ -d "$HOME/.kimi-code" ] && return 2
  return 2
}
AGENT_LOGIN_HINT="run the kimi CLI login (verify with: kimi doctor)"

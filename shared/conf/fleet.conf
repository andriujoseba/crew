# fleet.conf — org-level configuration, identical on every box.
#
# This file is the single home of every value that used to be hardcoded
# per-bot (the bench appeared in three encodings in claude-bot's duty.sh
# alone, and a stale hardcoded roster shipped the rig#120 kimi-less panel).
# Change it here, redeploy everywhere.
#
# shellcheck shell=bash disable=SC2034

FLEET_ORG="heavy-duty"

# The review bench: the default panel when a repo's .github/labels.conf has
# no panel= line. panel_for_repo() prefers the repo's own line — per
# BUILDER.md the repo config governs, this list is only the fallback.
FLEET_BENCH="claude-bot-andresmgsl codex-bot-andresmgsl grok-bot-andresmgsl kimi-bot-andresmgsl"

# Triage never votes on PRs; a review request to it sits outstanding forever.
FLEET_TRIAGE="dan-claude-bot"

# The only identity that merges.
FLEET_HUMAN="danmt"

# Bot forks swept for review requests in addition to the org's repos
# (a review request is authorization wherever it lands — REVIEWER.md).
FLEET_SWEEP_EXTRA_REPOS="dan-claude-bot/incubator claude-bot-andresmgsl/incubator"

# Re-request-at-unchanged-head auto-approve (operator ruling 2026-07-23,
# ceremony#94: a stale verdict must not sit as a blocker when re-requested
# on the same tree). The ruling was issued on kimi's box; this engine
# applies it to every reviewer. Set 0 to disable fleet-wide.
AUTO_APPROVE_REREQUEST=1

# --- Label vocabulary (LABELS.md is the authority; these are its names) ---
LABEL_READY="ready"
LABEL_CLAIMED="claimed"
LABEL_BLOCKED="blocked"
LABEL_EPIC="epic"
LABEL_NEEDS_TRIAGE="needs-triage"
LABEL_ATTENTION="attention"
LABEL_NEEDS_HUMAN="state:needs-human"
BLOCKER_PREFIX="blocker:"

# --- Board marker strings — WIRE PROTOCOL, not decoration. Sibling agents
# and the announce dedup exact-match on these; change them fleet-wide or not
# at all. ---
MARK_REVIEWING="🔎 reviewing head"      # + " <full-sha>"
MARK_PICKUP="📌 picked up"
MARK_RESUME="⟲ resuming from"           # + " <sha>"
MARK_ADDRESSING="🔧 addressing round on head"  # + " <sha>"

# --- Session timeout budgets (seconds), calibrated from 44h of fleet
# metrics: triage median 424s max 946s; mentions max 1062s; hygiene max
# 683s; reviews max ~25min (kimi); builds max 29.5min (claude). Budgets sit
# comfortably above observed maxima; a hung CLI stops eating the lock at the
# budget instead of forever. ---
TIMEOUT_ATTENTION=1800
TIMEOUT_REVIEW=2700
TIMEOUT_BUILD=3600
TIMEOUT_RESUME=3600
TIMEOUT_HANDOFF=1200
TIMEOUT_REBASE=1800
TIMEOUT_TRIAGE=1500
TIMEOUT_MENTION=1500
TIMEOUT_HYGIENE=3000

# Hygiene sweep interval (seconds) — self-scheduling inside the duty tick,
# so a skipped top-of-hour tick delays hygiene to the next tick instead of
# losing the hour (the old separate hygiene cron also raced duty.sh over the
# shared checkouts; in-tick scheduling serializes them under one lock).
HYGIENE_INTERVAL=3600

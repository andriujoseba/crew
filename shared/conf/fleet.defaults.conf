# fleet.defaults.conf — shipped, fleet-invariant defaults.
#
# This file is the single home of every value that used to be hardcoded
# per-bot (the bench appeared in three encodings in claude-bot's duty.sh
# alone, and a stale hardcoded roster shipped the rig#120 kimi-less panel).
# Change it here, redeploy everywhere.
#
# shellcheck shell=bash disable=SC2034

# Re-request-at-unchanged-head auto-approve (operator ruling 2026-07-23,
# ceremony#94: a stale verdict must not sit as a blocker when re-requested
# on the same tree). The ruling was issued on kimi's box; this engine
# applies it to every reviewer. Set 0 to disable fleet-wide.
#
# 0 disables the auto-APPROVAL and nothing else (#151): a re-request newer
# than my standing verdict still queues a real review, at an unchanged head
# and at either flag value. It is not a switch for consulting the re-request.
AUTO_APPROVE_REREQUEST=1

# --- Label vocabulary (LABELS.md is the authority; these are its names) ---
#
# The first six are the QUEUE labels, and they are a set, not a list: LABELS.md
# declares that every open issue is needs-triage, epic, or exactly one of
# ready / claimed / blocked / post-merge, and the engine's board scan answers
# "does this issue carry a queue label" against exactly these. LABEL_POST_MERGE
# was absent until #358, so the engine enforced five where the doctrine
# declares six — and every issue triage correctly moved post-merge became a
# violation it could never clear. Adding a seventh queue label here means
# adding it to signal (b) in duty-triage.sh too; the test asserts the two
# agree with LABELS.md's own sentence.
LABEL_READY="ready"
LABEL_CLAIMED="claimed"
LABEL_BLOCKED="blocked"
LABEL_POST_MERGE="post-merge"
LABEL_EPIC="epic"
LABEL_NEEDS_TRIAGE="needs-triage"
LABEL_ATTENTION="attention"
LABEL_NEEDS_HUMAN="state:needs-human"
# The engine sets state:addressing optimistically when a round closes without
# full approval (#130); the reconciler stays authoritative. state:bots-reviewing
# and state:building have no engine writer here — the panel-request move that
# would set bots-reviewing is #133, and state:building is event-carried.
LABEL_ADDRESSING="state:addressing"
# Set by the engine in the same act as its panel request (#133); the reconciler
# stays authoritative and confirms it within seconds off the review_requested
# event.
LABEL_BOTS_REVIEWING="state:bots-reviewing"
BLOCKER_PREFIX="blocker:"

# --- Board marker strings — WIRE PROTOCOL, not decoration. Sibling agents
# and the announce dedup exact-match on these; change them fleet-wide or not
# at all. ---
MARK_REVIEWING="🔎 reviewing head"      # + " <full-sha>"
MARK_PICKUP="📌 picked up"
MARK_RESUME="⟲ resuming from"           # + " <sha>"
MARK_ADDRESSING="🔧 addressing round on head"  # + " <sha>"
# The session's "round answered" SIGNAL (#133): posted after it answers a round
# whole (reply + any fix pushed) and after it first marks a PR ready-for-review.
# The engine requests the panel only when a MARK_ANSWERED for the CURRENT head
# is present — the signal is the engine's licence to act, never commit activity.
MARK_ANSWERED="📣 round answered at head"  # + " <full-sha>"
MARK_HANDOFF="🤝 handed off at head"     # first line of the engine's factual handoff comment; + " <full-sha>"

# Attention is role-independent, so its budget lives here; every other
# session budget lives in the ROLE profile it belongs to (conf/roles/).
TIMEOUT_ATTENTION=1800

# Consecutive per-kind terminal vendor failures before that dispatch lane is
# stopped and the operator is alerted. Transient and unknown failures reset it.
SESSION_TERMINAL_THRESHOLD=3

# --- The reaper (#457) — fleet-invariant, and NOT per-role: a builder box
# accretes at least as fast as the triage box these were measured on, so the
# slot runs on every role and its cadence is a fleet fact. ---
#
# Every value is a whole number, and duty-reaper.sh mirrors all three as its
# own *_DEFAULT so a conf that predates them degrades instead of aborting the
# tick under `set -u`.
#
# The interval must be >= the tick period (5 minutes). A day is what the
# measured accretion asks for: claude-builder gains transcripts at roughly
# 60 sessions a day, so a daily walk is never more than a day behind, and the
# walk itself is a `find` over two trees.
REAPER_INTERVAL=86400
# Transcript retention, in days. 14 keeps two weeks of session records — long
# enough that the detector and telemetry work reads a real corpus, short
# enough to bound it: on claude-builder, 2026-08-26, 604 of 1083 transcripts
# were older than this and held 202 MB of the 544 MB total.
REAPER_TRANSCRIPT_DAYS=14
# Cache retention, in days, counted from LAST USE and not from the download.
# 30 is deliberately generous: a cache entry is expensive to rebuild (the
# fleet-floor browser walk's chromium is ~4 minutes and a sudo), so the value
# is set where an entry no box has read in a month is genuinely spare.
REAPER_CACHE_DAYS=30

# Prompt doctrine defaults. An operator doctrine.conf is resolved on the host
# and appended to the staged fleet.conf, overriding these without changing the
# shipped prompt templates.
DOCTRINE_ENTRYPOINT="AGENTS.md"
DOCTRINE_TRIAGE="TRIAGE.md"
DOCTRINE_BUILDER="BUILDER.md"
DOCTRINE_REVIEWER="REVIEWER.md"

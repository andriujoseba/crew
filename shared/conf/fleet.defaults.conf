# fleet.defaults.conf — shipped, fleet-invariant defaults.
#
# This file is the single home of every value that used to be hardcoded
# per-bot (the bench appeared in three encodings in claude-bot's duty.sh
# alone, and a stale hardcoded roster shipped the rig#120 kimi-less panel).
# Change it here, redeploy everywhere.
#
# shellcheck shell=bash disable=SC2034

# Re-request-at-unchanged-head auto-approve (operator ruling 2026-07-23,
# ceremony#94: a stale verdict must not sit as a blocker when re-requested
# on the same tree). The ruling was issued on kimi's box; this engine
# applies it to every reviewer. Set 0 to disable fleet-wide.
#
# 0 disables the auto-APPROVAL and nothing else (#151): a re-request newer
# than my standing verdict still queues a real review, at an unchanged head
# and at either flag value. It is not a switch for consulting the re-request.
AUTO_APPROVE_REREQUEST=1

# --- Label vocabulary (LABELS.md is the authority; these are its names) ---
#
# The first six are the QUEUE labels, and they are a set, not a list: LABELS.md
# declares that every open issue is needs-triage, epic, or exactly one of
# ready / claimed / blocked / post-merge, and the engine's board scan answers
# "does this issue carry a queue label" against exactly these. LABEL_POST_MERGE
# was absent until #358, so the engine enforced five where the doctrine
# declares six — and every issue triage correctly moved post-merge became a
# violation it could never clear. The queue set remains six: composing flags
# such as `operator` describe ownership rather than queue state and stay
# outside this set.
# Adding a seventh queue label here means adding it to signal (b) in
# duty-triage.sh too; the test asserts the two agree with LABELS.md's own
# sentence.
LABEL_READY="ready"
LABEL_CLAIMED="claimed"
LABEL_BLOCKED="blocked"
LABEL_POST_MERGE="post-merge"
LABEL_EPIC="epic"
LABEL_NEEDS_TRIAGE="needs-triage"
LABEL_ATTENTION="attention"
LABEL_OPERATOR="operator"
LABEL_NEEDS_HUMAN="state:needs-human"
# The engine sets state:addressing optimistically when a round closes without
# full approval (#130); the reconciler stays authoritative. state:bots-reviewing
# and state:building have no engine writer here — the panel-request move that
# would set bots-reviewing is #133, and state:building is event-carried.
LABEL_ADDRESSING="state:addressing"
# Set by the engine in the same act as its panel request (#133); the reconciler
# stays authoritative and confirms it within seconds off the review_requested
# event.
LABEL_BOTS_REVIEWING="state:bots-reviewing"
BLOCKER_PREFIX="blocker:"

# --- Board marker strings — WIRE PROTOCOL, not decoration. Sibling agents
# and the announce dedup exact-match on these; change them fleet-wide or not
# at all. ---
MARK_REVIEWING="🔎 reviewing head"      # + " <full-sha>"
MARK_PICKUP="📌 picked up"
MARK_RESUME="⟲ resuming from"           # + " <sha>"
MARK_ADDRESSING="🔧 addressing round on head"  # + " <sha>"
# The session's "round answered" SIGNAL (#133): posted after it answers a round
# whole (reply + any fix pushed) and after it first marks a PR ready-for-review.
# The engine requests the panel only when a MARK_ANSWERED for the CURRENT head
# is present — the signal is the engine's licence to act, never commit activity.
MARK_ANSWERED="📣 round answered at head"  # + " <full-sha>"
MARK_HANDOFF="🤝 handed off at head"     # first line of the engine's factual handoff comment; + " <full-sha>"

# Attention is role-independent, so its budget lives here; every other
# session budget lives in the ROLE profile it belongs to (conf/roles/).
TIMEOUT_ATTENTION=1800

# Optional operator override for consecutive per-kind terminal vendor failures.
# Empty makes the shipped default come from the operating-limit table, so the
# engine has one source for the limit while fleet.conf can still override it.
SESSION_TERMINAL_THRESHOLD=""

# Warn when a measured engine input reaches this percentage of a declared
# operating limit. The limits themselves live in common/operating-limits.sh;
# this is only the operator-tunable advance-warning margin (#482).
OPERATING_LIMIT_WARN_PCT=90

# Empty uses the shipped values in common/operating-limits.sh. Operators may
# override either threshold in fleet.conf without creating a second default.
VITALS_DISK_LOW_PCT=""
VITALS_MEMORY_LOW_PCT=""

# Durable handoff from a box-side limit assessment to the host floor. The
# engine prunes on write; probe.sh only carries the resulting bounded file.
DUTY_LIMIT_SPOOL_MAX=200
DUTY_LIMIT_SPOOL_TTL_S=86400

# Credential-pool identity for session accounting (#475). This is explicitly
# operator-declared: boxes cannot infer whether two vendor logins draw on one
# subscription. Use the same safe token on boxes sharing a pool and distinct
# tokens for distinct pools. Empty preserves the pre-accounting log shape.
SESSION_CREDENTIAL_POOL=""

# --- The session budget (#464) — the volume bound on dispatch ---
#
# The terminal breaker above asks "is the vendor dead"; this asks "has this
# lane spent enough". Four thousand perfectly successful sessions trip the
# first one not at all, which is how one box spent 224 hours of model time
# before a human noticed.
#
# THE CEILINGS THEMSELVES ARE NOT HERE. They are per role and per kind and
# live in conf/roles/, by the same rule the TIMEOUT_* above follow — except
# ATTENTION, which is role-independent, so its pair sits beside its timeout.
# Every one ships at 0, which is OFF: crew ships the mechanism and the
# operator sets the numbers, because a bound nobody chose is a bound that
# stops a fleet at 3am for a reason nobody wrote down.
#
# The rolling window, in seconds, for every lane that does not name its own
# BUDGET_WINDOW_<KIND>. Rolling rather than calendar so a Monday reset cannot
# be gamed by a Sunday night; a day because that is the unit the incident was
# measured in and the unit a quota renews in. Mirrored in
# shared/lib/common/breaker.sh as SESSION_BUDGET_WINDOW_DEFAULT, the same way
# duty-reaper.sh mirrors the three values above, so a conf predating this
# degrades instead of aborting the tick under `set -u`.
BUDGET_WINDOW=86400
# D6 — tell the operator BEFORE the ceiling, not only at it. One alert per
# crossing per kind at this percentage of whichever ceiling is armed. This is
# the line that replaces the Monday quota meter.
SESSION_BUDGET_ALERT_PCT=80
# Attention is role-independent, so its budget lives beside its timeout.
BUDGET_SESSIONS_ATTENTION=0
BUDGET_MINUTES_ATTENTION=0

# --- The reaper (#457) — fleet-invariant, and NOT per-role: a builder box
# accretes at least as fast as the triage box these were measured on, so the
# slot runs on every role and its cadence is a fleet fact. ---
#
# Every value is a whole number, and duty-reaper.sh mirrors all three as its
# own *_DEFAULT so a conf that predates them degrades instead of aborting the
# tick under `set -u`.
#
# The interval must be >= the tick period (5 minutes). A day is what the
# measured accretion asks for: claude-builder gains transcripts at roughly
# 60 sessions a day, so a daily walk is never more than a day behind, and the
# walk itself is a `find` over two trees.
REAPER_INTERVAL=86400
# Transcript retention, in days. 14 keeps two weeks of session records — long
# enough that the detector and telemetry work reads a real corpus, short
# enough to bound it: on claude-builder, 2026-08-26, 604 of 1083 transcripts
# were older than this and held 202 MB of the 544 MB total.
REAPER_TRANSCRIPT_DAYS=14
# Cache retention, in days, counted from LAST USE and not from the download.
# 30 is deliberately generous: a cache entry is expensive to rebuild (the
# fleet-floor browser walk's chromium is ~4 minutes and a sudo), so the value
# is set where an entry no box has read in a month is genuinely spare.
REAPER_CACHE_DAYS=30

# --- The session memory ceiling (#474) — the size bound on one dispatch ---
#
# The budget above asks "has this lane spent enough" and the timeout asks "has
# this session run long enough". Neither asks how BIG a session is allowed to
# get, and on 2026-08-14 one that reached 3.42 GB on a ~4 GB zero-swap guest
# took the whole box down with it.
#
# THE CEILING IS A PERCENTAGE OF THIS BOX'S MemTotal, not a number of bytes:
# the same conf ships to a 4 GiB triage box and a 16 GiB builder, so an
# absolute figure would be either useless on one or fatal on the other.
# A session whose measured peak (`peak_rss=` on SESSION END, #473) crosses it
# is terminated and reports `outcome=MEMORY`.
#
# 0 IS OFF, and off is what ships — the same rule the budgets follow, for the
# same reason: crew ships the mechanism and the operator picks the number,
# because a bound nobody chose is a bound that kills a build at 3am for a
# reason nobody wrote down. With every value here at 0 the engine starts no
# watchdog and behaves exactly as it did before this key existed.
#
# `oom_score_adj` on the session subshell is the OTHER half of #474 and has no
# key here on purpose: it has no number to pick, and a fleet where it is off is
# a fleet where the kernel is still free to kill `sshd` instead of the runaway.
SESSION_MEM_MAX_PCT=0
# The per-role override, and it wins over the fleet value above: a triage box
# and a builder box do not have the same profile. The suffix is the role name
# upper-cased. Where a box carries several roles the MOST RESTRICTIVE armed
# override wins — one box, one pool of memory — and a 0 here means "this role
# names no ceiling", never "this role forbids one", so a role opting out cannot
# disarm what a sibling role asked for.
SESSION_MEM_MAX_PCT_TRIAGE=0
SESSION_MEM_MAX_PCT_BUILDER=0
SESSION_MEM_MAX_PCT_REVIEWER=0

# Prompt doctrine defaults. An operator doctrine.conf is resolved on the host
# and appended to the staged fleet.conf, overriding these without changing the
# shipped prompt templates.
# Empty leaves doctrine-gap routing inert. A configured repository must also
# appear in repos.txt before a triage session is told to write there.
DOCTRINE_REPO=""
DOCTRINE_ENTRYPOINT="AGENTS.md"
DOCTRINE_TRIAGE="TRIAGE.md"
DOCTRINE_BUILDER="BUILDER.md"
DOCTRINE_REVIEWER="REVIEWER.md"

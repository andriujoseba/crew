# model-prices.conf — operator-editable USD rates and the single token-cost reader.
#
# Each row is vendor|model-id|uncached-input|output|cache-creation|cache-read,
# in USD per million tokens. `-` means that class is not priced for the model;
# it never means zero. Keep the vendor citation and read date beside every row.
# shellcheck shell=bash disable=SC2034

MODEL_TOKEN_RATES=(
  # Anthropic, read 2026-08-29:
  # https://platform.claude.com/docs/en/about-claude/pricing
  'claude|claude-sonnet-4-6|3|15|3.75|0.30'
  'claude|claude-haiku-4-5|1|5|1.25|0.10'
  'claude|claude-opus-4-1|15|75|18.75|1.50'
)

# model_token_cost_usd VENDOR MODEL TOKEN_RECORD
#
# TOKEN_RECORD is the space-delimited accounting suffix captured on SESSION
# END. Print the computed USD figure only when the model and every token class
# present on the record are priced. Unknown models, missing required token
# counts, malformed counts, or an explicitly recorded but unpriced class return
# 1 with no output. Missing optional cache fields contribute nothing.
model_token_cost_usd() {
  local vendor="${1:-}" model="${2:-}" record="${3:-}"
  local row row_vendor row_model input_rate output_rate create_rate read_rate
  local field key value input="" output="" create="" read="" create_seen=0 read_seen=0

  [ -n "$vendor" ] && [ -n "$model" ] && [ "$model" != unknown ] || return 1
  row=""
  for field in "${MODEL_TOKEN_RATES[@]}"; do
    IFS='|' read -r row_vendor row_model input_rate output_rate create_rate read_rate <<<"$field"
    if [ "$row_vendor" = "$vendor" ] && [ "$row_model" = "$model" ]; then
      row="$field"
      break
    fi
  done
  [ -n "$row" ] || return 1

  for field in $record; do
    key="${field%%=*}"
    value="${field#*=}"
    case "$key" in
      input_tokens) input="$value" ;;
      output_tokens) output="$value" ;;
      cache_creation_input_tokens) create="$value"; create_seen=1 ;;
      cache_read_input_tokens) read="$value"; read_seen=1 ;;
    esac
  done

  case "$input:$output" in
    *[!0-9:]*|:*|*:) return 1 ;;
  esac
  if [ "$create_seen" -eq 1 ]; then
    case "$create" in ''|*[!0-9]*) return 1 ;; esac
    [ "$create_rate" != - ] || return 1
  else
    create=0
  fi
  if [ "$read_seen" -eq 1 ]; then
    case "$read" in ''|*[!0-9]*) return 1 ;; esac
    [ "$read_rate" != - ] || return 1
  else
    read=0
  fi

  awk -v i="$input" -v o="$output" -v c="$create" -v r="$read" \
      -v ir="$input_rate" -v output_rate="$output_rate" \
      -v cr="$create_rate" -v rr="$read_rate" '
    BEGIN {
      cost = (i * ir + o * output_rate + c * cr + r * rr) / 1000000
      out = sprintf("%.9f", cost)
      sub(/0+$/, "", out)
      sub(/[.]$/, "", out)
      print out
    }
  '
}

# model_token_cost_matches_reported VENDOR MODEL TOKEN_RECORD REPORTED TOLERANCE
#
# Return success when the computed and vendor-reported USD figures differ by
# no more than TOLERANCE. The comparison delegates all token mapping and
# arithmetic to model_token_cost_usd so consumers cannot grow a second price
# calculation.
model_token_cost_matches_reported() {
  local vendor="${1:-}" model="${2:-}" record="${3:-}"
  local reported="${4:-}" tolerance="${5:-}" computed

  case "$reported" in ''|.|*[!0-9.]*|*.*.*) return 1 ;; esac
  case "$tolerance" in ''|.|*[!0-9.]*|*.*.*) return 1 ;; esac
  computed="$(model_token_cost_usd "$vendor" "$model" "$record")" || return 1
  awk -v computed="$computed" -v reported="$reported" -v tolerance="$tolerance" '
    BEGIN {
      difference = computed - reported
      if (difference < 0) difference = -difference
      exit !(difference <= tolerance)
    }
  '
}

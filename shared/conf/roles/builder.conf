# role profile: builder — the shape of the work, agent-agnostic.
#
# Session budgets calibrated from fleet metrics (builds max 29.5min
# observed; budgets sit comfortably above maxima).
# shellcheck shell=bash disable=SC2034

TIMEOUT_BUILD=3600
TIMEOUT_RESUME=3600
# Handoff spends no session at all (#91, ceremony#196 option B): the engine
# requests the human, sets state:needs-human, and posts the factual comment
# itself, so there is no handoff timeout to size.
TIMEOUT_REBASE=1800
# CI-red: usually a rerun and a wait, sometimes a real fix round. Sized below
# the build budget — long enough to diagnose and push a correction, short
# enough that a session waiting on a rerun that never finishes gives the box
# back before the next tick (#17).
TIMEOUT_CIRED=1800

# Model TIER, per duty (#469) — beside the timeouts above for the reason D2
# gives: they are two statements about the same duty's shape. Unset means "use
# the agent profile's BOT_CLI_CMD", unset is what ships (D4), and the value is
# whatever the agent profile's own CLI calls that tier.
#
# The variable suffix is the kind with non-alphanumerics folded to `_` and
# upper-cased — so the `ci-red` lane reads MODEL_CI_RED, the same fold
# BUDGET_*_CI_RED already uses. Note that this is NOT the timeout's spelling:
# TIMEOUT_CIRED predates the fold and keeps its name.
#
# #469 D6 puts review and build outside its recommendation set entirely, and
# these four lanes are that role's: build and resume are where the fleet's
# code comes from, and ci-red and rebase are repair work on a red head. None
# of them is recognition work, which is what the measurement identified as
# tierable. They exist here so the lever is uniform across roles, not because
# anything is proposing to pull them.
MODEL_BUILD=
MODEL_RESUME=
MODEL_REBASE=
MODEL_CI_RED=

# Session BUDGETS (#464) — the volume bound, beside the per-session bound the
# timeouts above give. A timeout caps one session; these cap how many and how
# long, per kind, in the rolling BUDGET_WINDOW from fleet.defaults.conf.
# Either ceiling alone arms the lane; 0 is OFF, and off is what ships.
#
# One kind per dispatch lane this role runs, and the lanes are NOT
# interchangeable: build is the long one and ci-red is the one that can spin
# on a rerun that never finishes, so a single shared ceiling would let either
# eat the other's day. The numbers are @danmt's per D5; `ci-red`'s variable
# suffix is CI_RED, the kind's non-alphanumerics folded to `_`.
BUDGET_SESSIONS_BUILD=0
BUDGET_MINUTES_BUILD=0
BUDGET_SESSIONS_RESUME=0
BUDGET_MINUTES_RESUME=0
BUDGET_SESSIONS_REBASE=0
BUDGET_MINUTES_REBASE=0
BUDGET_SESSIONS_CI_RED=0
BUDGET_MINUTES_CI_RED=0

# Box resources for `crew new` — the heavy role: persistent per-PR
# worktrees, full clones, language toolchains, the longest sessions.
# repos.txt is the PICKUP list AND the bound (danmt 2026-07-25) —
# author-side duties cover the repos in it, not every repo where the bot
# happens to author a PR. Authored PRs outside it are logged, never worked.
BOX_CPU="4"
BOX_MEMORY="8GiB"
BOX_DISK="60GiB"

# role profile: builder — the shape of the work, agent-agnostic.
#
# Session budgets calibrated from fleet metrics (builds max 29.5min
# observed; budgets sit comfortably above maxima).
# shellcheck shell=bash disable=SC2034

TIMEOUT_BUILD=3600
TIMEOUT_RESUME=3600
# Handoff spends no session at all (#91, ceremony#196 option B): the engine
# requests the human, sets state:needs-human, and posts the factual comment
# itself, so there is no handoff timeout to size.
TIMEOUT_REBASE=1800
# CI-red: usually a rerun and a wait, sometimes a real fix round. Sized
# between handoff and build — long enough to diagnose and push a correction,
# short enough that a session waiting on a rerun that never finishes gives the
# box back before the next tick (#17).
TIMEOUT_CIRED=1800

# Box resources for `crew new` — the heavy role: persistent per-PR
# worktrees, full clones, language toolchains, the longest sessions.
# repos.txt is the PICKUP list AND the bound (danmt 2026-07-25) —
# author-side duties cover the repos in it, not every repo where the bot
# happens to author a PR. Authored PRs outside it are logged, never worked.
BOX_CPU="4"
BOX_MEMORY="8GiB"
BOX_DISK="60GiB"

# role profile: reviewer — the shape of the work, agent-agnostic.
#
# Session budget calibrated from fleet metrics (reviews max ~25min, kimi).
# shellcheck shell=bash disable=SC2034

TIMEOUT_REVIEW=2700

# Session BUDGET (#464) — the volume bound, beside the per-session bound the
# timeout above gives. A timeout caps one review; these cap how many and how
# long, in the rolling BUDGET_WINDOW from fleet.defaults.conf. Either ceiling
# alone arms the lane; 0 is OFF, and off is what ships. The numbers are
# @danmt's per D5.
BUDGET_SESSIONS_REVIEW=0
BUDGET_MINUTES_REVIEW=0

# Box resources for `crew new` — lean: throwaway detached worktrees and
# shorter sessions. Needs linters and test runners (an undeclared toolchain
# gap becomes a "could not verify" clause in every verdict); repos.txt IS
# the queue (danmt 2026-07-25) — a review request authorizes a review only
# in a repo this box carries. Requests outside it are logged, never acted
# on; the repair is to add the repo.
BOX_CPU="2"
BOX_MEMORY="4GiB"
BOX_DISK="30GiB"

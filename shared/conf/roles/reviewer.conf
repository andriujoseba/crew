# role profile: reviewer — the shape of the work, agent-agnostic.
#
# Session budget calibrated from fleet metrics (reviews max ~25min, kimi).
# shellcheck shell=bash disable=SC2034

TIMEOUT_REVIEW=2700

# Model TIER for this duty (#469) — beside the timeout for the reason D2
# gives. Unset means "use the agent profile's BOT_CLI_CMD" and unset is what
# ships (D4); the value is whatever that profile's own CLI calls the tier, and
# a profile with no translation leaves the duty on the default and warns (D3).
#
# Review is outside D6's recommendation set explicitly. A verdict is the last
# gate before a human's merge button, and the fleet's whole convergence story
# rests on it being read properly — so the lever exists here for uniformity
# and nothing is proposing to pull it.
MODEL_REVIEW=

# Session BUDGET (#464) — the volume bound, beside the per-session bound the
# timeout above gives. A timeout caps one review; these cap how many and how
# long, in the rolling BUDGET_WINDOW from fleet.defaults.conf. Either ceiling
# alone arms the lane; 0 is OFF, and off is what ships. The numbers are
# @danmt's per D5.
BUDGET_SESSIONS_REVIEW=0
BUDGET_MINUTES_REVIEW=0

# Box resources for `crew new` — BUILDER PARITY, and not a tier of its own
# (#607 D1). A verdict re-runs the builder's whole suite to verify it, then
# runs a mutation probe — that same suite again against a deliberately
# corrupted copy — and then lint sweeps the builder never runs at all. The
# reviewer's heaviest command is therefore the builder's heaviest command
# plus more, and the heaviest command is what sets peak RAM. Measured on the
# 2 CPU / 4GiB box these numbers replace: `shellcheck -x` alone peaked at
# 2.94 GB over 24 files, and it took the box's OOM killer twice in one day
# (exit 137, #607) — with the agent at ~600 MB, dockerd and containerd at
# ~215 MB, and /tmp a tmpfs sized at half of RAM, there was no margin left.
#
# What the two roles genuinely differ in is WALL TIME, and wall time is not
# sized in RAM. Session length does not set peak RSS; the single heaviest
# process does. Keep these equal to builder.conf's — shared/test/conf.sh
# asserts the parity by reading both files, so trimming one alone reds.
#
# The detached worktrees are NOT throwaway and must not be sized as if they
# were: nothing removes them (#606), and a reviewer box measured after weeks
# of duty still carried review-256/ plus a second full copy of the tree.
#
# repos.txt IS the queue (danmt 2026-07-25) — a review request authorizes a
# review only in a repo this box carries. Requests outside it are logged,
# never acted on; the repair is to add the repo.
BOX_CPU="4"
BOX_MEMORY="8GiB"
BOX_DISK="60GiB"

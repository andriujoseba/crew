# role profile: triage — the shape of the work, agent-agnostic.
# Sole issue-minter; also the box that runs the operator notifier.
#
# Session budgets calibrated from fleet metrics (triage median 424s max
# 946s; mentions max 1062s; hygiene max 683s).
# shellcheck shell=bash disable=SC2034

TIMEOUT_TRIAGE=1500
TIMEOUT_MENTION=1500
TIMEOUT_HYGIENE=3000

# Maximum fresh notification threads carried by one tick-wide mention session.
# Any remainder stays outside the success commit and re-wakes next tick.
MENTION_THREAD_CEILING=50

# Hygiene sweep interval — self-scheduling inside the duty tick, so a
# skipped top-of-hour tick delays it instead of losing the hour.
HYGIENE_INTERVAL=3600

# Hygiene sweep FLOOR — the longest a repo may go without a session while its
# board sits unchanged (#465). The interval above says how often the gate
# LOOKS; this says how often a repo sweeps regardless of what it sees, and it
# is what keeps the change gate a saving rather than a hole: a 48h reclaim, a
# 7-day post-merge nudge and an issue the world made obsolete all turn on the
# clock and not on the board. On a static board this takes the cost from 24
# sessions a day to 2 and leaves the unconditional backstop intact.
# Kept equal to HYGIENE_FLOOR_DEFAULT in shared/lib/duty-hygiene.sh.
HYGIENE_FLOOR=43200

# Box resources for `crew new` — light: the triage box reads boards and
# launches short sessions. It carries the Telegram credentials for notify;
# repos.txt is the AUTHORITATIVE registry for this role.
BOX_CPU="2"
BOX_MEMORY="4GiB"
BOX_DISK="30GiB"
